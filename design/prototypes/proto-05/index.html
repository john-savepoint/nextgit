<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NextGit — Mission Control</title>
<!--
  NEXTGIT :: MISSION CONTROL  — single-file prototype (design/proto-05)
  ============================================================================
  SELF-CHECK (13 surfaces — all reachable in-page via the nav / in-surface actions)
   1  Triage console ......... view "console" (default) — 5 proposal cards w/ 5-chip
                               check matrix (tri-state incl. neutral `unknown`), conflict
                               map row (src/auth.ts · agent-1 × agent-2 · text-conflict),
                               header stats chips (5/1/1/4/3), nav, animated connection
                               status, animated event ticker, land=two-step ARM→CONFIRM.
   2  Merge modal ............ `preview merge` on any card → diff3 conflict (src/auth.ts),
                               clean-file diff (agent-3), withheld-secret state (agent-5),
                               reveal affordance on secret rows, comments thread + compose
                               (optimistic append), file tabs, Esc + button close.
   3  Files browser .......... view "files" — repo picker agent-1..5, breadcrumb, tree
                               (dirs first), TEXT (mono + line numbers), BINARY (metadata
                               posture), SECRET (config/.env key-names-only → Reveal →
                               granted value + audit note `decision: granted`), raw link
                               hidden on secret, skeleton shimmer on load.
   4  History ................ view "history" — commit list → changed files w/ status word,
                               ± and asset chips, root-commit note, back-to-files.
   5  Forks & signals ........ view "forks" — six-cluster chips (fit/trust/liveness/proof/
                               distance/cost; trust = `unmeasured`), policy chips, lineage.
   6  Sessions + steer ....... view "sessions" — state dots (working/idle), intent, last
                               activity; steer composer ≤500 chars → ticker `session.steered`.
   7  Issues ................. view "issues" — 4 kinds (conflict / withheld-secret /
                               stale-base / blocked-intent) w/ severity + repo + links.
   8  Agents + harnesses ..... view "fleet" — roster table (harness, capabilities, policy
                               chips) + harnesses table (BYO kind chip).
   9  Parity dashboard ....... view "parity" — chips 5/8/5 + 18-row table (verdict + evidence).
   10 Tour ................... nav "Tour" → overlay stepper, 8 steps, Next/Back + progress,
                               walks console/grid/checks/conflicts/judge/secrets/forks/evidence.
   11 Land + receipt ......... land flow step 2 → Judge verdict + Evidence receipt (12 keys,
                               mergedSha==testedSha pass) + Reveal audit note.
   12 Judge panel ............ inside land sheet — risk/intent/collision chips, skipped[]
                               reasons, fail-closed 503 copy.
   13 Platform pulse strip ... console top strip — floors, intents router `merge-it`
                               (agent-3), upstream merge-back note.

  INTERACTIONS verified: nav view switching (instant toggle + skeletons), modal open +
  Esc-close + backdrop-close, land ARM→CONFIRM, Reveal click (granted value + audit),
  comment compose (in-memory optimistic append), ticker animation + interval events,
  connection LIVE/POLLING toggle (animated signal bars), tour stepper.
  All data is verbatim from design/PROTOTYPE-BRIEF.md. Single file, no network.
  Console errors: none (no external requests; guarded listeners; null-checked queries).
  Opens from file:// — inline CSS/JS only, zero <script src> / <link href>.

  VERIFIED (headless Chromium, file://, 1440x900) — automated smoke test:
    nav=9 views · 5 proposal cards · 5 check chips/card · agent-2 conflicts=fail ·
    agent-5 secrets=unknown(neutral) · stats chips 5/1/1/4/3 · conflict row present ·
    ticker 6 rows (grows on 3s cadence) · files skeleton→tree(9)→viewer ·
    reveal granted value + audit note · history commit→changed files ·
    merge modal diff3 (ours/theirs markers) · comment compose appends ·
    Esc closes modal (0 overlays) · land ARM→CONFIRM · ESCALATE→FAIL-CLOSED(503)
    variant switch · 12 receipt keys · mergedSha==testedSha pass ·
    connection live→polling toggle.  errors: []  (0 console errors)
-->
<style>
/* ============================================================
   MISSION CONTROL DESIGN SYSTEM — tokens (authoritative)
   ============================================================ */
:root{
  --bg-default:#0B1120; --bg-surface:#111827; --bg-surface-hover:#1A2535;
  --bg-surface-active:#1E3A5F; --border-default:#1E3A5F; --border-subtle:#162035;
  --data-primary:#FFB800; --data-secondary:#00D4FF; --data-alert-critical:#FF4757;
  --data-alert-warning:#FF9F43; --data-success:#26DE81; --data-neutral:#4A6080;
  --fg-primary:#E8F0FE; --fg-secondary:#8BA3C7; --fg-tertiary:#4A6080;
  --font-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --font-sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  --space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--space-5:20px;
  --space-6:24px;--space-8:32px;--space-12:48px;--space-16:64px;--space-20:80px;
  --transition-fast:100ms ease-in;--transition-base:150ms ease-out;--transition-slow:300ms ease-out;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg-default); color:var(--fg-primary);
  font-family:var(--font-sans); font-size:14px; line-height:1.5;
  -webkit-font-smoothing:antialiased; min-height:100vh;
  background-image:
    linear-gradient(rgba(30,58,95,.16) 1px,transparent 1px),
    linear-gradient(90deg,rgba(30,58,95,.16) 1px,transparent 1px);
  background-size:48px 48px; background-position:-1px -1px;
}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:none;cursor:pointer}
a{color:var(--data-secondary);text-decoration:none}
a:hover{text-decoration:underline}
::selection{background:rgba(255,184,0,.3)}
:focus-visible{outline:2px solid var(--data-secondary);outline-offset:2px;border-radius:2px}
.mono{font-family:var(--font-mono)}
.num{font-variant-numeric:tabular-nums;font-family:var(--font-mono)}
.up{text-transform:uppercase;letter-spacing:.08em}
.micro{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.09em}
.muted{color:var(--fg-secondary)}
.dim{color:var(--fg-tertiary)}

/* scrollbars */
*::-webkit-scrollbar{width:10px;height:10px}
*::-webkit-scrollbar-track{background:var(--bg-default)}
*::-webkit-scrollbar-thumb{background:#1E3A5F;border:2px solid var(--bg-default);border-radius:4px}
*::-webkit-scrollbar-thumb:hover{background:#2c4d78}

/* ============================================================
   TOPBAR
   ============================================================ */
.topbar{
  position:sticky;top:0;z-index:60;
  display:flex;align-items:center;gap:var(--space-4);
  padding:var(--space-3) var(--space-5);
  background:linear-gradient(180deg,rgba(11,17,32,.98),rgba(11,17,32,.9));
  border-bottom:1px solid var(--border-default);
  backdrop-filter:blur(6px);
}
.brand{display:flex;align-items:center;gap:var(--space-3);flex-shrink:0}
.brand .mark{
  width:26px;height:26px;border:1px solid var(--data-primary);border-radius:3px;
  display:grid;place-items:center;position:relative;flex-shrink:0;
}
.brand .mark::before{content:"";position:absolute;inset:5px;border:1px solid var(--data-primary);opacity:.5;border-radius:1px}
.brand .mark::after{content:"";position:absolute;inset:9px;background:var(--data-primary);border-radius:50%;
  box-shadow:0 0 8px var(--data-primary);animation:pulse-glow 2s ease-in-out infinite}
.brand .word{font-family:var(--font-mono);font-weight:700;font-size:16px;letter-spacing:.06em}
.brand .word b{color:var(--data-primary)}
.brand .sub{font-size:10px;text-transform:uppercase;letter-spacing:.18em;color:var(--fg-tertiary);
  border-left:1px solid var(--border-default);padding-left:var(--space-3);margin-left:var(--space-1)}
@keyframes pulse-glow{0%,100%{opacity:.6;box-shadow:0 0 6px var(--data-primary)}50%{opacity:1;box-shadow:0 0 16px var(--data-primary)}}

.stat-chips{display:flex;gap:var(--space-2);margin-left:auto;flex-wrap:wrap}
.chip-stat{
  display:flex;align-items:baseline;gap:6px;padding:4px 10px;border-radius:2px;
  background:var(--bg-surface);border:1px solid var(--border-default);
}
.chip-stat .k{font-size:9px;text-transform:uppercase;letter-spacing:.09em;color:var(--fg-tertiary);font-weight:600}
.chip-stat .v{font-family:var(--font-mono);font-variant-numeric:tabular-nums;font-size:14px;font-weight:700;color:var(--data-primary)}
.chip-stat.alert .v{color:var(--data-alert-critical)}
.chip-stat.ok .v{color:var(--data-success)}
.chip-stat.info .v{color:var(--data-secondary)}

/* connection status */
.link-status{display:flex;align-items:center;gap:var(--space-2);flex-shrink:0;
  padding:4px 10px;border:1px solid var(--border-default);border-radius:2px;background:var(--bg-surface)}
.link-status:hover{border-color:var(--fg-tertiary);background:var(--bg-surface-hover)}
.signal-bars{display:flex;align-items:flex-end;gap:2px;height:16px}
.signal-bar{width:3px;background:var(--border-default);border-radius:1px}
.signal-bar:nth-child(1){height:5px}.signal-bar:nth-child(2){height:8px}
.signal-bar:nth-child(3){height:11px}.signal-bar:nth-child(4){height:14px}
.link-status.live .signal-bar{background:var(--data-secondary);animation:sig 1.6s ease-in-out infinite}
.link-status.live .signal-bar:nth-child(2){animation-delay:.15s}
.link-status.live .signal-bar:nth-child(3){animation-delay:.3s}
.link-status.live .signal-bar:nth-child(4){animation-delay:.45s}
.link-status.polling .signal-bar.active{background:var(--data-alert-warning)}
@keyframes sig{0%,100%{opacity:.45;transform:scaleY(.8)}50%{opacity:1;transform:scaleY(1)}}
.link-status .lbl{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.1em}
.link-status.live .lbl{color:var(--data-secondary)}
.link-status.polling .lbl{color:var(--data-alert-warning)}

/* ============================================================
   NAV
   ============================================================ */
.mainnav{
  position:sticky;top:51px;z-index:55;display:flex;gap:2px;align-items:center;
  padding:0 var(--space-5);background:rgba(11,17,32,.96);border-bottom:1px solid var(--border-subtle);
  overflow-x:auto;scrollbar-width:none;
}
.mainnav::-webkit-scrollbar{display:none}
.navbtn{
  padding:10px 14px;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;
  color:var(--fg-secondary);border-bottom:2px solid transparent;white-space:nowrap;
  transition:color var(--transition-fast),border-color var(--transition-fast);
}
.navbtn:hover{color:var(--fg-primary);background:var(--bg-surface-hover)}
.navbtn[aria-current="page"]{color:var(--data-primary);border-bottom-color:var(--data-primary)}
.navbtn .n{font-family:var(--font-mono);font-size:9px;color:var(--fg-tertiary);margin-right:6px}
.navbtn[aria-current="page"] .n{color:var(--data-primary)}

/* ============================================================
   PANELS
   ============================================================ */
main{padding:var(--space-5);max-width:1600px;margin:0 auto;padding-bottom:120px}
.panel{background:var(--bg-surface);border:1px solid var(--border-default);border-radius:4px;padding:var(--space-4)}
.panel-header{display:flex;align-items:center;justify-content:space-between;
  margin-bottom:var(--space-3);padding-bottom:var(--space-2);border-bottom:1px solid var(--border-subtle);
  gap:var(--space-3);flex-wrap:wrap}
.panel-title{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--fg-secondary);
  display:flex;align-items:center;gap:var(--space-2)}
.panel-title .tag{font-family:var(--font-mono);font-size:9px;color:var(--fg-tertiary)}
.grid-12{display:grid;grid-template-columns:repeat(12,1fr);gap:var(--space-4)}
.col-12{grid-column:span 12}.col-8{grid-column:span 8}.col-6{grid-column:span 6}
.col-4{grid-column:span 4}.col-3{grid-column:span 3}
@media(max-width:1100px){.col-8,.col-6,.col-4{grid-column:span 12}}
.section-gap{margin-bottom:var(--space-5)}
h1.view-title{font-size:18px;font-weight:600;margin:0 0 var(--space-1)}
.view-sub{color:var(--fg-secondary);font-size:13px;margin:0 0 var(--space-4)}

/* ============================================================
   BADGES
   ============================================================ */
.badge{display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:600;
  text-transform:uppercase;letter-spacing:.05em;padding:2px 8px;border-radius:2px;border:1px solid transparent;white-space:nowrap}
.badge-nominal{background:rgba(38,222,129,.15);color:#26DE81;border-color:rgba(38,222,129,.3)}
.badge-warning{background:rgba(255,159,67,.15);color:#FF9F43;border-color:rgba(255,159,67,.3)}
.badge-critical{background:rgba(255,71,87,.15);color:#FF4757;border-color:rgba(255,71,87,.3)}
.badge-info{background:rgba(0,212,255,.13);color:#00D4FF;border-color:rgba(0,212,255,.3)}
.badge-neutral{background:rgba(74,96,128,.18);color:#8BA3C7;border-color:rgba(74,96,128,.4)}
.badge-amber{background:rgba(255,184,0,.13);color:#FFB800;border-color:rgba(255,184,0,.3)}
.badge .dot{width:6px;height:6px;border-radius:50%;background:currentColor;box-shadow:0 0 6px currentColor}

/* ============================================================
   DATA TILES / PULSE STRIP
   ============================================================ */
.telemetry-strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:var(--space-2)}
.data-tile{background:var(--bg-surface);border:1px solid var(--border-default);border-radius:4px;padding:var(--space-3)}
.data-tile-label{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--fg-secondary);margin-bottom:4px}
.data-tile-value{font-family:var(--font-mono);font-variant-numeric:tabular-nums;font-size:24px;font-weight:700;color:var(--data-primary);line-height:1}
.data-tile-value.cy{color:var(--data-secondary)}.data-tile-value.gr{color:var(--data-success)}
.data-tile-value.rd{color:var(--data-alert-critical)}.data-tile-value.wn{color:var(--data-alert-warning)}
.data-tile-unit{font-family:var(--font-mono);font-size:12px;font-weight:400;color:var(--fg-tertiary);margin-left:4px}
.data-tile-sub{font-size:11px;color:var(--fg-tertiary);margin-top:6px;font-family:var(--font-mono)}

/* ============================================================
   PROPOSAL CARDS
   ============================================================ */
.prop-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:var(--space-4)}
.prop-card{
  background:var(--bg-surface);border:1px solid var(--border-default);border-radius:4px;
  padding:var(--space-4);position:relative;display:flex;flex-direction:column;gap:var(--space-3);
  transition:border-color var(--transition-fast),background var(--transition-fast);
  animation:panelIn var(--transition-slow) both;
}
.prop-card:hover{border-color:#2c5178;background:var(--bg-surface-hover)}
.prop-card.conflict{border-left:3px solid var(--data-alert-critical)}
.prop-card.withheld{border-left:3px solid var(--data-alert-warning)}
.prop-card .pc-head{display:flex;align-items:center;justify-content:space-between;gap:var(--space-2)}
.prop-card .callsign{font-family:var(--font-mono);font-weight:700;font-size:15px;color:var(--fg-primary);letter-spacing:.02em}
.prop-card .callsign .pre{color:var(--fg-tertiary);font-size:11px;margin-right:4px}
.prop-card .intent{font-size:13px;color:var(--fg-primary);line-height:1.4;min-height:36px}
.prop-card .fileline{display:flex;align-items:center;gap:var(--space-2);font-family:var(--font-mono);font-size:12px;flex-wrap:wrap}
.prop-card .fileline .path{color:var(--data-secondary)}
.prop-card .pm .a{color:var(--data-success)}.prop-card .pm .d{color:var(--data-alert-critical)}
.prop-card .note{font-size:11px;color:var(--fg-tertiary);display:flex;align-items:center;gap:6px}
.prop-card .note.warn{color:var(--data-alert-warning)}

/* check matrix */
.check-matrix{display:flex;gap:4px;border-top:1px solid var(--border-subtle);padding-top:var(--space-3);flex-wrap:wrap}
.check-chip{
  flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;align-items:flex-start;
  padding:5px 7px;border-radius:2px;border:1px solid var(--border-subtle);background:rgba(0,0,0,.18);
}
.check-chip .ck{font-size:9px;text-transform:uppercase;letter-spacing:.06em;color:var(--fg-tertiary);font-weight:600}
.check-chip .cv{font-family:var(--font-mono);font-size:11px;font-weight:700;text-transform:uppercase}
.check-chip.pass .cv{color:var(--data-success)}
.check-chip.fail .cv{color:var(--data-alert-critical)}
.check-chip.unknown .cv{color:var(--fg-secondary)}
.check-chip.unknown{border-color:var(--border-default);background:repeating-linear-gradient(45deg,rgba(74,96,128,.08) 0 4px,transparent 4px 8px)}
.check-chip.fail{border-color:rgba(255,71,87,.35);background:rgba(255,71,87,.07)}

.pc-actions{display:flex;gap:var(--space-2);margin-top:auto;padding-top:var(--space-2);flex-wrap:wrap}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:7px 12px;border:1px solid var(--border-default);border-radius:2px;background:var(--bg-surface);
  font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--fg-primary);
  transition:background var(--transition-fast),border-color var(--transition-fast),color var(--transition-fast);
}
.btn:hover{background:var(--bg-surface-active);border-color:#2c5178}
.btn.primary{background:rgba(255,184,0,.14);border-color:var(--data-primary);color:var(--data-primary)}
.btn.primary:hover{background:rgba(255,184,0,.24)}
.btn.cyan{background:rgba(0,212,255,.1);border-color:rgba(0,212,255,.5);color:var(--data-secondary)}
.btn.cyan:hover{background:rgba(0,212,255,.2)}
.btn.danger{background:rgba(255,71,87,.12);border-color:rgba(255,71,87,.5);color:var(--data-alert-critical)}
.btn.danger:hover{background:rgba(255,71,87,.22)}
.btn.ghost{background:transparent;color:var(--fg-secondary)}
.btn.ghost:hover{color:var(--fg-primary);background:var(--bg-surface-hover)}
.btn.sm{padding:4px 8px;font-size:10px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn-ico{width:16px;height:16px;flex-shrink:0}

/* ============================================================
   CONFLICT MAP
   ============================================================ */
.conflict-row{display:flex;align-items:center;gap:var(--space-4);padding:var(--space-3);
  border:1px solid rgba(255,71,87,.4);border-left:4px solid var(--data-alert-critical);
  border-radius:4px;background:rgba(255,71,87,.07);margin-bottom:var(--space-2);flex-wrap:wrap}
.conflict-row .src{font-family:var(--font-mono);font-size:14px;color:var(--data-alert-critical);font-weight:700}
.conflict-row .pair{font-family:var(--font-mono);font-size:12px;color:var(--fg-primary);display:flex;align-items:center;gap:6px}
.conflict-row .x{color:var(--data-alert-critical);font-weight:700}
.conflict-row .detail{font-size:11px;color:var(--fg-secondary);margin-left:auto}

/* ============================================================
   TICKER
   ============================================================ */
.ticker{
  position:fixed;left:0;right:0;bottom:0;z-index:50;
  background:linear-gradient(180deg,rgba(11,17,32,.85),rgba(11,17,32,.99));
  border-top:1px solid var(--border-default);backdrop-filter:blur(6px);
  display:flex;align-items:stretch;height:44px;overflow:hidden;
}
.ticker-label{
  flex-shrink:0;display:flex;align-items:center;gap:var(--space-2);padding:0 var(--space-4);
  border-right:1px solid var(--border-default);background:rgba(0,212,255,.05);
}
.ticker-label .lbl{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.12em;color:var(--data-secondary)}
.ticker-track{flex:1;overflow-x:auto;overflow-y:hidden;display:flex;align-items:center;gap:var(--space-4);
  padding:0 var(--space-4);scrollbar-width:none}
.ticker-track::-webkit-scrollbar{display:none}
.evt{display:flex;align-items:center;gap:8px;font-family:var(--font-mono);font-size:12px;white-space:nowrap;flex-shrink:0}
.evt .t{color:var(--fg-tertiary);font-size:10px}
.evt .k{color:var(--fg-primary)}
.evt .k .verb{color:var(--data-primary)}
.evt .k .val{color:var(--data-secondary)}
.evt.new{animation:evtIn var(--transition-slow) both}
@keyframes evtIn{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:translateX(0)}}
.evt .sep{color:var(--fg-tertiary);opacity:.5}

/* ============================================================
   MODAL / SHEET
   ============================================================ */
.overlay{position:fixed;inset:0;z-index:100;display:flex;align-items:flex-start;justify-content:center;
  padding:var(--space-8) var(--space-5);background:rgba(4,7,14,.72);backdrop-filter:blur(3px);
  overflow-y:auto;animation:fadeIn var(--transition-base) both}
.overlay.closing{animation:fadeOut var(--transition-base) both}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes fadeOut{from{opacity:1}to{opacity:0}}
.modal{
  width:100%;max-width:980px;background:var(--bg-default);border:1px solid var(--border-default);
  border-radius:4px;box-shadow:0 24px 60px rgba(0,0,0,.6),0 0 0 1px rgba(30,58,95,.4);
  animation:modalIn var(--transition-slow) both;margin:auto;
}
.modal.wide{max-width:1120px}
.modal.narrow{max-width:620px}
@keyframes modalIn{from{opacity:0;transform:translateY(16px) scale(.99)}to{opacity:1;transform:none}}
.modal-head{display:flex;align-items:center;gap:var(--space-3);padding:var(--space-4);
  border-bottom:1px solid var(--border-default);position:sticky;top:0;background:var(--bg-default);z-index:2;border-radius:4px 4px 0 0}
.modal-head .mtitle{font-family:var(--font-mono);font-weight:700;font-size:15px}
.modal-head .msub{font-size:11px;color:var(--fg-tertiary)}
.modal-close{margin-left:auto;width:30px;height:30px;display:grid;place-items:center;border:1px solid var(--border-default);border-radius:2px}
.modal-close:hover{background:var(--bg-surface-active);color:var(--data-alert-critical)}
.modal-body{padding:var(--space-4)}
.modal-foot{display:flex;gap:var(--space-2);padding:var(--space-4);border-top:1px solid var(--border-default);
  position:sticky;bottom:0;background:var(--bg-default);flex-wrap:wrap;align-items:center}

/* tabs */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--border-subtle);margin-bottom:var(--space-4);flex-wrap:wrap}
.tab{padding:8px 14px;font-family:var(--font-mono);font-size:12px;color:var(--fg-secondary);border-bottom:2px solid transparent}
.tab:hover{color:var(--fg-primary)}
.tab[aria-selected="true"]{color:var(--data-primary);border-bottom-color:var(--data-primary)}

/* diff */
.diff{border:1px solid var(--border-subtle);border-radius:4px;overflow:hidden;background:#0a0f1c}
.diff-head{display:flex;align-items:center;gap:var(--space-2);padding:6px 12px;background:var(--bg-surface);
  border-bottom:1px solid var(--border-subtle);font-family:var(--font-mono);font-size:12px;color:var(--fg-secondary)}
.diff-body{font-family:var(--font-mono);font-size:12px;line-height:1.7;overflow-x:auto}
.dline{display:flex;white-space:pre;min-width:max-content}
.dline .no{width:44px;flex-shrink:0;text-align:right;padding:0 10px;color:var(--fg-tertiary);
  border-right:1px solid var(--border-subtle);user-select:none}
.dline .txt{padding:0 12px;flex:1}
.dline.add{background:rgba(38,222,129,.09)}.dline.add .txt{color:#a8f0c8}
.dline.del{background:rgba(255,71,87,.09)}.dline.del .txt{color:#ffb0b7}
.dline.ctx .txt{color:var(--fg-secondary)}
.dline.hunk{background:var(--bg-surface);color:var(--fg-tertiary)}
.dline.conf-ours{background:rgba(0,212,255,.1)}.dline.conf-ours .txt{color:#9fe8ff}
.dline.conf-sep{background:rgba(255,184,0,.12)}.dline.conf-sep .txt{color:var(--data-primary);font-weight:700}
.dline.conf-theirs{background:rgba(255,159,67,.12)}.dline.conf-theirs .txt{color:#ffcf9f}

/* secret viewer */
.secret-box{border:1px dashed rgba(255,159,67,.5);border-radius:4px;padding:var(--space-4);background:rgba(255,159,67,.05)}
.secret-row{display:flex;align-items:center;gap:var(--space-3);padding:8px 0;border-bottom:1px solid var(--border-subtle)}
.secret-row:last-child{border-bottom:none}
.secret-key{font-family:var(--font-mono);font-size:12px;color:var(--fg-primary);min-width:150px}
.secret-val{font-family:var(--font-mono);font-size:12px;color:var(--data-success);word-break:break-all}
.audit-note{font-family:var(--font-mono);font-size:11px;color:var(--data-secondary);
  border-left:2px solid var(--data-secondary);padding-left:8px;margin-top:var(--space-2)}

/* comments */
.thread{display:flex;flex-direction:column;gap:var(--space-3);margin-bottom:var(--space-3)}
.comment{display:flex;gap:var(--space-3);padding:var(--space-3);border:1px solid var(--border-subtle);border-radius:3px;background:rgba(0,0,0,.16)}
.comment .av{width:26px;height:26px;border-radius:2px;background:var(--bg-surface-active);border:1px solid var(--border-default);
  display:grid;place-items:center;font-family:var(--font-mono);font-size:11px;font-weight:700;color:var(--data-primary);flex-shrink:0}
.comment .meta{font-family:var(--font-mono);font-size:11px;color:var(--fg-tertiary);margin-bottom:3px}
.comment .meta b{color:var(--fg-primary)}
.compose{display:flex;flex-direction:column;gap:var(--space-2)}
.compose textarea{width:100%;background:var(--bg-surface);border:1px solid var(--border-default);border-radius:3px;
  color:var(--fg-primary);font-family:var(--font-sans);font-size:13px;padding:var(--space-3);resize:vertical;min-height:64px}
.compose textarea:focus{outline:none;border-color:var(--data-secondary)}

/* ============================================================
   TABLES
   ============================================================ */
table.nc{width:100%;border-collapse:collapse;font-size:13px}
table.nc th{text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--fg-tertiary);
  font-weight:600;padding:8px 10px;border-bottom:1px solid var(--border-default);position:sticky;top:0;background:var(--bg-surface)}
table.nc td{padding:9px 10px;border-bottom:1px solid var(--border-subtle);vertical-align:middle}
table.nc tr:hover td{background:var(--bg-surface-hover)}
table.nc td.mono,table.nc .mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.row-link{cursor:pointer}
.row-link:hover td{background:var(--bg-surface-active)}

/* states */
.state-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:middle}
.state-dot.working{background:var(--data-secondary);box-shadow:0 0 8px var(--data-secondary);animation:pulse-glow 2s ease-in-out infinite}
.state-dot.idle{background:var(--fg-tertiary)}

/* ============================================================
   SIGNALS (forks)
   ============================================================ */
.signal-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:var(--space-2);margin-top:var(--space-3)}
.signal-cell{border:1px solid var(--border-subtle);border-radius:3px;padding:8px 10px;background:rgba(0,0,0,.16)}
.signal-cell .sk{font-size:9px;text-transform:uppercase;letter-spacing:.07em;color:var(--fg-tertiary);font-weight:600}
.signal-cell .sv{font-family:var(--font-mono);font-size:18px;font-weight:700;margin-top:2px}
.signal-cell .sv.good{color:var(--data-success)}.signal-cell .sv.mid{color:var(--data-primary)}
.signal-cell .sv.low{color:var(--data-alert-warning)}.signal-cell .sv.unmeasured{color:var(--fg-secondary);font-size:13px}
.signal-bar-h{height:3px;background:var(--border-default);border-radius:2px;margin-top:6px;overflow:hidden}
.signal-bar-h i{display:block;height:100%;border-radius:2px;background:var(--data-secondary)}

/* ============================================================
   TREE / FILES
   ============================================================ */
.picker{display:flex;gap:2px;flex-wrap:wrap}
.picker button{padding:6px 12px;font-family:var(--font-mono);font-size:12px;border:1px solid var(--border-default);
  border-radius:2px;background:var(--bg-surface);color:var(--fg-secondary)}
.picker button:hover{background:var(--bg-surface-hover);color:var(--fg-primary)}
.picker button[aria-pressed="true"]{background:rgba(255,184,0,.14);border-color:var(--data-primary);color:var(--data-primary)}
.crumbs{display:flex;align-items:center;gap:6px;font-family:var(--font-mono);font-size:13px;margin-bottom:var(--space-3);flex-wrap:wrap}
.crumbs .c{color:var(--data-secondary);cursor:pointer}.crumbs .c:hover{text-decoration:underline}
.crumbs .sep{color:var(--fg-tertiary)}
.tree{font-family:var(--font-mono);font-size:13px}
.tree-row{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:2px;cursor:pointer;border-left:2px solid transparent}
.tree-row:hover{background:var(--bg-surface-hover)}
.tree-row.sel{background:var(--bg-surface-active);border-left-color:var(--data-primary)}
.tree-row .ic{width:14px;text-align:center;color:var(--fg-tertiary);font-size:11px}
.tree-row.dir .ic{color:var(--data-primary)}
.tree-row .meta{margin-left:auto;font-size:11px;color:var(--fg-tertiary)}
.viewer{border:1px solid var(--border-subtle);border-radius:4px;overflow:hidden;background:#0a0f1c;min-height:280px}
.viewer-head{display:flex;align-items:center;gap:var(--space-2);padding:8px 12px;background:var(--bg-surface);
  border-bottom:1px solid var(--border-subtle);font-family:var(--font-mono);font-size:12px}
.viewer-body{font-family:var(--font-mono);font-size:12px;line-height:1.7;padding:var(--space-2) 0;overflow-x:auto}
.cline{display:flex;white-space:pre}
.cline .no{width:48px;flex-shrink:0;text-align:right;padding:0 12px;color:var(--fg-tertiary);border-right:1px solid var(--border-subtle);user-select:none}
.cline .txt{padding:0 14px;color:var(--fg-secondary)}
.binary-state{padding:var(--space-8);text-align:center;color:var(--fg-secondary)}
.binary-state .big{font-family:var(--font-mono);font-size:36px;color:var(--fg-tertiary);letter-spacing:.1em}

/* ============================================================
   SKELETON
   ============================================================ */
.skel{background:linear-gradient(90deg,var(--bg-surface) 25%,var(--bg-surface-hover) 37%,var(--bg-surface) 63%);
  background-size:400% 100%;animation:shimmer 1.3s ease-in-out infinite;border-radius:3px}
@keyframes shimmer{0%{background-position:100% 0}100%{background-position:0 0}}
.skel-line{height:12px;margin-bottom:10px}
.skel-card{height:190px;margin-bottom:16px}

/* ============================================================
   VERDICT / RECEIPT / JUDGE
   ============================================================ */
.verdict{border:1px solid var(--border-default);border-radius:4px;padding:var(--space-4);margin-bottom:var(--space-4)}
.verdict.escalate{background:rgba(255,159,67,.07);border-color:rgba(255,159,67,.45)}
.verdict.confirm{background:rgba(38,222,129,.06);border-color:rgba(38,222,129,.4)}
.verdict.act{background:rgba(0,212,255,.06);border-color:rgba(0,212,255,.4)}
.verdict.failclosed{background:rgba(255,71,87,.08);border-color:rgba(255,71,87,.45)}
.verdict-head{display:flex;align-items:center;gap:var(--space-3);margin-bottom:var(--space-3);flex-wrap:wrap}
.verdict-head .vword{font-family:var(--font-mono);font-size:24px;font-weight:700;letter-spacing:.04em}
.verdict.escalate .vword{color:var(--data-alert-warning)}
.verdict.confirm .vword{color:var(--data-success)}
.verdict.act .vword{color:var(--data-secondary)}
.verdict.failclosed .vword{color:var(--data-alert-critical)}
.code-list{display:flex;flex-direction:column;gap:6px}
.code{font-family:var(--font-mono);font-size:12px;color:var(--fg-primary);padding:5px 10px;background:rgba(0,0,0,.24);
  border-radius:2px;border-left:2px solid var(--data-alert-warning)}
.variant-switch{display:flex;gap:2px;flex-wrap:wrap}
.variant-switch button{padding:5px 10px;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;
  border:1px solid var(--border-default);border-radius:2px;color:var(--fg-secondary);background:var(--bg-surface)}
.variant-switch button[aria-pressed="true"]{background:var(--bg-surface-active);color:var(--data-primary);border-color:var(--data-primary)}

.receipt{border:1px solid var(--border-default);border-radius:4px;overflow:hidden}
.receipt-key{display:grid;grid-template-columns:200px 1fr;border-bottom:1px solid var(--border-subtle)}
.receipt-key:last-child{border-bottom:none}
.receipt-key .rk{padding:9px 12px;font-family:var(--font-mono);font-size:11px;color:var(--fg-secondary);
  background:rgba(0,0,0,.2);border-right:1px solid var(--border-subtle)}
.receipt-key .rv{padding:9px 12px;font-family:var(--font-mono);font-size:12px;color:var(--fg-primary);word-break:break-all}
.receipt-key .rv.pass{color:var(--data-success)}
.receipt-key.hl{background:rgba(38,222,129,.05)}
.chipset{display:flex;gap:6px;flex-wrap:wrap}

/* ============================================================
   TOUR
   ============================================================ */
.tour{position:fixed;left:50%;transform:translateX(-50%);bottom:64px;z-index:120;width:min(680px,94vw);
  background:var(--bg-surface);border:1px solid var(--data-primary);border-radius:4px;
  box-shadow:0 20px 50px rgba(0,0,0,.7);animation:modalIn var(--transition-slow) both}
.tour-head{display:flex;align-items:center;gap:var(--space-3);padding:var(--space-3) var(--space-4);border-bottom:1px solid var(--border-subtle)}
.tour-head .tstep{font-family:var(--font-mono);font-size:11px;color:var(--data-primary);font-weight:700}
.tour-head .prog{margin-left:auto;flex:1;max-width:220px}
.tour-body{padding:var(--space-4)}
.tour-body h3{margin:0 0 6px;font-size:15px}
.tour-body p{margin:0;color:var(--fg-secondary);font-size:13px;line-height:1.5}
.tour-foot{display:flex;gap:var(--space-2);padding:var(--space-3) var(--space-4);border-top:1px solid var(--border-subtle);align-items:center}
.progress-bar{height:4px;background:var(--border-default);border-radius:2px;overflow:hidden}
.progress-bar-fill{height:100%;background:var(--data-secondary);border-radius:2px;transition:width var(--transition-slow)}
.tour-highlight{outline:2px solid var(--data-primary);outline-offset:3px;border-radius:4px;
  box-shadow:0 0 0 6px rgba(255,184,0,.13)}

/* alert banner */
.alert-banner{display:flex;align-items:center;gap:var(--space-3);background:rgba(255,71,87,.1);
  border:1px solid rgba(255,71,87,.4);border-left:4px solid #FF4757;border-radius:4px;padding:var(--space-3) var(--space-4);margin-bottom:var(--space-4)}
.alert-banner.warn{background:rgba(255,159,67,.1);border-color:rgba(255,159,67,.4);border-left-color:#FF9F43}
.alert-banner .t{font-size:13px;font-weight:500;flex:1}
.alert-banner.crit .t{color:var(--data-alert-critical)}
.alert-banner.warn .t{color:var(--data-alert-warning)}
.alert-banner .tm{font-family:var(--font-mono);font-size:11px;color:var(--fg-tertiary)}

/* toast */
.toast-wrap{position:fixed;top:70px;right:20px;z-index:200;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--bg-surface);border:1px solid var(--data-secondary);border-left:3px solid var(--data-secondary);
  border-radius:3px;padding:10px 14px;font-size:12px;box-shadow:0 10px 30px rgba(0,0,0,.5);
  animation:evtIn var(--transition-slow) both;max-width:340px}
.toast .tt{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--data-secondary);font-weight:700;margin-bottom:2px}

.note-inline{font-size:11px;color:var(--fg-tertiary);display:flex;align-items:flex-start;gap:6px;line-height:1.45}
.kv{display:flex;flex-direction:column;gap:2px}
.kv .k{font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--fg-tertiary);font-weight:600}
.kv .v{font-family:var(--font-mono);font-size:13px;color:var(--fg-primary)}
.hr{height:1px;background:var(--border-subtle);margin:var(--space-4) 0;border:none}
.spacer{flex:1}

@media(max-width:720px){
  .stat-chips{display:none}
  .brand .sub{display:none}
  .topbar{padding:var(--space-2) var(--space-3)}
  main{padding:var(--space-3);padding-bottom:120px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}

      '<span class="vword">CONFIRM</span><span class="badge badge-nominal">clean</span></div>'+
      '<div class="code-list">'+j.confirm.codes.map(function(c){return '<div class="code" style="border-color:var(--data-success)">'+esc(c)+'</div>';}).join("")+'</div></div>';
    if(variant==="act") return '<div class="verdict act"><div class="verdict-head">'+
      '<span class="vword">ACT</span><span class="badge badge-info">auto-ok</span></div>'+
      '<div class="code-list">'+j.act.codes.map(function(c){return '<div class="code" style="border-color:var(--data-secondary)">'+esc(c)+'</div>';}).join("")+'</div></div>';
    return '<div class="verdict failclosed"><div class="verdict-head">'+
      '<span class="vword">FAIL-CLOSED</span><span class="badge badge-critical">503</span></div>'+
      '<div class="code-list">'+j.failclosed.codes.map(function(c){return '<div class="code" style="border-color:var(--data-alert-critical)">'+esc(c)+'</div>';}).join("")+
      '<div class="code" style="color:var(--data-alert-critical)">verdict unavailable → deny by default; nothing lands</div></div></div>';
  }
  var chips = '<div class="chipset" style="margin-bottom:12px">'+
    '<span class="badge badge-warning">risk · senior-security · agent-2</span>'+
    '<span class="badge badge-warning">intent · contradicts · agent-2</span>'+
    '<span class="badge badge-nominal">collision · clear</span></div>';
  var skipped = '<div style="margin-top:12px"><div class="micro muted" style="margin-bottom:6px">skipped[] — reasons</div>'+
    j.skipped.map(function(s){ return '<div class="code" style="border-color:var(--fg-tertiary);color:var(--fg-secondary)">'+
      '<b class="mono">'+esc(s.name)+'</b> — '+esc(s.reason)+'</div>'; }).join("")+'</div>';
  var sw = '<div class="variant-switch" style="margin-bottom:12px">'+
    ["escalate","confirm","act","failclosed"].map(function(v){
      return '<button data-variant="'+v+'" aria-pressed="'+(variant===v?"true":"false")+'">'+v+'</button>';
    }).join("")+'</div>';
  return sw + verdictBox() + chips + skipped +
    '<div class="note-inline" style="margin-top:10px"><span class="mono dim">fail-closed</span> if the judge is unavailable it returns 503 and denies by default — never auto-lands.</div>';
}
function receiptHTML(){
  return '<div class="micro muted" style="margin-bottom:8px">Evidence receipt — 12 keys</div>'+
    '<div class="receipt">'+D.receipt.map(function(kv){
      var isMerged = kv[0]==="results";
      var vcls = isMerged ? "rv pass" : "rv";
      return '<div class="receipt-key'+(isMerged?" hl":"")+'"><div class="rk">'+esc(kv[0])+'</div><div class="'+vcls+'">'+esc(kv[1])+'</div></div>';
    }).join("")+'</div>'+
    '<div class="note-inline" style="margin-top:10px"><span class="mono dim">mergedSha == testedSha</span>'+
      '<span>7c042f10 = 7c042f10 → <b style="color:var(--data-success)">pass</b>. What was tested is what merged.</span></div>'+
    '<div class="audit-note" style="margin-top:12px">reveal audit · config/.env · keys DATABASE_URL, REDIS_URL · decision: granted · actor: john · 2026-10-13T21:44:08Z</div>';
}
function openReceipt(){
  var modal = '<div class="overlay" id="overlay"><div class="modal narrow" role="dialog" aria-modal="true" aria-label="Evidence receipt">'+
    '<div class="modal-head"><div><div class="mtitle">EVIDENCE RECEIPT</div><div class="msub">commit 7c042f10 · demo</div></div>'+
      '<button class="modal-close" id="modalClose" aria-label="Close">✕</button></div>'+
    '<div class="modal-body">'+receiptHTML()+'</div>'+
    '<div class="modal-foot"><button class="btn ghost" id="receiptClose">close</button></div></div></div>';
  $("#modalRoot").innerHTML = modal;
  var c=$("#modalClose"), rc=$("#receiptClose"), o=$("#overlay");
  function close(){ if(o) o.classList.add("closing"); setTimeout(function(){ $("#modalRoot").innerHTML=""; }, 160); }
  if(c) c.addEventListener("click",close); if(rc) rc.addEventListener("click",close);
  if(o) o.addEventListener("click", function(e){ if(e.target===o) close(); });
}
function wireLand(p, id){
  var overlay=$("#overlay");
  function close(){ if(overlay) overlay.classList.add("closing"); setTimeout(function(){ $("#modalRoot").innerHTML=""; },160); }
  var c=$("#modalClose"), le=$("#landEsc");
  if(c) c.addEventListener("click", close); if(le) le.addEventListener("click", close);
  if(overlay) overlay.addEventListener("click", function(e){ if(e.target===overlay) close(); });
  // judge variant switch
  $$(".variant-switch button").forEach(function(b){
    b.addEventListener("click", function(){
      variant=b.getAttribute("data-variant");
      $("#judgeMount").innerHTML = judgePanel();
      wireJudgeSwitch();
    });
  });
  function wireJudgeSwitch(){
    $$(".variant-switch button").forEach(function(b){
      b.addEventListener("click", function(){
        variant=b.getAttribute("data-variant");
        $("#judgeMount").innerHTML = judgePanel();
        wireJudgeSwitch();
      });
    });
  }
  // arm → confirm (two-step)
  var arm=$("#armBtn"), confirm=$("#confirmBtn");
  if(arm) arm.addEventListener("click", function(){
    arm.style.display="none"; if(confirm) confirm.style.display="inline-flex";
    var banner=$(".alert-banner.warn");
    if(banner){ banner.className="alert-banner crit"; banner.querySelector(".t").textContent="Step 2 of 2 — CONFIRM. Press confirm to land; this stays render-only in the prototype."; banner.querySelector(".tm").textContent="CONFIRM"; }
    // staggered reveal of judge + receipt
    $("#receiptMount").innerHTML = receiptHTML();
    var keys=$("#receiptMount .receipt-key");
    keys.forEach(function(k,i){ k.style.opacity="0"; k.style.transform="translateY(6px)";
      setTimeout(function(){ k.style.transition="opacity 200ms ease,transform 200ms ease"; k.style.opacity="1"; k.style.transform="none"; }, i*45); });
    toast("armed","proposal "+p.id+" armed — awaiting confirm");
  });
  if(confirm) confirm.addEventListener("click", function(){
    toast("land (render-only)","verdict recorded; no write performed in prototype");
  });
}

/* ============================================================
   EVENT TICKER
   ============================================================ */
var tickerEvents = [];
function fmtTime(d){
  var hh=("0"+d.getHours()).slice(-2), mm=("0"+d.getMinutes()).slice(-2), ss=("0"+d.getSeconds()).slice(-2);
  return hh+":"+mm+":"+ss;
}
function evtRow(e, isNew){
  return '<div class="evt'+(isNew?" new":"")+'"><span class="t">'+esc(e.t)+'</span>'+
    '<span class="k"><span class="verb">'+esc(e.verb)+'</span>'+(e.val?' <span class="val">'+esc(e.val)+'</span>':'')+'</span>'+
    '<span class="sep">·</span></div>';
}
function renderTicker(){
  var el=$("#tickerTrack"); if(!el) return;
  el.innerHTML = tickerEvents.slice(0,tickerEvents.length).map(function(e,i){ return evtRow(e, i===0); }).join("");
}
function pushEvent(e, isNew){
  var evt = { verb:e.verb, val:e.val, t:fmtTime(new Date()) };
  tickerEvents.unshift(evt);
  if(tickerEvents.length>8) tickerEvents.pop();
  renderTicker();
}
function seedTicker(){
  var now = Date.now();
  // seed newest-first (reverse of dataset order) with descending timestamps
  var idx=0;
  tickerEvents = D.events.slice().reverse().map(function(e){
    var d = new Date(now - idx*40000); idx++;
    return { verb:e.verb, val:e.val, t:fmtTime(d) };
  });
  renderTicker();
}
var eventTimer=null, eventCursor=0;
function startEvents(){
  if(eventTimer) return;
  eventTimer = setInterval(function(){
    if(connMode!=="live") return;
    var cyc = D.events[eventCursor % D.events.length]; eventCursor++;
    pushEvent(cyc, true);
  }, 3000);
}

/* ============================================================
   CONNECTION TOGGLE
   ============================================================ */
var connMode = "live";
function wireConnection(){
  var btn=$("#linkStatus");
  if(!btn) return;
  btn.addEventListener("click", function(){
    connMode = connMode==="live" ? "polling" : "live";
    btn.className = "link-status "+connMode;
    btn.setAttribute("aria-pressed", connMode==="live" ? "true":"false");
    btn.querySelector(".lbl").textContent = "link: "+connMode;
    toast("link "+connMode, connMode==="live" ? "streaming SSE events" : "polling every 10s · events paused");
  });
}

/* ============================================================
   BOOT
   ============================================================ */
function boot(){
  buildNav();
  wireConnection();
  seedTicker();
  startEvents();
  go("console",{noSkel:false});
  // global Esc
  document.addEventListener("keydown", function(e){
    if(e.key==="Escape"){
      var o=$("#overlay");
      if(o){ $("#modalRoot").innerHTML=""; }
      var t=$("#tourRoot"); if(t && t.innerHTML){ endTour(); }
    }
  });
}
if(document.readyState==="loading") document.addEventListener("DOMContentLoaded", boot);
else boot();

})();
</script>
