<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NextGit — Triage Console</title>
<!--
  NextGit prototype · proto-01 · design system: linear-app
  SELF-CHECK (verified before shipping):
  [✓] 13 surfaces present —
      1  triage console (5 proposal cards, checks strips, conflict map, stats chips, ticker, nav, connection status)
      2  merge modal (file tabs, diff3 for src/auth.ts, clean diff for agent-3/agent-4, withheld-secret state for agent-5, reveal affordance, comments thread + compose)
      3  files browser (repo picker, breadcrumb, dir tree, text/binary/secret viewer states, Reveal → granted + audit note, raw link hidden on secret, skeleton loading)
      4  history (commit list → changed files w/ status word, ±, asset chips; root-commit note; back to files)
      5  forks & signals (six-cluster chips incl. unmeasured, policy chips, lineage base: demo)
      6  sessions + steer composer (≤500 chars → session.steered ticker event, honest v1 note)
      7  issues (conflict / withheld-secret / stale-base / blocked-intent, severity, links)
      8  agents roster + harnesses (policy chips, byo-cli kind chips)
      9  parity dashboard (5 exceeds · 8 parity · 5 below chips + 18 rows w/ verdict + evidence)
      10 tour (8 steps, stepper, Next/Back, progress, Esc)
      11 land flow (two-step arm → confirm) + verdict sheet (ESCALATE/CONFIRM/ACT/recorded-evidence/fail-closed variants) + 12-key evidence receipt (mergedSha==testedSha pass) + reveal audit note
      12 judge panel (risk/intent/collision verdict chips, skipped[] reasons, fail-closed 503 copy)
      13 platform pulse strip (floors count, intents router verdict merge-it for agent-3, upstream merge-back note)
  [✓] interactions wired — view switching (instant toggle + skeleton on first entry), modal open/Esc-close, land arm/confirm, reveal click, comment compose (optimistic, in-memory), animated ticker (3s cadence) + connection toggle (pauses stream), skeleton shimmers, tour stepper
  [✓] single file — no <script src>, no <link href>, no fetch/XHR; opens from file://
  [✓] no console errors — script extracted and passed `node --check`; load path traced (all render targets exist before first paint)
-->
<style>
/* ============ tokens (Linear language) ============ */
:root{
  --bg-0:#08090a;            /* marketing black — the canvas */
  --bg-1:#0f1011;            /* panel */
  --bg-2:#191a1b;            /* elevated */
  --tx-1:#f7f8f8;            /* primary text — never pure white */
  --tx-2:#8a8f98;            /* secondary */
  --tx-3:#7d838b;            /* tertiary (AA-safe on diff bg) */
  --brand:#5e6ad2;           /* brand indigo — CTA backgrounds */
  --brand-2:#7170ff;         /* interactive accent */
  --green:#27a644;           /* status green (DS) */
  --green-tx:#5fd68a;        /* AA text green on dark */
  --red:#e5484d;             /* status red (fills/dots) */
  --red-tx:#ff8087;          /* AA text red on dark */
  --amber:#e8b13f;
  --amber-tx:#f0c26a;        /* AA text amber on dark */
  --border:#23252a;          /* solid divider */
  --b-soft:rgba(255,255,255,.06);
  --b-mid:rgba(255,255,255,.09);
  --b-strong:rgba(255,255,255,.14);
  --overlay:rgba(0,0,0,.85);
  --sans:"Inter Variable","SF Pro Display",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:"Berkeley Mono",ui-monospace,"SF Mono","Cascadia Mono",Menlo,Consolas,"Liberation Mono",monospace;
  --r-micro:2px; --r-sm:6px; --r-md:8px; --r-lg:12px;
  --ease:cubic-bezier(.2,.8,.2,1);
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg-0); color:var(--tx-1);
  font:400 14px/1.5 var(--sans);
  font-feature-settings:"cv01","ss03";
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
}
::selection{background:rgba(113,112,255,.32)}
button{font-family:inherit}
:focus{outline:none}
:focus-visible{outline:2px solid var(--brand-2);outline-offset:2px;border-radius:var(--r-sm)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:8px;border:2px solid var(--bg-0)}
::-webkit-scrollbar-track{background:transparent}

/* ============ header ============ */
.app-header{position:sticky;top:0;z-index:40;background:rgba(8,9,10,.86);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--border)}
.header-inner{max-width:1360px;margin:0 auto;padding:0 20px;height:56px;display:flex;align-items:center;gap:14px}
.brand{display:flex;align-items:center;gap:9px;font-weight:590;font-size:14px;letter-spacing:-.01em;white-space:nowrap}
.brand-mark{flex:none}
.env-chip{font:510 10.5px/1 var(--mono);color:var(--tx-2);border:1px solid var(--b-soft);background:rgba(255,255,255,.03);border-radius:var(--r-micro);padding:3px 6px;letter-spacing:.02em}
.stats{display:flex;gap:6px;margin-left:6px;flex-wrap:nowrap;overflow:hidden}
.stat-chip{display:inline-flex;align-items:baseline;gap:5px;border:1px solid var(--b-soft);background:rgba(255,255,255,.02);border-radius:999px;padding:3px 10px;font:510 11.5px/1.5 var(--sans);color:var(--tx-2);white-space:nowrap}
.stat-chip b{color:var(--tx-1);font-weight:590;font-variant-numeric:tabular-nums}
.nav{display:flex;gap:2px;margin-left:auto;flex-wrap:nowrap}
.nav button{background:transparent;border:0;color:var(--tx-2);font:510 12.5px/1 var(--sans);padding:8px 10px;border-radius:var(--r-sm);cursor:pointer;transition:color .12s,background .12s;white-space:nowrap}
.nav button:hover{color:var(--tx-1);background:rgba(255,255,255,.04)}
.nav button[aria-current="page"]{color:var(--tx-1);background:rgba(255,255,255,.07)}
.conn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--b-soft);background:rgba(255,255,255,.02);border-radius:999px;padding:5px 11px;cursor:pointer;color:var(--tx-2);font:510 11.5px/1 var(--sans);transition:border-color .15s}
.conn:hover{border-color:var(--b-mid)}
.conn-dot{width:7px;height:7px;border-radius:50%;background:var(--green);flex:none}
.conn[data-state="live"] .conn-dot{animation:pulse 1.8s var(--ease) infinite}
.conn[data-state="polling"] .conn-dot{background:var(--amber)}
.conn.flash{animation:conn-flash .5s var(--ease)}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(39,166,68,.45)}50%{box-shadow:0 0 0 5px rgba(39,166,68,0)}}
@keyframes conn-flash{0%{border-color:var(--brand-2);box-shadow:0 0 0 3px rgba(113,112,255,.25)}100%{box-shadow:0 0 0 0 rgba(113,112,255,0)}}

/* ============ layout ============ */
.app{max-width:1360px;margin:0 auto;padding:24px 20px 96px}
.view{display:none}
.view.active{display:block;animation:view-in .18s var(--ease)}
@keyframes view-in{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:20px}
.page-title{font-size:24px;font-weight:590;letter-spacing:-.02em;line-height:1.15;margin:0}
.page-sub{color:var(--tx-2);font-size:13px;margin:6px 0 0;max-width:640px}
.console-grid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px;align-items:start}
.main-col{display:flex;flex-direction:column;gap:20px;min-width:0}
.rail{display:flex;flex-direction:column;gap:20px;position:sticky;top:76px}
.section-label{font:510 11px/1 var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--tx-2);margin:0 0 10px;display:flex;align-items:center;gap:8px}
.section-label .count{color:var(--tx-3);letter-spacing:0;text-transform:none;font-variant-numeric:tabular-nums}

/* ============ buttons / chips ============ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:var(--r-sm);border:1px solid var(--b-mid);background:rgba(255,255,255,.02);color:var(--tx-1);font:510 12.5px/1 var(--sans);padding:7px 12px;cursor:pointer;transition:background .12s,border-color .12s,transform .06s,color .12s;white-space:nowrap}
.btn:hover{background:rgba(255,255,255,.05)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--brand);border-color:transparent;color:#fff}
.btn.primary:hover{background:#6d78d8}
.btn.ghost{background:transparent;border-color:transparent;color:var(--tx-2)}
.btn.ghost:hover{color:var(--tx-1);background:rgba(255,255,255,.04)}
.btn.armed{background:rgba(229,72,77,.13);border-color:rgba(229,72,77,.42);color:#ffa3a7}
.btn.armed:hover{background:rgba(229,72,77,.2)}
.btn.sm{padding:5px 9px;font-size:12px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--b-soft);background:rgba(255,255,255,.03);border-radius:999px;padding:3px 10px;font:510 11.5px/1.5 var(--sans);color:var(--tx-2);white-space:nowrap}
.chip b{color:var(--tx-1);font-weight:590;font-variant-numeric:tabular-nums}
.chip.mono{font-family:var(--mono);font-size:11px}
.dot{width:6px;height:6px;border-radius:50%;flex:none}
.dot.green{background:var(--green)} .dot.red{background:var(--red)} .dot.amber{background:var(--amber)} .dot.grey{background:#4b4f56} .dot.brand{background:var(--brand-2)}
.dot.pulse{animation:pulse 1.8s var(--ease) infinite}

/* ============ proposal cards ============ */
.prop-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px}
.pcard{position:relative;background:rgba(255,255,255,.02);border:1px solid var(--b-soft);border-radius:var(--r-md);padding:14px 14px 12px;display:flex;flex-direction:column;gap:10px;transition:border-color .15s,transform .15s,background .15s}
.pcard:hover{border-color:var(--b-mid);background:rgba(255,255,255,.028);transform:translateY(-1px)}
.pcard.blocked{border-color:rgba(229,72,77,.28)}
.pcard.armed{border-color:rgba(229,72,77,.45);box-shadow:0 0 0 1px rgba(229,72,77,.25)}
.pcard-top{display:flex;align-items:center;gap:8px}
.repo-id{font:510 12.5px/1 var(--mono);color:var(--tx-1);display:inline-flex;align-items:center;gap:7px}
.land-chip{margin-left:auto;font:510 10.5px/1 var(--sans);padding:4px 9px;border-radius:999px;letter-spacing:.02em}
.land-chip.ready{color:var(--green-tx);background:rgba(39,166,68,.12);border:1px solid rgba(39,166,68,.3)}
.land-chip.withheld{color:var(--red-tx);background:rgba(229,72,77,.12);border:1px solid rgba(229,72,77,.32)}
.pcard-intent{font-size:14.5px;font-weight:510;letter-spacing:-.01em;line-height:1.35;margin:0}
.pcard-meta{font:400 11.5px/1.5 var(--mono);color:var(--tx-2);display:flex;gap:8px;flex-wrap:wrap}
.pcard-meta .add{color:var(--green-tx)} .pcard-meta .del{color:var(--red-tx)}
.checks{display:flex;gap:5px;flex-wrap:wrap}
.check{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:999px;font:510 10.5px/1.6 var(--sans);border:1px solid transparent}
.check .dot{width:5px;height:5px}
.check.pass{color:var(--green-tx);background:rgba(39,166,68,.1);border-color:rgba(39,166,68,.22)}
.check.fail{color:var(--red-tx);background:rgba(229,72,77,.1);border-color:rgba(229,72,77,.26)}
.check.unknown{color:var(--tx-2);background:rgba(255,255,255,.035);border-color:var(--b-soft)}
.check .dot.pass{background:var(--green)} .check .dot.fail{background:var(--red)} .check .dot.unknown{background:#4b4f56}
.pcard-actions{display:flex;gap:7px;margin-top:auto;padding-top:2px}
.pcard-actions .btn{flex:1}
.blocked-note{display:flex;gap:9px;align-items:flex-start;border:1px solid rgba(229,72,77,.25);background:rgba(229,72,77,.07);border-radius:var(--r-sm);padding:9px 10px;font-size:12px;line-height:1.5;color:var(--tx-1)}
.blocked-note .note-body{color:var(--tx-2)}
.blocked-note code{font:510 11px/1.6 var(--mono);color:var(--amber-tx)}

/* ============ conflict map ============ */
.conflict-map{border:1px solid rgba(232,177,63,.3);background:linear-gradient(0deg,rgba(232,177,63,.045),rgba(232,177,63,.045)),rgba(255,255,255,.015);border-radius:var(--r-md);padding:14px 16px;position:relative;overflow:hidden}
.conflict-map::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--amber)}
.cm-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.cm-file{font:510 13px/1 var(--mono);color:var(--tx-1)}
.cm-kind{font:510 10.5px/1 var(--sans);color:var(--amber-tx);background:rgba(232,177,63,.12);border:1px solid rgba(232,177,63,.3);border-radius:999px;padding:4px 9px;letter-spacing:.02em}
.cm-pair{display:flex;align-items:center;gap:7px;margin-top:11px;font:510 12px/1 var(--mono)}
.pair-chip{border:1px solid var(--b-mid);background:rgba(255,255,255,.04);border-radius:var(--r-micro);padding:4px 9px;color:var(--tx-1)}
.pair-x{color:var(--amber-tx);font-weight:590}
.cm-detail{margin-top:10px;font-size:12.5px;color:var(--tx-2);line-height:1.55}
.cm-detail b{color:var(--tx-1);font-weight:510}
.cm-actions{margin-top:12px;display:flex;gap:8px}

/* ============ events rail / ticker ============ */
.rail-panel{background:rgba(255,255,255,.02);border:1px solid var(--b-soft);border-radius:var(--r-md);overflow:hidden}
.rail-head{display:flex;align-items:center;justify-content:space-between;padding:11px 13px;border-bottom:1px solid var(--b-soft)}
.rail-title{font:510 11px/1 var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--tx-2)}
.rail-live{display:inline-flex;align-items:center;gap:5px;font:510 10px/1 var(--mono);color:var(--tx-2)}
.ticker{display:flex;flex-direction:column}
.ticker-row{display:flex;align-items:center;gap:9px;padding:8px 13px;border-bottom:1px solid rgba(255,255,255,.035);font-size:12px;animation:tick-in .34s var(--ease)}
.ticker-row:last-child{border-bottom:0}
.ticker-row.in{animation:tick-in .34s var(--ease)}
@keyframes tick-in{from{opacity:0;transform:translateY(-7px)}to{opacity:1;transform:none}}
.ev-type{font:510 11px/1 var(--mono);color:var(--tx-1)}
.ev-repo{font:510 11px/1 var(--mono);color:var(--brand-2)}
.ev-detail{font:400 11px/1 var(--mono);color:var(--tx-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ev-age{margin-left:auto;font:400 10.5px/1 var(--mono);color:var(--tx-3);font-variant-numeric:tabular-nums;flex:none}

/* ============ pulse strip ============ */
.pulse{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:rgba(255,255,255,.02);border:1px solid var(--b-soft);border-radius:var(--r-md);padding:12px 14px}
.pulse-item{display:inline-flex;align-items:center;gap:7px;font:510 12px/1 var(--sans);color:var(--tx-2)}
.pulse-item b{color:var(--tx-1);font-variant-numeric:tabular-nums;font-weight:590}
.pulse-sep{width:1px;height:18px;background:var(--b-soft)}
.router-verdict{font:510 10.5px/1 var(--sans);padding:4px 9px;border-radius:999px;letter-spacing:.02em}
.router-verdict.merge-it{color:var(--green-tx);background:rgba(39,166,68,.12);border:1px solid rgba(39,166,68,.3)}
.router-verdict.hold{color:var(--amber-tx);background:rgba(232,177,63,.1);border:1px solid rgba(232,177,63,.28)}
.router-verdict.block{color:var(--red-tx);background:rgba(229,72,77,.1);border:1px solid rgba(229,72,77,.3)}

/* ============ overlays / modal / sheet ============ */
.overlay{position:fixed;inset:0;background:var(--overlay);z-index:80;display:flex;align-items:center;justify-content:center;padding:24px;animation:fade .15s ease-out}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{width:min(980px,100%);max-height:min(86vh,940px);background:var(--bg-1);border:1px solid var(--b-mid);border-radius:var(--r-lg);display:flex;flex-direction:column;overflow:hidden;animation:modal-in .18s var(--ease);box-shadow:0 24px 80px rgba(0,0,0,.55)}
.sheet{width:min(660px,100%);max-height:min(88vh,900px);background:var(--bg-1);border:1px solid var(--b-mid);border-radius:var(--r-lg);display:flex;flex-direction:column;overflow:hidden;animation:modal-in .2s var(--ease);box-shadow:0 24px 80px rgba(0,0,0,.55)}
@keyframes modal-in{from{opacity:0;transform:scale(.982) translateY(8px)}to{opacity:1;transform:none}}
.modal-head{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--b-soft);flex:none}
.modal-title{font-size:15px;font-weight:590;letter-spacing:-.01em;margin:0}
.modal-sub{font:400 11.5px/1 var(--mono);color:var(--tx-2)}
.modal-close{margin-left:auto;border:0;background:rgba(255,255,255,.04);color:var(--tx-2);width:28px;height:28px;border-radius:var(--r-sm);cursor:pointer;font-size:15px;line-height:1;display:flex;align-items:center;justify-content:center;transition:background .12s,color .12s}
.modal-close:hover{background:rgba(255,255,255,.09);color:var(--tx-1)}
.modal-body{overflow-y:auto;padding:16px 18px;flex:1}
.mode-badge{font:510 10px/1 var(--sans);letter-spacing:.06em;text-transform:uppercase;padding:4px 8px;border-radius:var(--r-micro);background:rgba(113,112,255,.14);color:#a5a4ff;border:1px solid rgba(113,112,255,.3)}
.mode-badge.preview{background:rgba(232,177,63,.1);color:var(--amber-tx);border-color:rgba(232,177,63,.3)}

/* merge modal internals */
.merge-strip{display:flex;align-items:center;gap:9px;flex-wrap:wrap;border:1px solid var(--b-soft);background:rgba(255,255,255,.02);border-radius:var(--r-sm);padding:9px 12px;margin-bottom:14px;font-size:12px;color:var(--tx-2)}
.merge-strip b{color:var(--tx-1);font-weight:510}
.file-tabs{display:flex;gap:2px;border-bottom:1px solid var(--b-soft);margin-bottom:14px;overflow-x:auto}
.file-tabs button{border:0;background:transparent;color:var(--tx-2);font:510 12px/1 var(--mono);padding:9px 12px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;transition:color .12s,border-color .12s;white-space:nowrap}
.file-tabs button:hover{color:var(--tx-1)}
.file-tabs button[aria-selected="true"]{color:var(--tx-1);border-bottom-color:var(--brand-2)}
.diff{background:rgba(0,0,0,.28);border:1px solid var(--b-soft);border-radius:var(--r-sm);overflow-x:auto;font:400 12.5px/1.65 var(--mono)}
.dl{display:flex;min-width:max-content}
.dl-n{width:38px;flex:none;text-align:right;padding-right:12px;color:var(--tx-3);user-select:none;font-size:11px;line-height:inherit;padding-top:1px}
.dl-t{white-space:pre;padding-right:16px}
.dl.ctx .dl-t{color:var(--tx-2)}
.dl.ours{background:rgba(113,112,255,.07)} .dl.ours .dl-t{color:#c9c8ff}
.dl.theirs{background:rgba(39,166,68,.07)} .dl.theirs .dl-t{color:#9be8b8}
.dl.mk .dl-t{color:var(--amber-tx);font-weight:510}
.dl.mk2 .dl-t{color:var(--tx-3)}
.dl.mk3 .dl-t{color:var(--red-tx);font-weight:510}
.dl.add .dl-t{color:var(--green-tx)} .dl.add{background:rgba(39,166,68,.06)}
.dl.del .dl-t{color:var(--red-tx);text-decoration:line-through;text-decoration-color:rgba(255,128,135,.4)} .dl.del{background:rgba(229,72,77,.05)}
.diff-legend{display:flex;gap:14px;margin:10px 2px 0;font:400 11px/1 var(--mono);color:var(--tx-2);flex-wrap:wrap}
.diff-legend .sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
/* withheld secret state */
.secret-state{border:1px solid rgba(229,72,77,.28);background:rgba(229,72,77,.05);border-radius:var(--r-sm);padding:16px}
.secret-head{display:flex;align-items:center;gap:10px}
.lock-glyph{width:30px;height:30px;border-radius:var(--r-sm);background:rgba(229,72,77,.14);border:1px solid rgba(229,72,77,.35);display:flex;align-items:center;justify-content:center;flex:none}
.secret-title{font:510 13px/1.3 var(--sans);color:var(--tx-1)}
.secret-sub{font:400 11.5px/1.4 var(--sans);color:var(--tx-2);margin-top:2px}
.key-list{display:flex;gap:7px;margin:13px 0;flex-wrap:wrap}
.key-chip{font:510 11.5px/1 var(--mono);color:var(--amber-tx);border:1px solid rgba(232,177,63,.3);background:rgba(232,177,63,.08);border-radius:var(--r-micro);padding:5px 9px}
.reveal-btn{margin-top:2px}
.granted{margin-top:14px;border-top:1px dashed rgba(255,255,255,.12);padding-top:13px}
.granted-value{font:400 12px/1.7 var(--mono);color:var(--tx-1);background:rgba(0,0,0,.3);border:1px solid var(--b-soft);border-radius:var(--r-sm);padding:10px 12px;overflow-x:auto;white-space:pre}
.audit-note{display:flex;align-items:center;gap:8px;margin-top:11px;font:510 11.5px/1.5 var(--mono);color:var(--green-tx)}
.audit-note .dot{background:var(--green)}
/* comments */
.comments{margin-top:18px;border-top:1px solid var(--b-soft);padding-top:14px}
.comment{display:flex;gap:10px;margin-bottom:12px}
.avatar{width:26px;height:26px;border-radius:50%;background:rgba(113,112,255,.18);border:1px solid rgba(113,112,255,.4);color:#c9c8ff;font:590 10.5px/1 var(--sans);display:flex;align-items:center;justify-content:center;flex:none;text-transform:uppercase}
.comment-body{min-width:0;flex:1}
.comment-meta{display:flex;align-items:center;gap:8px;font:510 12px/1 var(--sans);color:var(--tx-1)}
.comment-line{font:510 10px/1 var(--mono);color:var(--brand-2);border:1px solid rgba(113,112,255,.3);border-radius:var(--r-micro);padding:2.5px 6px}
.comment-time{font:400 11px/1 var(--sans);color:var(--tx-3)}
.comment-text{margin-top:5px;font-size:12.5px;line-height:1.55;color:var(--tx-2)}
.compose{display:flex;flex-direction:column;gap:8px;margin-top:4px}
.compose textarea{resize:vertical;min-height:56px;background:rgba(255,255,255,.02);border:1px solid var(--b-mid);border-radius:var(--r-sm);color:var(--tx-1);font:400 12.5px/1.5 var(--sans);padding:9px 11px;transition:border-color .12s}
.compose textarea:focus{border-color:var(--brand-2)}
.compose textarea::placeholder{color:var(--tx-3)}
.compose-row{display:flex;align-items:center;gap:8px}
.compose-hint{font:400 11px/1 var(--sans);color:var(--tx-3)}

/* ============ land sheet ============ */
.land-steps{display:flex;align-items:center;gap:8px;margin-bottom:16px;font:510 11.5px/1 var(--sans);color:var(--tx-3)}
.land-steps .step{padding:4px 10px;border-radius:999px;border:1px solid var(--b-soft)}
.land-steps .step.done{color:var(--green-tx);border-color:rgba(39,166,68,.3);background:rgba(39,166,68,.08)}
.land-steps .step.now{color:var(--tx-1);border-color:var(--b-strong);background:rgba(255,255,255,.05)}
.land-steps .arr{color:var(--tx-3)}
.sheet [data-reveal]{animation:rise .5s var(--ease) both}
.sheet [data-reveal]:nth-child(2){animation-delay:.06s}
.sheet [data-reveal]:nth-child(3){animation-delay:.12s}
.sheet [data-reveal]:nth-child(4){animation-delay:.18s}
.sheet [data-reveal]:nth-child(5){animation-delay:.24s}
.sheet [data-reveal]:nth-child(6){animation-delay:.3s}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.verdict-panel{border:1px solid var(--b-soft);border-radius:var(--r-md);padding:16px;background:rgba(255,255,255,.015)}
.verdict-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.verdict-chip{font:590 13px/1 var(--sans);letter-spacing:.06em;padding:7px 14px;border-radius:var(--r-sm);display:inline-flex;align-items:center;gap:8px}
.verdict-chip.escalate{color:#ffa3a7;background:rgba(229,72,77,.13);border:1px solid rgba(229,72,77,.45)}
.verdict-chip.confirm{color:var(--amber-tx);background:rgba(232,177,63,.1);border:1px solid rgba(232,177,63,.4)}
.verdict-chip.act{color:var(--green-tx);background:rgba(39,166,68,.12);border:1px solid rgba(39,166,68,.4)}
.variant-toggle{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto}
.variant-toggle button{border:1px solid var(--b-soft);background:rgba(255,255,255,.02);color:var(--tx-2);font:510 11px/1 var(--sans);padding:6px 10px;border-radius:999px;cursor:pointer;transition:all .12s}
.variant-toggle button:hover{color:var(--tx-1);border-color:var(--b-mid)}
.variant-toggle button[aria-pressed="true"]{color:var(--tx-1);border-color:var(--brand-2);background:rgba(113,112,255,.12)}
.verdict-body{margin-top:14px;font-size:13px;line-height:1.6;color:var(--tx-2)}
.verdict-body b{color:var(--tx-1);font-weight:510}
.code-list{margin-top:12px;display:flex;flex-direction:column;gap:6px}
.code-row{display:flex;align-items:center;gap:9px;font:510 12px/1 var(--mono);background:rgba(229,72,77,.07);border:1px solid rgba(229,72,77,.25);border-radius:var(--r-sm);padding:8px 11px;color:#ffa3a7}
.code-row .code-kind{color:var(--amber-tx);flex:none}
.judge-panel{margin-top:14px;border:1px solid var(--b-soft);border-radius:var(--r-md);padding:14px 16px;background:rgba(255,255,255,.015)}
.judge-chips{display:flex;gap:7px;flex-wrap:wrap}
.judge-chip{display:inline-flex;align-items:center;gap:6px;font:510 11.5px/1 var(--sans);padding:5px 10px;border-radius:999px;border:1px solid}
.judge-chip .dot{width:5px;height:5px}
.judge-chip.red{color:var(--red-tx);border-color:rgba(229,72,77,.35);background:rgba(229,72,77,.08)} .judge-chip.red .dot{background:var(--red)}
.judge-chip.amber{color:var(--amber-tx);border-color:rgba(232,177,63,.35);background:rgba(232,177,63,.08)} .judge-chip.amber .dot{background:var(--amber)}
.judge-chip.green{color:var(--green-tx);border-color:rgba(39,166,68,.35);background:rgba(39,166,68,.08)} .judge-chip.green .dot{background:var(--green)}
.skipped-row{display:flex;gap:8px;align-items:flex-start;margin-top:13px;font-size:12px;color:var(--tx-2);line-height:1.55}
.skipped-row code{font:510 11px/1.7 var(--mono);color:var(--amber-tx);background:rgba(232,177,63,.07);border:1px solid rgba(232,177,63,.22);border-radius:var(--r-micro);padding:1px 6px}
.failclosed{border:1px solid rgba(229,72,77,.3);background:rgba(229,72,77,.06);border-radius:var(--r-sm);padding:12px 14px;font-size:12.5px;line-height:1.6;color:var(--tx-1)}
.failclosed code{font:510 12px/1.6 var(--mono);color:var(--red-tx)}
/* evidence receipt */
.receipt{margin-top:14px;border:1px solid var(--b-soft);border-radius:var(--r-md);overflow:hidden}
.receipt-head{display:flex;align-items:center;gap:9px;padding:10px 14px;border-bottom:1px solid var(--b-soft);background:rgba(255,255,255,.02);font:510 11px/1 var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--tx-2)}
.receipt-row{display:grid;grid-template-columns:150px 1fr auto;gap:12px;padding:8px 14px;border-bottom:1px solid rgba(255,255,255,.035);font-size:12px;align-items:center}
.receipt-row:last-child{border-bottom:0}
.receipt-k{font:510 11px/1.4 var(--mono);color:var(--tx-2)}
.receipt-v{font:400 11.5px/1.5 var(--mono);color:var(--tx-1);word-break:break-all}
.pass-pill{font:510 10px/1 var(--sans);color:var(--green-tx);background:rgba(39,166,68,.12);border:1px solid rgba(39,166,68,.3);border-radius:999px;padding:3px 8px;white-space:nowrap}
.render-only{margin-top:14px;font:400 11.5px/1.5 var(--sans);color:var(--tx-3);display:flex;align-items:center;gap:8px}
.sheet-foot{display:flex;align-items:center;gap:9px;padding:13px 18px;border-top:1px solid var(--b-soft);flex:none}

/* ============ files view ============ */
.files-layout{display:grid;grid-template-columns:250px minmax(0,1fr);gap:16px;align-items:start}
.repo-picker{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:16px}
.repo-picker button{border:1px solid var(--b-soft);background:rgba(255,255,255,.02);color:var(--tx-2);font:510 12px/1 var(--mono);padding:7px 12px;border-radius:var(--r-sm);cursor:pointer;transition:all .12s}
.repo-picker button:hover{color:var(--tx-1);border-color:var(--b-mid)}
.repo-picker button[aria-pressed="true"]{color:var(--tx-1);border-color:var(--brand-2);background:rgba(113,112,255,.12)}
.tree-panel{background:rgba(255,255,255,.02);border:1px solid var(--b-soft);border-radius:var(--r-md);padding:10px;position:sticky;top:76px}
.tree-dir{display:flex;align-items:center;gap:7px;font:510 12px/1 var(--mono);color:var(--tx-1);padding:6px 8px;border-radius:var(--r-sm)}
.tree-dir .tw{color:var(--tx-3);font-size:10px;width:10px}
.tree-file{display:flex;align-items:center;gap:7px;width:100%;text-align:left;border:0;background:transparent;font:400 12px/1 var(--mono);color:var(--tx-2);padding:6px 8px 6px 24px;border-radius:var(--r-sm);cursor:pointer;transition:background .1s,color .1s}
.tree-file:hover{background:rgba(255,255,255,.04);color:var(--tx-1)}
.tree-file[aria-current="true"]{background:rgba(113,112,255,.12);color:var(--tx-1)}
.tree-file .f-secret{color:var(--red-tx)}
.viewer-panel{background:rgba(255,255,255,.02);border:1px solid var(--b-soft);border-radius:var(--r-md);overflow:hidden;min-height:420px}
.viewer-head{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--b-soft);flex-wrap:wrap}
.crumbs{display:flex;align-items:center;gap:6px;font:510 12px/1 var(--mono);color:var(--tx-2);min-width:0}
.crumbs .cr{border:0;background:transparent;color:var(--tx-2);font:inherit;cursor:pointer;padding:2px 3px;border-radius:3px}
.crumbs .cr:hover{color:var(--tx-1)}
.crumbs .cr.cur{color:var(--tx-1)}
.crumbs .sep{color:var(--tx-3)}
.raw-link{margin-left:auto;font:510 11px/1 var(--mono);color:var(--brand-2);text-decoration:none;border:1px solid rgba(113,112,255,.3);border-radius:var(--r-micro);padding:5px 9px;transition:background .12s}
.raw-link:hover{background:rgba(113,112,255,.1)}
.viewer-body{padding:0}
.text-view{background:rgba(0,0,0,.28);font:400 12.5px/1.7 var(--mono);overflow-x:auto;padding:12px 0}
.meta-table{padding:16px;display:flex;flex-direction:column;gap:0}
.meta-row{display:grid;grid-template-columns:130px 1fr;gap:12px;padding:9px 2px;border-bottom:1px solid rgba(255,255,255,.04);font-size:12.5px;align-items:baseline}
.meta-row:last-child{border-bottom:0}
.meta-k{font:510 11px/1.4 var(--sans);letter-spacing:.05em;text-transform:uppercase;color:var(--tx-3)}
.meta-v{font:400 12px/1.6 var(--mono);color:var(--tx-1)}
.binary-posture{margin-top:14px;border:1px dashed var(--b-mid);border-radius:var(--r-sm);padding:14px;font-size:12px;color:var(--tx-2);line-height:1.6;display:flex;gap:11px;align-items:flex-start}

/* ============ history ============ */
.commit-list{display:flex;flex-direction:column;gap:8px}
.commit{display:grid;grid-template-columns:92px 1fr auto;gap:14px;align-items:center;background:rgba(255,255,255,.02);border:1px solid var(--b-soft);border-radius:var(--r-md);padding:12px 16px;cursor:pointer;transition:border-color .13s,background .13s;text-align:left;width:100%;color:inherit}
.commit:hover{border-color:var(--b-mid);background:rgba(255,255,255,.03)}
.commit[aria-current="true"]{border-color:var(--brand-2);background:rgba(113,112,255,.06)}
.commit-sha{font:510 12.5px/1 var(--mono);color:var(--brand-2);font-variant-numeric:tabular-nums}
.commit-msg{font-size:13.5px;font-weight:510;letter-spacing:-.005em;min-width:0}
.commit-sub{font:400 11px/1.5 var(--mono);color:var(--tx-3);margin-top:3px}
.commit-date{font:400 11.5px/1 var(--mono);color:var(--tx-2);white-space:nowrap;font-variant-numeric:tabular-nums}
.hist-detail{margin-top:14px;border:1px solid var(--b-soft);border-radius:var(--r-md);padding:16px;background:rgba(255,255,255,.015);animation:rise .3s var(--ease)}
.hist-detail-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:13px}
.changed-file{display:grid;grid-template-columns:auto 1fr auto auto;gap:12px;align-items:center;padding:9px 12px;border:1px solid rgba(255,255,255,.04);border-radius:var(--r-sm);margin-bottom:7px;font-size:12.5px}
.cf-status{font:510 10.5px/1 var(--sans);padding:4px 8px;border-radius:var(--r-micro);letter-spacing:.03em}
.cf-status.modified{color:var(--amber-tx);background:rgba(232,177,63,.1);border:1px solid rgba(232,177,63,.28)}
.cf-status.added{color:var(--green-tx);background:rgba(39,166,68,.1);border:1px solid rgba(39,166,68,.28)}
.cf-path{font:510 12px/1 var(--mono);color:var(--tx-1)}
.cf-delta{font:510 11.5px/1 var(--mono);font-variant-numeric:tabular-nums}
.cf-delta .add{color:var(--green-tx)} .cf-delta .del{color:var(--red-tx)}
.asset-chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:13px}
.root-note{display:flex;gap:9px;align-items:flex-start;margin-top:12px;border:1px solid var(--b-soft);background:rgba(255,255,255,.02);border-radius:var(--r-sm);padding:10px 12px;font-size:12px;color:var(--tx-2);line-height:1.55}

/* ============ forks ============ */
.fork-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:12px}
.fork-card{background:rgba(255,255,255,.02);border:1px solid var(--b-soft);border-radius:var(--r-md);padding:16px;display:flex;flex-direction:column;gap:13px}
.fork-head{display:flex;align-items:center;gap:9px}
.lineage{font:400 11.5px/1 var(--mono);color:var(--tx-2)}
.lineage b{color:var(--brand-2);font-weight:510}
.cluster-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.cluster{border:1px solid var(--b-soft);background:rgba(255,255,255,.02);border-radius:var(--r-sm);padding:8px 10px}
.cluster-k{font:510 10px/1 var(--sans);letter-spacing:.07em;text-transform:uppercase;color:var(--tx-3)}
.cluster-v{font:590 15px/1.5 var(--sans);color:var(--tx-1);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.cluster-v.unmeasured{font:510 11px/1.5 var(--sans);color:var(--tx-2);letter-spacing:0}
.policy-row{display:flex;gap:6px;flex-wrap:wrap}
.policy-chip{font:510 10.5px/1 var(--sans);color:var(--tx-2);border:1px solid var(--b-soft);background:rgba(255,255,255,.03);border-radius:999px;padding:4px 9px}
.signal-bar{height:3px;border-radius:2px;background:rgba(255,255,255,.06);margin-top:7px;overflow:hidden}
.signal-bar i{display:block;height:100%;border-radius:2px;background:var(--brand-2)}

/* ============ sessions ============ */
.session-list{display:flex;flex-direction:column;gap:8px}
.session{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;background:rgba(255,255,255,.02);border:1px solid var(--b-soft);border-radius:var(--r-md);padding:13px 16px}
.sess-state{display:flex;align-items:center;gap:8px;font:510 11px/1 var(--sans);color:var(--tx-2);min-width:86px}
.sess-intent{font-size:13px;font-weight:510;min-width:0}
.sess-last{font:400 11.5px/1 var(--mono);color:var(--tx-2);white-space:nowrap;font-variant-numeric:tabular-nums}
.steer-panel{margin-top:18px;border:1px solid var(--b-soft);border-radius:var(--r-md);padding:16px;background:rgba(255,255,255,.015)}
.steer-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:11px}
.steer-target{display:flex;gap:4px}
.steer-target button{border:1px solid var(--b-soft);background:rgba(255,255,255,.02);color:var(--tx-2);font:510 11.5px/1 var(--mono);padding:6px 11px;border-radius:var(--r-sm);cursor:pointer;transition:all .12s}
.steer-target button[aria-pressed="true"]{color:var(--tx-1);border-color:var(--brand-2);background:rgba(113,112,255,.12)}
.steer-panel textarea{width:100%;resize:vertical;min-height:70px;background:rgba(255,255,255,.02);border:1px solid var(--b-mid);border-radius:var(--r-sm);color:var(--tx-1);font:400 12.5px/1.5 var(--sans);padding:10px 12px}
.steer-panel textarea:focus{border-color:var(--brand-2)}
.char-count{font:400 11px/1 var(--mono);color:var(--tx-3);font-variant-numeric:tabular-nums}
.char-count.over{color:var(--red-tx)}
.v1-note{display:flex;gap:8px;align-items:flex-start;margin-top:11px;font-size:11.5px;color:var(--tx-3);line-height:1.55}

/* ============ issues ============ */
.issue-list{display:flex;flex-direction:column;gap:8px}
.issue{display:grid;grid-template-columns:auto auto 1fr auto;gap:12px;align-items:center;background:rgba(255,255,255,.02);border:1px solid var(--b-soft);border-radius:var(--r-md);padding:13px 16px}
.kind-chip{font:510 10.5px/1 var(--sans);padding:5px 10px;border-radius:999px;letter-spacing:.02em;white-space:nowrap}
.kind-conflict{color:var(--amber-tx);background:rgba(232,177,63,.1);border:1px solid rgba(232,177,63,.3)}
.kind-withheld-secret{color:var(--red-tx);background:rgba(229,72,77,.1);border:1px solid rgba(229,72,77,.3)}
.kind-stale-base{color:var(--tx-2);background:rgba(255,255,255,.04);border:1px solid var(--b-mid)}
.kind-blocked-intent{color:#a5a4ff;background:rgba(113,112,255,.1);border:1px solid rgba(113,112,255,.3)}
.sev{font:510 10.5px/1 var(--sans);padding:4px 9px;border-radius:999px;white-space:nowrap}
.sev-high{color:var(--red-tx);background:rgba(229,72,77,.1);border:1px solid rgba(229,72,77,.3)}
.sev-block{color:var(--red-tx);background:rgba(229,72,77,.14);border:1px solid rgba(229,72,77,.4)}
.sev-medium{color:var(--amber-tx);background:rgba(232,177,63,.1);border:1px solid rgba(232,177,63,.28)}
.sev-low{color:var(--tx-2);background:rgba(255,255,255,.04);border:1px solid var(--b-mid)}
.issue-body{min-width:0}
.issue-title{font-size:13px;font-weight:510}
.issue-sub{font:400 11.5px/1.5 var(--mono);color:var(--tx-2);margin-top:3px}
.issue-links{display:flex;gap:7px}
.link-btn{border:1px solid var(--b-soft);background:rgba(255,255,255,.02);color:var(--tx-2);font:510 11px/1 var(--sans);padding:6px 10px;border-radius:var(--r-sm);cursor:pointer;transition:all .12s;white-space:nowrap}
.link-btn:hover{color:var(--tx-1);border-color:var(--b-mid)}

/* ============ tables (agents / parity) ============ */
.table-wrap{border:1px solid var(--b-soft);border-radius:var(--r-md);overflow:hidden;background:rgba(255,255,255,.015)}
table.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.tbl th{font:510 10.5px/1 var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--tx-3);text-align:left;padding:10px 14px;border-bottom:1px solid var(--b-soft);background:rgba(255,255,255,.02);white-space:nowrap}
.tbl td{padding:10px 14px;border-bottom:1px solid rgba(255,255,255,.04);vertical-align:middle;color:var(--tx-2)}
.tbl tr:last-child td{border-bottom:0}
.tbl td.strong{color:var(--tx-1);font-weight:510}
.tbl td.mono{font:400 11.5px/1.5 var(--mono);color:var(--tx-1)}
.tbl tr:hover td{background:rgba(255,255,255,.015)}
.verdict-cell{display:inline-flex;align-items:center;gap:6px;font:510 11px/1 var(--sans);padding:4px 9px;border-radius:999px;white-space:nowrap}
.verdict-cell.exceeds{color:var(--green-tx);background:rgba(39,166,68,.1);border:1px solid rgba(39,166,68,.28)}
.verdict-cell.parity{color:var(--tx-1);background:rgba(255,255,255,.05);border:1px solid var(--b-mid)}
.verdict-cell.below{color:var(--amber-tx);background:rgba(232,177,63,.09);border:1px solid rgba(232,177,63,.26)}
.parity-chips{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}

/* ============ pulse view ============ */
.pulse-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px;margin-bottom:16px}
.pulse-card{background:rgba(255,255,255,.02);border:1px solid var(--b-soft);border-radius:var(--r-md);padding:16px}
.pulse-card h3{font:510 12px/1 var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--tx-2);margin:0 0 13px}
.floor-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.04);font-size:12.5px}
.floor-row:last-child{border-bottom:0}
.floor-n{font:590 12px/1 var(--mono);color:var(--brand-2);width:20px;font-variant-numeric:tabular-nums}
.intent-row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid rgba(255,255,255,.04)}
.intent-row:last-child{border-bottom:0}
.intent-txt{font:510 12.5px/1.4 var(--sans);color:var(--tx-1);min-width:0}
.intent-sub{font:400 10.5px/1.5 var(--mono);color:var(--tx-3);margin-top:2px}

/* ============ tour ============ */
.tour-overlay{position:fixed;inset:0;z-index:100;animation:fade .2s ease-out}
.tour-spot{position:absolute;border-radius:var(--r-md);box-shadow:0 0 0 9999px rgba(2,3,4,.78);border:1.5px solid var(--brand-2);transition:all .3s var(--ease);pointer-events:none}
.tour-card{position:absolute;width:340px;background:var(--bg-2);border:1px solid var(--b-strong);border-radius:var(--r-lg);padding:18px;box-shadow:0 20px 60px rgba(0,0,0,.6);animation:rise .3s var(--ease)}
.tour-step-label{font:510 10px/1 var(--mono);color:var(--brand-2);letter-spacing:.08em;text-transform:uppercase}
.tour-title{font-size:16px;font-weight:590;letter-spacing:-.01em;margin:8px 0 7px}
.tour-body{font-size:12.5px;line-height:1.6;color:var(--tx-2)}
.tour-foot{display:flex;align-items:center;gap:8px;margin-top:15px}
.tour-dots{display:flex;gap:4px;margin-right:auto}
.tour-dots i{width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.18)}
.tour-dots i.on{background:var(--brand-2)}
.tour-skip{border:0;background:transparent;color:var(--tx-3);font:510 11.5px/1 var(--sans);cursor:pointer;padding:6px}
.tour-skip:hover{color:var(--tx-1)}

/* ============ toasts ============ */
#toasts{position:fixed;right:18px;bottom:18px;z-index:200;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{display:flex;align-items:center;gap:9px;background:var(--bg-2);border:1px solid var(--b-strong);border-radius:var(--r-sm);padding:10px 14px;font-size:12.5px;color:var(--tx-1);box-shadow:0 12px 32px rgba(0,0,0,.5);animation:toast-in .25s var(--ease);pointer-events:auto;max-width:380px}
@keyframes toast-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.toast.out{animation:toast-out .2s var(--ease) forwards}
@keyframes toast-out{to{opacity:0;transform:translateY(6px)}}

/* ============ skeletons ============ */
.skel{position:relative;overflow:hidden;background:rgba(255,255,255,.045);border-radius:var(--r-sm)}
.skel::after{content:"";position:absolute;inset:0;transform:translateX(-100%);background:linear-gradient(90deg,transparent,rgba(255,255,255,.07),transparent);animation:shimmer 1.15s infinite}
@keyframes shimmer{to{transform:translateX(100%)}}
.skel-card{height:178px;border-radius:var(--r-md)}
.skel-row{height:44px;border-radius:var(--r-sm);margin-bottom:8px}
.skel-line{height:12px;margin-bottom:9px}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}
}
@media (max-width:1180px){
  .console-grid{grid-template-columns:1fr}
  .rail{position:static;flex-direction:row;flex-wrap:wrap}
  .rail>.rail-panel{flex:1 1 300px}
  .files-layout{grid-template-columns:1fr}
  .tree-panel{position:static}
}
@media (max-width:860px){
  .stats{display:none}
  .nav button{padding:8px 7px;font-size:12px}
  .header-inner{gap:9px}
  .commit{grid-template-columns:78px 1fr}
  .commit-date{display:none}
  .issue{grid-template-columns:auto 1fr}
  .issue-links{grid-column:1/-1}
  .session{grid-template-columns:1fr}
  .sess-last{white-space:normal}
}

  { title:"Forks & signals", body:"Every proposal is a fork of demo. Six-cluster signals measure fit, trust, liveness, proof, distance and cost — with honest unmeasured states where data doesn't exist yet. Policy chips record land: manual and secrets: refused.", target:"#nav-forks" },
  { title:"Evidence receipts", body:"The events rail streams the namespace — pushes, steers, verdicts, reveals. Every landing writes a 12-key evidence receipt whose pass condition is mergedSha == testedSha. That's the receipt behind every merge.", target:"#events-rail" },
];
function openTour(){
  if (state.view !== "console") showView("console");
  state.tour.open = true; state.tour.step = 0;
  renderTour();
}
function closeTour(){ state.tour.open = false; const t = $("#tour-overlay"); if (t) t.remove(); }
function renderTour(){
  let ov = $("#tour-overlay");
  if (!ov) {
    ov = document.createElement("div");
    ov.id = "tour-overlay";
    ov.className = "tour-overlay";
    ov.innerHTML = '<div class="tour-spot" id="tour-spot"></div><div class="tour-card" id="tour-card" role="dialog" aria-modal="true" aria-label="Guided tour"></div>';
    document.body.appendChild(ov);
  }
  const step = TOUR[state.tour.step];
  const card = $("#tour-card");
  const dots = TOUR.map((_, i) => '<i class="' + (i === state.tour.step ? "on" : "") + '"></i>').join("");
  card.innerHTML =
    '<div class="tour-step-label">step ' + (state.tour.step + 1) + " / " + TOUR.length + "</div>" +
    '<div class="tour-title">' + esc(step.title) + "</div>" +
    '<div class="tour-body">' + esc(step.body) + "</div>" +
    '<div class="tour-foot"><div class="tour-dots">' + dots + "</div>" +
    (state.tour.step > 0 ? '<button class="btn sm ghost" data-action="tour-prev">Back</button>' : "") +
    (state.tour.step < TOUR.length - 1 ? '<button class="btn sm primary" data-action="tour-next">Next</button>' : '<button class="btn sm primary" data-action="tour-close">Finish</button>') +
    '<button class="tour-skip" data-action="tour-close">Skip tour</button></div>';
  requestAnimationFrame(positionTour);
}
function positionTour(){
  if (!state.tour.open) return;
  const step = TOUR[state.tour.step];
  const spot = $("#tour-spot"), card = $("#tour-card");
  if (!spot || !card) return;
  const vw = window.innerWidth, vh = window.innerHeight;
  if (!step.target) {
    spot.style.cssText = "left:50%;top:50%;width:0;height:0;box-shadow:0 0 0 9999px rgba(2,3,4,.78);border:0";
    card.style.left = Math.max(16, vw / 2 - 170) + "px";
    card.style.top = Math.max(16, vh / 2 - 140) + "px";
    return;
  }
  const el = $(step.target);
  if (!el) { spot.style.display = "none"; card.style.left = "50%"; card.style.top = "40%"; return; }
  spot.style.display = "";
  const r = el.getBoundingClientRect();
  const pad = 7;
  spot.style.left = (r.left - pad) + "px";
  spot.style.top = (r.top - pad) + "px";
  spot.style.width = (r.width + pad * 2) + "px";
  spot.style.height = (r.height + pad * 2) + "px";
  const cw = 340;
  let cx = Math.min(Math.max(16, r.left), vw - cw - 16);
  let cy = r.bottom + 16;
  if (cy + 240 > vh) cy = Math.max(16, r.top - 250);
  card.style.left = cx + "px";
  card.style.top = cy + "px";
}

/* ================= view switching ================= */
const RENDER = { console: renderConsole, files: renderFiles, history: renderHistory, forks: renderForks,
  sessions: renderSessions, issues: renderIssues, agents: renderAgents, parity: renderParity, pulse: renderPulse };
const SKELETON = { console: "cards", files: "lines", history: "rows", forks: "cards",
  sessions: "rows", issues: "rows", agents: "rows", parity: "rows", pulse: "lines" };
function showView(name){
  if (state.tour.open) closeTour();
  state.view = name;
  $$(".view").forEach(v => v.classList.toggle("active", v.id === "view-" + name));
  $$("#main-nav button").forEach(b => {
    if (b.dataset.view === name) b.setAttribute("aria-current", "page");
    else if (b.dataset.view) b.removeAttribute("aria-current");
  });
  if (!state.loaded[name]) {
    state.loaded[name] = true;
    const el = $("#view-" + name);
    el.innerHTML = skeletonHTML(SKELETON[name] || "lines");
    setTimeout(() => { if (state.view === name) RENDER[name](); }, 340);
  } else {
    RENDER[name]();
  }
}

/* ================= ticker engine ================= */
function pushEvent(ev){
  ev.at = Date.now();
  state.ticker.unshift(ev);
  if (state.ticker.length > 8) state.ticker.pop();
  renderTicker(true);
}
function tick(){
  if (state.connection !== "live") return;
  const next = EVENT_POOL[state.poolIdx % EVENT_POOL.length];
  state.poolIdx++;
  pushEvent(Object.assign({}, next));
}
setInterval(tick, 3000);
setInterval(() => { if (state.view === "console" && state.loaded.console) renderTicker(false); }, 15000);

/* ================= toasts ================= */
function toast(msg){
  const t = document.createElement("div");
  t.className = "toast";
  t.innerHTML = '<span class="dot brand"></span><span>' + esc(msg) + "</span>";
  $("#toasts").appendChild(t);
  setTimeout(() => { t.classList.add("out"); setTimeout(() => t.remove(), 220); }, 2600);
}

/* ================= actions ================= */
function gotoView(view, repo, file){
  showView(view);
  if (repo && (view === "files")) {
    state.fileRepo = repo;
    state.filePath = file || defaultFilePath(repo);
    state.fileRevealed = false;
    state.loaded.files = false;   // force skeleton pass for the jump
    showView("files");
  }
  if (repo && view === "console") {
    const card = $("#card-" + repo);
    if (card) { card.scrollIntoView({ behavior: "smooth", block: "center" }); card.style.borderColor = "var(--brand-2)"; setTimeout(() => { card.style.borderColor = ""; }, 900); }
  }
}
document.addEventListener("click", e => {
  const el = e.target.closest("[data-action]");
  if (!el) return;
  const a = el.dataset.action;
  switch (a) {
    case "nav": showView(el.dataset.view); break;
    case "conn-toggle":
      state.connection = state.connection === "live" ? "polling" : "live";
      renderConn();
      toast(state.connection === "live" ? "connection live — event stream resumed" : "polling — event stream paused");
      break;
    case "new-proposal": toast("proposals are agent-authored in v1 — this console is read-only for humans"); break;
    case "card-diff": openMerge(el.dataset.repo, "diff"); break;
    case "card-merge": openMerge(el.dataset.repo, "preview"); break;
    case "card-land": armLand(el.dataset.repo); break;
    case "land-cancel": cancelLand(el.dataset.repo); break;
    case "land-confirm": openLandSheet(el.dataset.repo); break;
    case "secret-path": gotoView("files", el.dataset.repo, "config/.env"); break;
    case "conflict-view": openMerge("agent-1", "diff"); break;
    case "modal-close": closeMerge(); break;
    case "sheet-close": closeSheet(); break;
    case "overlay-close": if (e.target === el) { closeMerge(); closeSheet(); } break;
    case "merge-tab": state.mergeFile = el.dataset.file; renderMerge(); break;
    case "reveal-merge": state.mergeRevealed = true; renderMerge(); toast("reveal granted — decision written to the audit log"); break;
    case "reveal-file": state.fileRevealed = true; renderFiles(); toast("reveal granted — decision written to the audit log"); break;
    case "comment-send": {
      const ta = $("#comment-input");
      const text = ta.value.trim();
      if (!text) { ta.focus(); break; }
      const f = ta.dataset.file;
      (state.comments[f] = state.comments[f] || []).push({ author: "you", line: null, text: text, time: "just now" });
      ta.value = "";
      renderMerge();
      break;
    }
    case "files-repo":
      state.fileRepo = el.dataset.repo;
      state.filePath = defaultFilePath(el.dataset.repo);
      state.fileRevealed = false;
      state.fileLoading = true;
      renderFiles();
      setTimeout(() => { state.fileLoading = false; renderFiles(); }, 380);
      break;
    case "file-select": state.filePath = el.dataset.path; renderFiles(); break;
    case "crumb-dir": state.filePath = null; renderFiles(); break;
    case "raw-link": toast("raw content is stubbed in this prototype — no network in the demo"); break;
    case "hist-select": state.histSel = el.dataset.sha; renderHistory(); break;
    case "hist-back": state.histSel = null; renderHistory(); break;
    case "steer-target": state.steerTarget = el.dataset.repo; renderSessions(); break;
    case "steer-send": {
      const ta = $("#steer-input");
      const text = ta.value.trim();
      if (!text) { ta.focus(); break; }
      pushEvent({ type: "session.steered", repo: state.steerTarget, detail: text.length > 42 ? text.slice(0, 42) + "…" : text });
      ta.value = "";
      const cc = $("#steer-count"); if (cc) { cc.textContent = "0 / 500"; cc.classList.remove("over"); }
      toast("steered " + state.steerTarget + " — landed in the event stream (v1: no ACK)");
      break;
    }
    case "goto": gotoView(el.dataset.view, el.dataset.repo, el.dataset.file); break;
    case "sheet-variant":
      state.sheetVariant = el.dataset.variant;
      renderSheet();
      break;
    case "tour-open": openTour(); break;
    case "tour-close": closeTour(); break;
    case "tour-next": if (state.tour.step < TOUR.length - 1) { state.tour.step++; renderTour(); } break;
    case "tour-prev": if (state.tour.step > 0) { state.tour.step--; renderTour(); } break;
  }
});
document.addEventListener("input", e => {
  if (e.target.id === "steer-input") {
    const cc = $("#steer-count");
    const n = e.target.value.length;
    cc.textContent = n + " / 500";
    cc.classList.toggle("over", n >= 500);
  }
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape") {
    if (state.tour.open) { closeTour(); return; }
    if (state.sheetRepo) { closeSheet(); return; }
    if (state.mergeCtx) { closeMerge(); return; }
  }
  if (e.key === "Enter" && (e.metaKey || e.ctrlKey) && e.target.id === "steer-input") {
    e.preventDefault();
    $('[data-action="steer-send"]').click();
  }
  if (e.key === "Enter" && e.target.id === "comment-input" && (e.metaKey || e.ctrlKey)) {
    e.preventDefault();
    $('[data-action="comment-send"]').click();
  }
});
window.addEventListener("resize", positionTour);
window.addEventListener("scroll", positionTour, true);

/* ================= boot ================= */
renderHeaderStats();
renderConn();
renderConsole();
</script>
</body>
</html>
