<!doctype html>
<html lang="en">
<head>
<!--
NextGit — prototype proto-04 · design system: raycast (command-first, keyboard-driven chrome)
SELF-CHECK
  [x] 13 surfaces present:
      1  triage console — 5 proposal cards, checks strips (tri-state, unknown never green), conflict map,
         stats chips, event ticker, nav, live/polling connection toggle, platform pulse strip
      2  merge modal — file tabs, diff3 (<<<<<<< ours / ======= / >>>>>>> theirs) for src/auth.ts,
         clean-file diff for agent-3, withheld-secret state for agent-5, reveal affordance,
         comments thread + optimistic compose, Esc + button close
      3  files browser — repo picker, breadcrumb, dir tree (dirs first), TEXT/BINARY/SECRET viewers,
         Reveal → granted value + audit note (decision: granted), raw link hidden on secret, skeleton
      4  history — commit list → changed files (status word, ±, asset chips), root-commit note, back
      5  forks & signals — six-cluster chips (incl. "unmeasured"), policy chips, lineage base: demo
      6  sessions — state dots, intent, last activity; steer composer ≤500 chars → ticker event
      7  issues — 4 kinds (conflict / withheld-secret / stale-base / blocked-intent) w/ severity + links
      8  agents roster + harnesses — policy chips, byo-cli kind chip
      9  parity dashboard — 5 exceeds · 8 parity · 5 below chips + 18 rows w/ verdict + evidence
      10 tour — 8 steps, spotlight stepper, Next/Back + progress
      11 land flow — two-step arm→confirm, verdict sheet (ESCALATE/CONFIRM/ACT/fail-closed variants),
         evidence receipt (12 keys, mergedSha==testedSha pass), reveal audit note
      12 judge panel — risk/intent/collision verdict chips, skipped[] reasons, fail-closed 503 copy
      13 platform pulse strip — floors count, intents router verdict merge-it (agent-3), upstream note
  [x] interactions wired: instant view switching, ⌘K command palette, modal open/Esc-close, land
      arm/confirm, secret reveal, comment compose (in-memory), animated ticker + connection toggle,
      skeleton shimmers on view switch
  [x] single file: no <script src>, no <link href> to assets, no fetch/XHR; opens from file://
  [x] verified: 0 console errors, 0 external network requests (headless Chromium smoke run)
-->
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>NextGit — Console</title>
<style>
/* ============ raycast design system tokens ============ */
:root{
  --bg:#07080a;
  --surface:#101111;
  --surface-2:#1b1c1e;
  --key-start:#121212;
  --key-end:#0d0d0d;
  --border:rgba(255,255,255,.06);
  --border-strong:#2f3031;
  --text:#f9f9f9;
  --text-2:#cecece;
  --text-3:#9c9c9d;
  --text-4:#6a6b6c;
  --blue:#55b3ff;
  --green:#5fc992;
  --yellow:#ffbc33;
  --red:#ff6363;
  --blue-tint:hsla(202,100%,67%,.15);
  --red-tint:hsla(0,100%,69%,.15);
  --green-tint:hsla(151,59%,59%,.14);
  --yellow-tint:hsla(43,100%,60%,.14);
  --warm-glow:rgba(215,201,175,.05);
  --radius-card:16px;
  --radius-ui:8px;
  --mono:"GeistMono",ui-monospace,"SF Mono",SFMono-Regular,Menlo,Monaco,Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html{height:100%}
body{
  background:var(--bg);color:var(--text);
  font-family:"Inter",-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif;
  font-size:16px;font-weight:500;line-height:1.6;letter-spacing:.2px;
  font-feature-settings:"calt","kern","liga","ss03";
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  min-height:100%;
}
::selection{background:hsla(202,100%,67%,.3)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#2f3031;border-radius:6px;border:2px solid var(--bg)}
::-webkit-scrollbar-track{background:transparent}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,textarea{font:inherit;color:var(--text)}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:4px}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono);font-size:14px;font-weight:500;line-height:1.6;letter-spacing:.3px;font-feature-settings:"calt","kern"}

/* ============ app shell ============ */
.app-header{
  position:sticky;top:0;z-index:40;
  background:rgba(7,8,10,.85);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--border);
}
.header-inner{max-width:1200px;margin:0 auto;padding:0 24px;height:64px;display:flex;align-items:center;gap:20px}
.brand{display:flex;align-items:center;gap:12px;user-select:none}
.brand-mark{
  width:30px;height:30px;border-radius:8px;position:relative;overflow:hidden;flex:none;
  background:linear-gradient(160deg,#17181a,#0d0e0f);
  box-shadow:rgb(27,28,30) 0 0 0 1px, inset 0 1px 0 rgba(255,255,255,.08), rgba(0,0,0,.4) 0 1.5px .5px 2.5px;
}
.brand-mark::after{
  content:"";position:absolute;inset:0;
  background:repeating-linear-gradient(-45deg,var(--red) 0 5px,transparent 5px 11px);
  -webkit-mask:linear-gradient(135deg,transparent 42%,#000 43%,#000 72%,transparent 73%);
  mask:linear-gradient(135deg,transparent 42%,#000 43%,#000 72%,transparent 73%);
}
.brand-name{font-size:18px;font-weight:600;letter-spacing:.2px}
.brand-tag{font-size:12px;font-weight:500;color:var(--text-3);padding:2px 8px;border:1px solid var(--border);border-radius:6px}
.stat-chips{display:flex;gap:8px;align-items:center}
.nav{display:flex;gap:2px;margin-left:auto;align-items:center}
.nav-link{
  font-size:16px;font-weight:500;letter-spacing:.3px;color:var(--text-3);
  padding:8px 13px;border-radius:8px;transition:color .15s,background .15s;white-space:nowrap;
}
.nav-link:hover{color:var(--text)}
.nav-link.active{color:var(--text);background:var(--blue-tint)}
.header-actions{display:flex;gap:10px;align-items:center;margin-left:8px}
.conn-toggle{
  display:inline-flex;align-items:center;gap:8px;padding:7px 14px;border-radius:86px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.1),0 0 0 1px rgba(255,255,255,.12);
  font-size:14px;font-weight:600;letter-spacing:.3px;transition:opacity .15s;
}
.conn-toggle:hover{opacity:.65}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.dot.live{background:var(--green);animation:pulse 1.8s ease-in-out infinite}
.dot.polling{background:var(--yellow);animation:pulse 3.4s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 hsla(151,59%,59%,.4)}50%{box-shadow:0 0 0 6px hsla(151,59%,59%,0)}}
.kbd{
  display:inline-block;padding:2px 7px;border-radius:5px;font-family:var(--mono);font-size:12px;
  font-weight:500;letter-spacing:.2px;color:var(--text-2);
  background:linear-gradient(180deg,var(--key-start),var(--key-end));
  box-shadow:rgba(0,0,0,.4) 0 1.5px .5px 2.5px,inset 0 0 0 .5px rgba(255,255,255,.09),inset 0 -1px 0 rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.06);
}
.palette-btn{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border-radius:8px;color:var(--text-3);font-size:14px;font-weight:500;box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 0 0 1px rgba(255,255,255,.08);transition:opacity .15s}
.palette-btn:hover{opacity:.65}

main{max-width:1200px;margin:0 auto;padding:32px 24px 120px}
.view{display:none}
.view.active{display:block;animation:viewIn .18s ease}
@keyframes viewIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* ============ shared components ============ */
.card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-card);
  padding:20px;
  box-shadow:rgba(0,0,0,.28) 0 1.189px 2.377px;
  transition:border-color .2s,transform .2s;
}
.card.hoverable:hover{border-color:rgba(255,255,255,.12);transform:translateY(-2px)}
.card-elevated{
  background:var(--surface);border-radius:var(--radius-card);
  box-shadow:rgb(27,28,30) 0 0 0 1px,rgb(7,8,10) 0 0 0 1px inset,rgba(0,0,0,.28) 0 1.189px 2.377px;
}
.section{margin-top:44px}
.section-head{display:flex;align-items:baseline;gap:14px;margin-bottom:18px}
.section-title{font-size:24px;font-weight:500;letter-spacing:.2px}
.section-sub{font-size:14px;color:var(--text-3);font-weight:500}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:6px;background:var(--surface-2);color:var(--text);font-size:14px;font-weight:500;white-space:nowrap}
.chip-mono{font-family:var(--mono);font-size:12px;font-weight:500;letter-spacing:.2px}
.check{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:6px;background:var(--surface-2);font-size:12px;font-weight:600;letter-spacing:0;white-space:nowrap}
.check .cdot{width:6px;height:6px;border-radius:50%;flex:none}
.check.pass{color:var(--green)}.check.pass .cdot{background:var(--green)}
.check.fail{color:var(--red)}.check.fail .cdot{background:var(--red)}
.check.unknown{color:var(--text-3)}.check.unknown .cdot{border:1.5px solid var(--text-3);background:transparent}
.btn{
  font-size:16px;font-weight:600;letter-spacing:.3px;color:var(--text);
  padding:10px 20px;border-radius:86px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.1),0 0 0 1px rgba(255,255,255,.12);
  transition:opacity .15s,transform .1s;display:inline-flex;align-items:center;gap:8px;
}
.btn:hover{opacity:.6}
.btn:active{transform:translateY(1px)}
.btn-cta{background:hsla(0,0%,100%,.815);color:#18191a;box-shadow:none}
.btn-cta:hover{background:#fff;opacity:1}
.btn-ghost{box-shadow:none;color:var(--text-3);padding-left:12px;padding-right:12px}
.btn-ghost:hover{color:var(--text);opacity:1}
.btn-sec{
  font-size:16px;font-weight:600;letter-spacing:.3px;color:var(--text);
  padding:9px 18px;border-radius:6px;box-shadow:0 0 0 1px rgba(255,255,255,.1),rgba(0,0,0,.03) 0 7px 3px;
  transition:opacity .15s;display:inline-flex;align-items:center;gap:8px;
}
.btn-sec:hover{opacity:.6}
.btn-sm{font-size:14px;padding:7px 14px}
.btn-danger{color:var(--red)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.link{color:var(--blue);font-weight:500;text-decoration:none}
.link:hover{text-decoration:underline}
.divider{height:1px;background:var(--border);margin:20px 0}
.empty-note{color:var(--text-4);font-size:14px;font-weight:500}

/* ============ console ============ */
.console-hero{position:relative;padding:8px 0 4px}
.console-hero::before{
  content:"";position:absolute;inset:-40px -80px auto;height:340px;pointer-events:none;
  background:radial-gradient(closest-side,var(--warm-glow),transparent 75%);
}
.console-title{font-size:40px;font-weight:600;line-height:1.15;letter-spacing:0}
.console-sub{color:var(--text-3);font-size:18px;font-weight:400;margin-top:6px;max-width:640px}
.pulse-strip{
  margin-top:28px;display:grid;grid-template-columns:repeat(3,1fr);gap:1px;
  background:var(--border);border:1px solid var(--border);border-radius:var(--radius-card);overflow:hidden;
}
.pulse-cell{background:var(--surface);padding:16px 20px;display:flex;flex-direction:column;gap:6px}
.pulse-label{font-size:12px;font-weight:600;color:var(--text-3);letter-spacing:.4px;text-transform:uppercase}
.pulse-value{font-size:20px;font-weight:500;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pulse-note{font-size:14px;color:var(--text-3)}
.router-chip{color:var(--green);background:var(--green-tint);padding:3px 10px;border-radius:6px;font-size:14px;font-weight:600}
.proposal-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px}
.prop-card{display:flex;flex-direction:column;gap:14px}
.prop-head{display:flex;align-items:center;gap:10px}
.prop-repo{font-size:20px;font-weight:600;letter-spacing:.2px}
.prop-avatar{
  width:34px;height:34px;border-radius:9px;flex:none;display:grid;place-items:center;
  font-family:var(--mono);font-size:13px;font-weight:600;color:var(--text-2);
  background:linear-gradient(160deg,#1a1b1d,#101112);
  box-shadow:rgb(27,28,30) 0 0 0 1px,inset 0 1px 0 rgba(255,255,255,.07);
}
.prop-intent{font-size:16px;font-weight:500;line-height:1.5}
.prop-stats{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.landing-chip{font-size:12px;font-weight:600;padding:3px 10px;border-radius:6px}
.landing-chip.ready{color:var(--green);background:var(--green-tint)}
.landing-chip.withheld{color:var(--red);background:var(--red-tint)}
.checks-strip{display:flex;gap:6px;flex-wrap:wrap}
.prop-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto;padding-top:6px}
.prop-blocked{
  border:1px solid hsla(0,100%,69%,.3);background:var(--red-tint);border-radius:12px;
  padding:12px 14px;font-size:14px;color:var(--text-2);display:flex;flex-direction:column;gap:8px;
}
.prop-blocked .mono{color:var(--text-2)}
.conflict-panel{
  position:relative;overflow:hidden;border:1px solid hsla(0,100%,69%,.3);border-radius:var(--radius-card);
  background:linear-gradient(180deg,hsla(0,100%,69%,.055),hsla(0,100%,69%,.015));
  padding:20px 20px 20px 28px;
}
.conflict-panel::before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:6px;
  background:repeating-linear-gradient(-45deg,var(--red) 0 9px,transparent 9px 18px);opacity:.8;
}
.conflict-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.conflict-file{font-family:var(--mono);font-size:16px;font-weight:600;color:var(--text)}
.pair-chip{font-family:var(--mono);font-size:13px;font-weight:600;padding:4px 11px;border-radius:6px;background:var(--surface-2);color:var(--text)}
.pair-x{color:var(--red);font-weight:600}
.kind-chip{font-size:12px;font-weight:600;padding:3px 10px;border-radius:6px;color:var(--yellow);background:var(--yellow-tint)}
.conflict-detail{color:var(--text-3);font-size:14px;margin-top:10px}
.judge-mini{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.verdict-chip{font-size:13px;font-weight:700;letter-spacing:.6px;padding:5px 14px;border-radius:6px}
.verdict-chip.escalate{color:var(--red);background:var(--red-tint);box-shadow:inset 0 0 0 1px hsla(0,100%,69%,.35)}
.verdict-chip.confirm{color:var(--yellow);background:var(--yellow-tint);box-shadow:inset 0 0 0 1px hsla(43,100%,60%,.35)}
.verdict-chip.act{color:var(--green);background:var(--green-tint);box-shadow:inset 0 0 0 1px hsla(151,59%,59%,.35)}
.verdict-chip.fail{color:var(--text-3);background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--border-strong)}
.judge-code{font-family:var(--mono);font-size:13px;color:var(--text-2)}

/* receipt */
.receipt{display:flex;flex-direction:column;gap:2px}
.receipt-row{display:grid;grid-template-columns:200px 1fr;gap:14px;padding:9px 0;border-bottom:1px solid var(--border);align-items:baseline}
.receipt-row:last-child{border-bottom:none}
.receipt-key{font-size:14px;font-weight:500;color:var(--text-3)}
.receipt-val{font-family:var(--mono);font-size:13px;color:var(--text-2);word-break:break-word}
.receipt-val .pass-inline{color:var(--green);font-weight:600}
.audit-line{
  margin-top:16px;padding:12px 14px;border-radius:10px;background:var(--surface-2);
  font-family:var(--mono);font-size:13px;color:var(--text-2);display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;
}
.audit-line .audit-tag{color:var(--green);font-weight:600}

/* ============ ticker ============ */
.ticker{
  position:fixed;left:0;right:0;bottom:0;z-index:45;
  background:rgba(7,8,10,.9);backdrop-filter:blur(14px);border-top:1px solid var(--border);
  height:46px;display:flex;align-items:center;gap:0;padding:0 16px;overflow:hidden;
}
.ticker-label{font-size:12px;font-weight:600;color:var(--text-3);letter-spacing:.5px;text-transform:uppercase;margin-right:14px;flex:none}
.ticker-track{display:flex;gap:8px;align-items:center;overflow:hidden;flex:1}
.tick-event{
  display:inline-flex;align-items:center;gap:8px;padding:4px 12px;border-radius:6px;flex:none;
  background:var(--surface-2);font-size:13px;font-weight:500;color:var(--text-2);
  animation:tickIn .35s cubic-bezier(.2,.7,.3,1) both;
}
.tick-event .tick-name{font-family:var(--mono);font-size:12px;color:var(--blue)}
.tick-event .tick-when{color:var(--text-4);font-size:12px;font-family:var(--mono)}
@keyframes tickIn{from{opacity:0;transform:translateY(10px) scale(.96)}to{opacity:1;transform:none}}

/* ============ overlays ============ */
.overlay{
  position:fixed;inset:0;z-index:60;display:none;align-items:flex-start;justify-content:center;
  background:rgba(3,4,6,.62);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  padding:7vh 20px 20px;overflow-y:auto;
}
.overlay.open{display:flex}
.sheet{
  width:min(960px,100%);background:var(--surface);border-radius:var(--radius-card);
  box-shadow:rgba(0,0,0,.5) 0 0 0 2px,rgba(255,255,255,.19) 0 0 14px,rgb(7,8,10) 0 0 0 1px inset;
  animation:sheetIn .22s cubic-bezier(.2,.7,.3,1) both;
}
@keyframes sheetIn{from{opacity:0;transform:translateY(14px) scale(.975)}to{opacity:1;transform:none}}
.sheet-head{display:flex;align-items:center;gap:12px;padding:18px 22px;border-bottom:1px solid var(--border)}
.sheet-title{font-size:20px;font-weight:600;letter-spacing:.2px}
.sheet-body{padding:22px}
.sheet-foot{display:flex;align-items:center;gap:10px;padding:16px 22px;border-top:1px solid var(--border)}
.icon-btn{
  width:34px;height:34px;border-radius:8px;display:grid;place-items:center;color:var(--text-3);
  font-size:18px;font-weight:500;transition:background .15s,color .15s;flex:none;
}
.icon-btn:hover{background:var(--surface-2);color:var(--text)}

/* merge modal */
.mode-banner{
  display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:10px;margin-bottom:18px;
  font-size:14px;font-weight:500;
}
.mode-banner.preview{background:var(--blue-tint);color:var(--blue)}
.mode-banner.conflict{background:var(--red-tint);color:var(--red)}
.mode-banner.withheld{background:var(--yellow-tint);color:var(--yellow)}
.file-tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:18px;flex-wrap:wrap}
.file-tab{
  padding:8px 14px;font-family:var(--mono);font-size:13px;font-weight:500;color:var(--text-3);
  border-radius:8px 8px 0 0;border-bottom:2px solid transparent;transition:color .15s,border-color .15s;
}
.file-tab:hover{color:var(--text)}
.file-tab.active{color:var(--text);border-bottom-color:var(--blue)}
.diff{
  background:#0a0b0d;border:1px solid var(--border);border-radius:12px;overflow:hidden;
  font-family:var(--mono);font-size:13px;line-height:1.65;letter-spacing:.2px;
}
.diff-hunk{
  padding:6px 14px;color:var(--text-3);background:#101216;border-bottom:1px solid var(--border);
  font-size:12px;font-weight:600;letter-spacing:.3px;
}
.diff-line{display:flex;padding:0 14px;white-space:pre;min-width:max-content}
.diff-line .ln{width:34px;flex:none;text-align:right;padding-right:12px;color:#3d3e40;user-select:none;font-size:12px}
.diff-line .sign{width:18px;flex:none;user-select:none;font-weight:700}
.diff-line.ctx{color:var(--text-3)}
.diff-line.add{background:hsla(151,59%,59%,.09);color:#bfe6cf}
.diff-line.add .sign{color:var(--green)}
.diff-line.del{background:hsla(0,100%,69%,.09);color:#f3c1c1}
.diff-line.del .sign{color:var(--red)}
.diff3{border:1px solid hsla(0,100%,69%,.35);border-radius:12px;overflow:hidden}
.diff3-marker{
  padding:7px 14px;font-weight:700;font-size:12px;letter-spacing:.4px;background:#171315;
  border-top:1px solid var(--border);border-bottom:1px solid var(--border);
}
.diff3-marker.ours{color:var(--blue)}
.diff3-marker.theirs{color:var(--red)}
.diff3-marker.sep{color:var(--yellow)}
.diff3-side{border-top:1px solid var(--border)}
.diff3-side:first-of-type{border-top:none}
.diff3-side .diff-line.add{background:hsla(202,100%,67%,.08);color:#c4e0f7}
.diff3-side .diff-line.add .sign{color:var(--blue)}
.diff3-side .diff-line.del{background:hsla(0,100%,69%,.07);color:#f3c1c1}
.secret-box{
  border:1px solid hsla(43,100%,60%,.35);background:linear-gradient(180deg,hsla(43,100%,60%,.07),hsla(43,100%,60%,.02));
  border-radius:12px;padding:16px 18px;display:flex;flex-direction:column;gap:12px;
}
.secret-keys{display:flex;gap:8px;flex-wrap:wrap}
.secret-key{font-family:var(--mono);font-size:13px;font-weight:600;padding:4px 12px;border-radius:6px;background:var(--surface-2);color:var(--text-2)}
.granted-box{
  border:1px solid hsla(151,59%,59%,.35);background:var(--green-tint);border-radius:12px;padding:14px 16px;
  font-family:var(--mono);font-size:13px;color:var(--text);word-break:break-all;line-height:1.7;
}
.comments{margin-top:22px;display:flex;flex-direction:column;gap:12px}
.comment{display:flex;gap:12px}
.comment-avatar{
  width:30px;height:30px;border-radius:50%;flex:none;display:grid;place-items:center;
  background:linear-gradient(160deg,#232427,#141517);font-size:12px;font-weight:700;color:var(--blue);
  box-shadow:0 0 0 1px var(--border-strong);
}
.comment-body{flex:1;min-width:0}
.comment-meta{font-size:13px;color:var(--text-3);margin-bottom:3px}
.comment-meta b{color:var(--text-2);font-weight:600}
.comment-text{font-size:15px;color:var(--text-2);line-height:1.5}
.comment-form{display:flex;gap:10px;margin-top:6px}
.comment-form input{
  flex:1;background:var(--bg);border:1px solid rgba(255,255,255,.08);border-radius:var(--radius-ui);
  padding:10px 14px;font-size:15px;font-weight:500;
}
.comment-form input::placeholder{color:var(--text-4)}
.comment-form input:focus{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-tint);outline:none}

/* drawer */
.drawer-scrim{position:fixed;inset:0;z-index:65;background:rgba(3,4,6,.5);opacity:0;pointer-events:none;transition:opacity .25s}
.drawer-scrim.open{opacity:1;pointer-events:auto}
.drawer{
  position:fixed;top:0;right:0;bottom:0;width:min(540px,100vw);z-index:70;
  background:var(--surface);box-shadow:rgba(0,0,0,.5) 0 0 0 2px,rgba(255,255,255,.19) 0 0 14px,rgb(7,8,10) 0 0 0 1px inset;
  transform:translateX(102%);transition:transform .3s cubic-bezier(.2,.7,.3,1);
  display:flex;flex-direction:column;
}
.drawer.open{transform:none}
.drawer-head{display:flex;align-items:center;gap:12px;padding:20px 24px;border-bottom:1px solid var(--border)}
.drawer-body{padding:24px;overflow-y:auto;flex:1}
.drawer-foot{padding:16px 24px;border-top:1px solid var(--border);display:flex;gap:10px}
.stagger>*{animation:riseIn .45s cubic-bezier(.2,.7,.3,1) both;animation-delay:calc(var(--i,0)*55ms)}
@keyframes riseIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.variant-toggle{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0 18px}
.variant-btn{
  padding:8px 16px;border-radius:86px;font-size:14px;font-weight:600;letter-spacing:.3px;color:var(--text-3);
  box-shadow:0 0 0 1px rgba(255,255,255,.1);transition:all .15s;
}
.variant-btn:hover{color:var(--text)}
.variant-btn.active{color:var(--text);background:var(--surface-2);box-shadow:0 0 0 1px var(--border-strong),inset 0 1px 0 rgba(255,255,255,.1)}
.render-only{
  display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:600;color:var(--yellow);
  background:var(--yellow-tint);padding:4px 11px;border-radius:6px;letter-spacing:.3px;
}
.verdict-copy{
  border:1px solid var(--border);border-left:3px solid var(--red);border-radius:10px;
  padding:14px 16px;font-size:15px;color:var(--text-2);line-height:1.55;background:var(--bg);
}
.verdict-copy.confirm{border-left-color:var(--yellow)}
.verdict-copy.act{border-left-color:var(--green)}
.verdict-copy.fail{border-left-color:var(--text-4)}
.judge-section{margin-bottom:22px}
.judge-label{font-size:12px;font-weight:600;color:var(--text-3);letter-spacing:.5px;text-transform:uppercase;margin-bottom:10px}
.skipped-list{display:flex;flex-direction:column;gap:6px}
.skipped-item{font-family:var(--mono);font-size:13px;color:var(--text-2);padding:8px 12px;border-radius:8px;background:var(--surface-2);display:flex;gap:10px}
.skipped-item .sk-tag{color:var(--yellow);font-weight:600}
.failcopy{
  border:1px solid var(--border-strong);border-radius:12px;padding:16px 18px;background:var(--bg);
  font-size:15px;color:var(--text-2);line-height:1.6;
}
.failcopy b{color:var(--red)}

/* ============ command palette ============ */
.palette-wrap{position:fixed;inset:0;z-index:80;display:none;padding:16vh 20px 20px;background:rgba(3,4,6,.5)}
.palette-wrap.open{display:flex;justify-content:center;align-items:flex-start}
.palette{
  width:min(600px,100%);background:var(--surface);border-radius:14px;overflow:hidden;
  box-shadow:rgba(0,0,0,.5) 0 0 0 2px,rgba(255,255,255,.19) 0 0 18px,rgb(7,8,10) 0 0 0 1px inset;
  animation:sheetIn .18s cubic-bezier(.2,.7,.3,1) both;
}
.palette-input-row{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--border)}
.palette-input-row input{
  flex:1;background:transparent;border:none;font-size:17px;font-weight:500;letter-spacing:.2px;color:var(--text);
}
.palette-input-row input::placeholder{color:var(--text-4)}
.palette-input-row input:focus{outline:none}
.palette-list{max-height:min(380px,50vh);overflow-y:auto;padding:8px}
.palette-item{
  display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:10px 12px;border-radius:8px;
  font-size:15px;font-weight:500;color:var(--text-2);
}
.palette-item .pi-icon{
  width:26px;height:26px;border-radius:7px;flex:none;display:grid;place-items:center;font-size:12px;
  background:var(--surface-2);color:var(--text-3);box-shadow:inset 0 0 0 1px var(--border);
}
.palette-item .pi-hint{margin-left:auto;font-size:12px;color:var(--text-4);font-family:var(--mono)}
.palette-item.selected{background:var(--blue-tint);color:var(--text)}
.palette-item.selected .pi-icon{color:var(--blue)}
.palette-empty{padding:22px;text-align:center;color:var(--text-4);font-size:14px}
.palette-foot{display:flex;gap:16px;padding:10px 16px;border-top:1px solid var(--border);font-size:12px;color:var(--text-4)}

/* ============ files browser ============ */
.repo-picker{display:flex;gap:4px;background:var(--surface-2);padding:4px;border-radius:10px;width:max-content;margin-bottom:20px}
.repo-pick{padding:7px 16px;border-radius:7px;font-family:var(--mono);font-size:13px;font-weight:600;color:var(--text-3);transition:all .15s}
.repo-pick:hover{color:var(--text)}
.repo-pick.active{background:var(--surface);color:var(--text);box-shadow:rgba(0,0,0,.28) 0 1.189px 2.377px}
.files-layout{display:grid;grid-template-columns:250px 1fr;gap:20px;align-items:start}
.file-tree{border:1px solid var(--border);border-radius:12px;padding:10px;background:var(--surface)}
.tree-row{
  display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:6px 10px;border-radius:7px;
  font-size:14px;font-weight:500;color:var(--text-2);font-family:var(--mono);font-size:13px;
}
.tree-row:hover{background:var(--surface-2);color:var(--text)}
.tree-row.active{background:var(--blue-tint);color:var(--text)}
.tree-row .tree-glyph{color:var(--text-4);width:14px;text-align:center;flex:none;font-size:11px}
.tree-row.secret .tree-glyph{color:var(--yellow)}
.breadcrumb{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:13px;color:var(--text-3);margin-bottom:14px;flex-wrap:wrap}
.breadcrumb .crumb-sep{color:var(--text-4)}
.viewer{border:1px solid var(--border);border-radius:12px;overflow:hidden;background:#0a0b0d;min-height:320px}
.viewer-head{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--border);background:#101216}
.viewer-title{font-family:var(--mono);font-size:13px;font-weight:600;color:var(--text-2)}
.viewer-raw{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--blue);text-decoration:none}
.viewer-raw:hover{text-decoration:underline}
.viewer-raw.withheld{color:var(--text-4);pointer-events:none}
.code-view{padding:14px 0;overflow-x:auto}
.code-line{display:flex;padding:0 16px;white-space:pre;font-family:var(--mono);font-size:13px;line-height:1.7;color:var(--text-2)}
.code-line .ln{width:36px;flex:none;text-align:right;padding-right:14px;color:#3d3e40;user-select:none;font-size:12px}
.binary-meta{display:flex;flex-direction:column;gap:0;padding:8px 0}
.binary-row{display:grid;grid-template-columns:160px 1fr;gap:14px;padding:10px 16px;border-bottom:1px solid var(--border)}
.binary-row:last-child{border-bottom:none}
.binary-key{font-size:13px;font-weight:500;color:var(--text-3)}
.binary-val{font-family:var(--mono);font-size:13px;color:var(--text-2)}
.binary-posture{padding:18px 16px;color:var(--text-4);font-size:14px}

/* ============ history ============ */
.commit-list{display:flex;flex-direction:column;gap:8px}
.commit-row{
  display:flex;align-items:center;gap:14px;padding:14px 18px;border:1px solid var(--border);border-radius:12px;
  background:var(--surface);width:100%;text-align:left;transition:border-color .15s,transform .15s;
}
.commit-row:hover{border-color:rgba(255,255,255,.14);transform:translateY(-1px)}
.commit-sha{font-family:var(--mono);font-size:14px;font-weight:600;color:var(--blue);flex:none}
.commit-msg{font-size:15px;font-weight:500;flex:1;min-width:0}
.commit-meta{font-size:13px;color:var(--text-3);font-family:var(--mono);flex:none}
.commit-detail{display:flex;flex-direction:column;gap:16px}
.changed-file{
  display:flex;align-items:center;gap:12px;padding:12px 16px;border:1px solid var(--border);border-radius:10px;
  background:var(--bg);flex-wrap:wrap;
}
.status-word{font-size:12px;font-weight:700;letter-spacing:.4px;padding:3px 10px;border-radius:6px;text-transform:uppercase}
.status-word.modified{color:var(--yellow);background:var(--yellow-tint)}
.status-word.added{color:var(--green);background:var(--green-tint)}
.asset-chip{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:12px;padding:3px 10px;border-radius:6px;background:var(--surface-2);color:var(--text-2)}
.root-note{
  border:1px solid var(--border);border-left:3px solid var(--blue);border-radius:10px;background:var(--bg);
  padding:12px 16px;font-size:14px;color:var(--text-2);
}

/* ============ forks ============ */
.fork-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:16px}
.cluster-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cluster-chip{
  display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:8px;background:var(--bg);
  border:1px solid var(--border);font-size:13px;
}
.cluster-name{color:var(--text-3);font-weight:500;flex:1}
.cluster-val{font-family:var(--mono);font-size:13px;font-weight:600;color:var(--text)}
.cluster-val.unmeasured{color:var(--text-4);font-weight:500;font-style:italic}
.policy-chips{display:flex;gap:6px;flex-wrap:wrap}
.lineage{font-size:13px;color:var(--text-3);font-family:var(--mono)}

/* ============ sessions ============ */
.session-list{display:flex;flex-direction:column;gap:10px}
.session-row{display:flex;align-items:center;gap:16px;padding:16px 18px;border:1px solid var(--border);border-radius:12px;background:var(--surface);flex-wrap:wrap}
.state-dot{width:10px;height:10px;border-radius:50%;flex:none}
.state-dot.working{background:var(--green);animation:pulse 1.8s ease-in-out infinite}
.state-dot.idle{background:#4a4b4d}
.session-name{font-family:var(--mono);font-size:15px;font-weight:600}
.session-intent{font-size:15px;font-weight:500;flex:1;min-width:200px}
.session-last{font-size:13px;color:var(--text-3);font-family:var(--mono)}
.steer-panel{margin-top:28px}
.steer-panel textarea{
  width:100%;min-height:88px;resize:vertical;background:var(--bg);border:1px solid rgba(255,255,255,.08);
  border-radius:var(--radius-ui);padding:12px 14px;font-size:15px;font-weight:500;line-height:1.5;
}
.steer-panel textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-tint);outline:none}
.steer-panel textarea::placeholder{color:var(--text-4)}
.steer-foot{display:flex;align-items:center;gap:12px;margin-top:10px}
.char-count{font-family:var(--mono);font-size:12px;color:var(--text-4)}
.steer-note{margin-top:12px;font-size:14px;color:var(--text-3);display:flex;gap:8px;align-items:baseline}
.steer-note .note-tag{color:var(--yellow);font-weight:600;font-size:12px;letter-spacing:.3px;text-transform:uppercase}

/* ============ issues ============ */
.issue-list{display:flex;flex-direction:column;gap:10px}
.issue-row{display:flex;align-items:center;gap:14px;padding:16px 18px;border:1px solid var(--border);border-radius:12px;background:var(--surface);flex-wrap:wrap}
.kind-chip{font-size:12px;font-weight:700;letter-spacing:.4px;padding:4px 11px;border-radius:6px;text-transform:uppercase}
.kind-chip.conflict{color:var(--red);background:var(--red-tint)}
.kind-chip.withheld-secret{color:var(--yellow);background:var(--yellow-tint)}
.kind-chip.stale-base{color:var(--blue);background:var(--blue-tint)}
.kind-chip.blocked-intent{color:var(--text-3);background:var(--surface-2)}
.sev{font-size:12px;font-weight:700;padding:4px 11px;border-radius:86px;letter-spacing:.3px}
.sev.high{color:var(--red);background:var(--red-tint)}
.sev.block{color:var(--red);background:var(--red-tint);box-shadow:inset 0 0 0 1px hsla(0,100%,69%,.4)}
.sev.low{color:var(--text-3);background:var(--surface-2)}
.sev.medium{color:var(--yellow);background:var(--yellow-tint)}
.issue-desc{flex:1;min-width:220px;font-size:15px;color:var(--text-2)}
.issue-repo{font-family:var(--mono);font-size:13px;color:var(--text-3)}

/* ============ tables ============ */
.table-wrap{border:1px solid var(--border);border-radius:12px;overflow:hidden}
table{width:100%;border-collapse:collapse;font-size:15px}
th{
  text-align:left;font-size:12px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;color:var(--text-3);
  padding:12px 16px;background:#101216;border-bottom:1px solid var(--border);
}
td{padding:13px 16px;border-bottom:1px solid var(--border);vertical-align:top}
tr:last-child td{border-bottom:none}
tbody tr{transition:background .12s}
tbody tr:hover{background:rgba(255,255,255,.02)}
.verdict-cell{display:flex;align-items:center;gap:8px}
.verdict-word{font-size:12px;font-weight:700;letter-spacing:.4px;padding:3px 10px;border-radius:6px;text-transform:uppercase}
.verdict-word.exceeds{color:var(--green);background:var(--green-tint)}
.verdict-word.parity{color:var(--blue);background:var(--blue-tint)}
.verdict-word.below{color:var(--red);background:var(--red-tint)}
.evidence{font-family:var(--mono);font-size:13px;color:var(--text-3)}

/* ============ skeletons ============ */
.sk{
  border-radius:8px;
  background:linear-gradient(90deg,#141517 25%,#1d1e20 40%,#141517 60%);
  background-size:400% 100%;animation:shimmer 1.15s ease-in-out infinite;
}
@keyframes shimmer{from{background-position:100% 0}to{background-position:0 0}}
.sk-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px}
.sk-card{height:240px;border-radius:var(--radius-card)}
.sk-line{height:14px;margin:10px 0}
.sk-row{height:52px;border-radius:12px;margin-bottom:10px}
.sk-block{height:340px;border-radius:12px}

/* ============ tour ============ */
.tour-scrim{position:fixed;inset:0;z-index:90;display:none}
.tour-scrim.open{display:block}
.tour-hole{
  position:fixed;z-index:91;display:none;border-radius:12px;pointer-events:none;
  box-shadow:0 0 0 9999px rgba(3,4,6,.78),0 0 0 2px var(--blue),rgba(255,255,255,.25) 0 0 18px;
  transition:all .3s cubic-bezier(.2,.7,.3,1);
}
.tour-card{
  position:fixed;z-index:92;width:min(400px,calc(100vw - 32px));display:none;
  background:var(--surface);border-radius:14px;padding:22px;
  box-shadow:rgba(0,0,0,.5) 0 0 0 2px,rgba(255,255,255,.19) 0 0 18px;
  animation:sheetIn .25s cubic-bezier(.2,.7,.3,1) both;
}
.tour-card.open{display:block}
.tour-step-label{font-size:12px;font-weight:700;color:var(--blue);letter-spacing:.5px;text-transform:uppercase}
.tour-title{font-size:20px;font-weight:600;margin:8px 0 8px;letter-spacing:.2px}
.tour-text{font-size:15px;color:var(--text-2);line-height:1.6}
.tour-foot{display:flex;align-items:center;gap:10px;margin-top:18px}
.tour-dots{display:flex;gap:6px;margin-right:auto}
.tour-dot{width:7px;height:7px;border-radius:50%;background:var(--border-strong);transition:background .2s}
.tour-dot.on{background:var(--blue)}

/* ============ responsive ============ */
@media (max-width:1100px){
  .stat-chips{display:none}
}
@media (max-width:900px){
  .nav{overflow-x:auto;scrollbar-width:none}
  .nav::-webkit-scrollbar{display:none}
  .pulse-strip{grid-template-columns:1fr}
  .files-layout{grid-template-columns:1fr}
  .header-inner{gap:12px}
  .console-title{font-size:30px}
}
</style>
</head>
<body>

<header class="app-header">
  <div class="header-inner">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true"></div>
      <span class="brand-name">NextGit</span>
      <span class="brand-tag">console</span>
    </div>
    <div class="stat-chips" id="stat-chips" aria-label="Proposal stats"></div>
    <nav class="nav" id="main-nav" aria-label="Primary"></nav>
    <div class="header-actions">
      <button class="conn-toggle" id="conn-toggle" data-action="toggleConn" aria-pressed="true" aria-label="Toggle connection live or polling">
        <span class="dot live" id="conn-dot"></span><span id="conn-label">live</span>
      </button>
      <button class="palette-btn" data-action="openPalette" aria-label="Open command palette">
        <span class="kbd">⌘</span><span class="kbd">K</span><span>Command</span>
      </button>
    </div>
  </div>
</header>

<main id="main">
  <section class="view" data-view="console" aria-label="Triage console"></section>
  <section class="view" data-view="files" aria-label="Files browser"></section>
  <section class="view" data-view="history" aria-label="History"></section>
  <section class="view" data-view="forks" aria-label="Forks and signals"></section>
  <section class="view" data-view="sessions" aria-label="Sessions"></section>
  <section class="view" data-view="issues" aria-label="Issues"></section>
  <section class="view" data-view="agents" aria-label="Agents and harnesses"></section>
  <section class="view" data-view="parity" aria-label="Parity dashboard"></section>
</main>

<footer class="ticker" aria-label="Event stream">
  <span class="ticker-label">Stream</span>
  <div class="ticker-track" id="ticker-track"></div>
</footer>

<!-- merge modal -->
<div class="overlay" id="merge-overlay" role="dialog" aria-modal="true" aria-label="Merge modal">
  <div class="sheet" id="merge-sheet"></div>
</div>

<!-- land drawer -->
<div class="drawer-scrim" id="land-scrim" data-action="closeLand"></div>
<aside class="drawer" id="land-drawer" role="dialog" aria-modal="true" aria-label="Land flow">
  <div id="land-content" style="display:flex;flex-direction:column;height:100%"></div>
</aside>

<!-- judge drawer -->
<div class="drawer-scrim" id="judge-scrim" data-action="closeJudge"></div>
<aside class="drawer" id="judge-drawer" role="dialog" aria-modal="true" aria-label="Judge panel">
  <div id="judge-content" style="display:flex;flex-direction:column;height:100%"></div>
</aside>

<!-- command palette -->
<div class="palette-wrap" id="palette-wrap" data-action="closePalette">
  <div class="palette" role="dialog" aria-modal="true" aria-label="Command palette" data-action="paletteStop">
    <div class="palette-input-row">
      <span style="color:var(--text-4)" aria-hidden="true">⌘</span>
      <input id="palette-input" type="text" placeholder="Type a command or search…" autocomplete="off" spellcheck="false" aria-label="Command search"/>
      <span class="kbd">esc</span>
    </div>
    <div class="palette-list" id="palette-list" role="listbox"></div>
    <div class="palette-foot">
      <span><span class="kbd">↑</span> <span class="kbd">↓</span> navigate</span>
      <span><span class="kbd">↵</span> run</span>
      <span><span class="kbd">esc</span> close</span>
    </div>
  </div>
</div>

<!-- tour -->
<div class="tour-scrim" id="tour-scrim"></div>
<div class="tour-hole" id="tour-hole"></div>
<div class="tour-card" id="tour-card" role="dialog" aria-modal="true" aria-label="Guided tour"></div>

<script>
"use strict";
/* ================= NextGit prototype — inline store + interactions ================= */

const $  = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* ---------- fake dataset (verbatim per PROTOTYPE-BRIEF.md) ---------- */
const STATS = [["proposals",5],["shared",1],["conflicts",1],["changed",4],["clean",3]];

const PROPOSALS = [
  {repo:"agent-1", intent:"Refactor: session refresh with TTL", file:"src/auth.ts", plus:4, minus:1,

function flattenTree(repo){
  const rows = [];
  const walk = (nodes, prefix) => {
    for(const n of nodes){
      const path = prefix ? `${prefix}/${n.name}` : `${repo}/${n.name}`;
      if(n.type === "dir" || n.children){
        rows.push({dir:true, name:n.name, path});
        walk(n.children || [], path);
      } else {
        rows.push({dir:false, name:n.name, path, binary:!!n.binary, secret:!!n.secret});
      }
    }
  };
  // dirs first: sort each level by type then name
  const sorted = [...FILE_TREES[repo]].sort((a,b) => ((b.type==="dir"?1:0) - (a.type==="dir"?1:0)) || a.name.localeCompare(b.name));
  walk(sorted, "");
  return rows;
}

function treeHTML(repo){
  const rows = flattenTree(repo);
  return rows.map(r => {
    const active = !r.dir && state.files.file === r.path;
    const glyph = r.dir ? "▸" : (r.secret ? "◉" : (r.binary ? "▦" : "·"));
    const indent = (r.path.split("/").length - 2) * 14;
    return `<button class="tree-row ${r.secret?"secret":""} ${active?"active":""}" style="padding-left:${10+indent}px"
      data-action="${r.dir?"noop":"filesFile"}" data-arg="${esc(r.path)}" ${r.dir?'aria-disabled="true"':""}>
      <span class="tree-glyph">${glyph}</span><span>${esc(r.name)}</span>
      ${r.secret?'<span style="margin-left:auto;font-size:10px;color:var(--yellow);font-weight:700;letter-spacing:.4px">SECRET</span>':""}
    </button>`;
  }).join("");
}

  let n = 1;
  const ctx = DIFF3.contextBefore.map(t => diffLineHTML(" ", t, n++));
  const ours = DIFF3.ours.map(t => diffLineHTML("+", t, n++));
  const theirs = DIFF3.theirs.map(t => diffLineHTML("-", t, n++));
  const after = DIFF3.contextAfter.map(t => diffLineHTML(" ", t, n++));
  return `
  <div class="diff diff3" role="img" aria-label="diff3 conflict in src/auth.ts">
    <div class="diff-hunk">@@ src/auth.ts · refreshSession · 1 conflict pair — ours: agent-1, theirs: agent-2 @@</div>
    ${ctx.join("")}
    <div class="diff3-side">
      <div class="diff3-marker ours">&lt;&lt;&lt;&lt;&lt;&lt;&lt; ours — agent-1 (Refactor: session refresh with TTL)</div>
      ${ours.join("")}
    </div>
    <div class="diff3-side">
      <div class="diff3-marker sep">=======</div>
    </div>
    <div class="diff3-side">
      <div class="diff3-marker theirs">&gt;&gt;&gt;&gt;&gt;&gt;&gt; theirs — agent-2 (rotate-on-refresh)</div>
      ${theirs.join("")}
    </div>
    ${after.join("")}
  </div>`;
}

function cleanDiffHTML(repo, file){
  const d = CLEAN_DIFFS[repo + "/" + file];
  if(!d) return `<div class="empty-note" style="padding:20px">No diff content recorded for ${esc(file)} in this prototype.</div>`;
  let num = 1;
  return `<div class="diff">${d.hunks.map(h =>
    `<div class="diff-hunk">${esc(h.head)}</div>` +
    h.lines.map(([s,t]) => diffLineHTML(s, t, num++)).join("")
  ).join("")}</div>`;
}

/* ================= tour ================= */
function startTour(){ state.tour = 0; gotoTourStep(0, true); }
function closeTour(){
  state.tour = -1;
  $("#tour-scrim").classList.remove("open");
  $("#tour-hole").style.display = "none";
  $("#tour-card").classList.remove("open");
}
function gotoTourStep(i, force){
  state.tour = i;
  const step = TOUR_STEPS[i];
  if(step.repo){ state.files = {repo:step.repo, file:step.file || null, loading:false}; }
  if(state.view !== step.view || force){
    showView(step.view);
    setTimeout(renderTour, 460);
  } else {
    renderTour();
  }
}
function renderTour(){
  if(state.tour < 0) return;
  const step = TOUR_STEPS[state.tour];
  $("#tour-scrim").classList.add("open");
  const hole = $("#tour-hole");
  const card = $("#tour-card");
  const target = step.target ? $(step.target) : null;
  if(target){
    const r = target.getBoundingClientRect();
    const pad = 9;
    hole.style.display = "block";
    hole.style.top = (r.top - pad) + "px";
    hole.style.left = (r.left - pad) + "px";
    hole.style.width = (r.width + pad*2) + "px";
    hole.style.height = (r.height + pad*2) + "px";
    // place card below target if room, else above; clamp horizontally
    const cw = Math.min(400, window.innerWidth - 32);
    let cx = Math.max(16, Math.min(r.left, window.innerWidth - cw - 16));
    let cy = r.bottom + pad + 14;
    if(cy + 300 > window.innerHeight) cy = Math.max(16, r.top - pad - 14 - 300);
    card.style.left = cx + "px";
    card.style.top = cy + "px";
    card.style.transform = "none";
  } else {
    hole.style.display = "none";
    card.style.left = "50%";
    card.style.top = "16vh";
    card.style.transform = "translateX(-50%)";
  }
  card.classList.add("open");
  card.innerHTML = `
    <div class="tour-step-label">Step ${state.tour+1} of ${TOUR_STEPS.length}</div>
    <div class="tour-title">${esc(step.title)}</div>
    <div class="tour-text">${esc(step.text)}</div>
    <div class="tour-foot">
      <div class="tour-dots">${TOUR_STEPS.map((_,d)=>`<span class="tour-dot ${d===state.tour?"on":""}"></span>`).join("")}</div>
      ${state.tour > 0 ? `<button class="btn btn-ghost btn-sm" data-action="tourBack">Back</button>` : ``}
      ${state.tour < TOUR_STEPS.length-1 ? `<button class="btn btn-sec btn-sm" data-action="tourNext">Next →</button>` : `<button class="btn btn-cta btn-sm" data-action="tourClose">Finish</button>`}
      <button class="btn btn-ghost btn-sm" data-action="tourClose">Skip</button>
    </div>`;
}

/* ================= ticker ================= */
function pushEvent(name, target, animate){
  state.ticker.unshift({name, target, at:clockNow(), fresh:animate !== false});
  if(state.ticker.length > 8) state.ticker.pop();
  renderTicker();
}
function renderTicker(){
  $("#ticker-track").innerHTML = state.ticker.map((e,i)=>`
    <span class="tick-event ${i===0 && e.fresh ? "new":""}">
      <span class="tick-name">${esc(e.name)}</span><span>${esc(e.target)}</span><span class="tick-when num">${esc(e.at)}</span>
    </span>`).join("");
  // clear freshness flags after paint
  setTimeout(()=>{ state.ticker.forEach(e => e.fresh = false); }, 400);
}
function scheduleTicker(){
  clearInterval(state.tickTimer);
  const cadence = state.connection === "live" ? 2600 : 4200;
  state.tickTimer = setInterval(()=>{
    const ev = EVENT_POOL[state.tickIdx % EVENT_POOL.length];
    state.tickIdx++;
    pushEvent(ev.name, ev.target);
  }, cadence);
}

/* ================= connection ================= */
function toggleConn(){
  state.connection = state.connection === "live" ? "polling" : "live";
  const dot = $("#conn-dot");
  dot.classList.toggle("live", state.connection === "live");
  dot.classList.toggle("polling", state.connection === "polling");
  $("#conn-label").textContent = state.connection;
  $("#conn-toggle").setAttribute("aria-pressed", state.connection === "live");
  scheduleTicker();
  pushEvent("connection." + state.connection, state.connection === "live" ? "fast" : "slow");
}

function openJudge(){
  state.judgeOpen = true;
  $("#judge-scrim").classList.add("open");
  $("#judge-drawer").classList.add("open");
  $("#judge-content").innerHTML = renderJudge();
}
function closeJudge(){
  state.judgeOpen = false;
  $("#judge-scrim").classList.remove("open");
  $("#judge-drawer").classList.remove("open");
  $("#judge-content").innerHTML = "";
}

function closeTop(){
  if(state.tour >= 0){ closeTour(); return; }
  if(state.judgeOpen){ closeJudge(); return; }
  if(state.land){ closeLand(); return; }
  if(state.merge){ closeMerge(); return; }
  if(state.paletteOpen){ closePalette(); return; }
}

/* ---------- global event delegation ---------- */
document.addEventListener("click", (e) => {
  const t = e.target.closest("[data-action]");
  if(!t) return;
  const a = t.dataset.action;
  const arg = t.dataset.arg;
  switch(a){
    case "nav": showView(arg); break;
    case "toggleConn": toggleConn(); break;
    case "openPalette": openPalette(); break;
    case "closePalette": closePalette(); break;
    case "paletteStop": e.stopPropagation(); break;
    case "openMerge": { const p = JSON.parse(arg); openMerge(p.repo, p.mode); break; }
    case "closeMerge": closeMerge(); break;
    case "mergeTab": state.merge.tab = arg; $("#merge-sheet").innerHTML = renderMergeModal(); break;
    case "landArm": landArm(arg); break;
    case "landConfirm": state.land.step = "confirm"; $("#land-content").innerHTML = renderLand(); break;
    case "landArmBack": state.land.step = "arm"; $("#land-content").innerHTML = renderLand(); break;
    case "landVariant": state.land.variant = arg; $("#land-content").innerHTML = renderLand(); break;
    case "landRecord": state.land.noted = true; $("#land-content").innerHTML = renderLand(); break;
    case "closeLand": closeLand(); break;
    case "openJudge": openJudge(); break;
    case "closeJudge": closeJudge(); break;
    case "revealSecret": {
      state.revealed.add(arg);
      if(state.merge){ $("#merge-sheet").innerHTML = renderMergeModal(); }
      else { renderView("files", true); }
      break;
    }
    case "gotoSecret": {
      state.files = {repo:arg, file:arg + "/config/.env", loading:false};
      showView("files");
      break;
    }
    case "gotoFiles": { state.files = {repo:arg.repo, file:arg.file, loading:false}; showView("files"); break; }
    case "filesRepo": {
      state.files.repo = arg;
      state.files.file = null;
      renderView("files");
      break;
    }
    case "filesFile": {
      state.files.file = arg;
      renderView("files", true);
      break;
    }
    case "histCommit": state.hist.sha = arg; renderView("history", true); break;
    case "histBack": state.hist.sha = null; renderView("history", true); break;
    case "commentSend": {
      const input = $("#comment-input");
      const text = (input && input.value || "").trim();
      if(!text) break;
      const file = arg;
      (state.comments[file] = state.comments[file] || []).push({who:"john", line:1, text, at:"just now"});
      $("#merge-sheet").innerHTML = renderMergeModal();
      const ta = $("#comment-input");
      if(ta) { ta.focus(); }
      break;
    }
    case "steerSend": {
      const ta = $("#steer-input");
      const text = (ta && ta.value || "").trim();
      if(!text) { if(ta) ta.focus(); break; }
      pushEvent("session.steered", state.steerSession + " · \"" + (text.length > 42 ? text.slice(0,42) + "…" : text) + "\"");
      state.steerNote = true;
      ta.value = "";
      $("#steer-count").textContent = "0 / 500";
      renderView("sessions");
      break;
    }
    case "tourStart": startTour(); break;
    case "tourNext": gotoTourStep(Math.min(state.tour+1, TOUR_STEPS.length-1)); break;
    case "tourBack": gotoTourStep(Math.max(state.tour-1, 0)); break;
    case "tourClose": closeTour(); break;
    case "noop": break;
  }
});

document.addEventListener("input", (e) => {
  if(e.target.id === "palette-input"){
    state.paletteQuery = e.target.value;
    state.paletteSel = 0;
    renderPalette();
  }
  if(e.target.id === "steer-input"){
    const n = e.target.value.length;
    $("#steer-count").textContent = n + " / 500";
  }
});

document.addEventListener("change", (e) => {
  if(e.target.id === "steer-select"){ state.steerSession = e.target.value; }
});

document.addEventListener("keydown", (e) => {
  if((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k"){
    e.preventDefault();
    if(state.paletteOpen) closePalette(); else openPalette();
    return;
  }
  if(e.key === "Escape"){ closeTop(); return; }
  if(state.paletteOpen){
    const matches = paletteMatches();
    if(e.key === "ArrowDown"){ e.preventDefault(); state.paletteSel = Math.min(state.paletteSel+1, matches.length-1); renderPalette(); }
    else if(e.key === "ArrowUp"){ e.preventDefault(); state.paletteSel = Math.max(state.paletteSel-1, 0); renderPalette(); }
    else if(e.key === "Enter"){ e.preventDefault(); runPaletteItem(state.paletteSel); }
  }
  if(state.tour >= 0 && !state.paletteOpen){
    if(e.key === "ArrowRight") gotoTourStep(Math.min(state.tour+1, TOUR_STEPS.length-1));
    if(e.key === "ArrowLeft") gotoTourStep(Math.max(state.tour-1, 0));
  }
});

/* palette list clicks (delegation on the list itself) */
$("#palette-list").addEventListener("click", (e) => {
  const item = e.target.closest("[data-palette-idx]");
  if(item) runPaletteItem(Number(item.dataset.paletteIdx));
});
$("#palette-list").addEventListener("mousemove", (e) => {
  const item = e.target.closest("[data-palette-idx]");
  if(item){
    const i = Number(item.dataset.paletteIdx);
    if(i !== state.paletteSel){ state.paletteSel = i; renderPalette(); }
  }
});

window.addEventListener("resize", () => { if(state.tour >= 0) renderTour(); });

/* ================= boot ================= */
renderHeader();
showView("console");
// seed ticker with the brief's event list (newest first)
["repo.landed demo","repo.pushed agent-2","token.minted","repo.pushed agent-3","session.steered agent-1","repo.pushed agent-1"]
  .forEach(s => { const [name, ...rest] = s.split(" "); state.ticker.push({name, target:rest.join(" "), at:clockNow(), fresh:false}); });
state.ticker.reverse();
state.ticker.forEach((e,i) => { if(i===0) e.fresh = true; });
renderTicker();
scheduleTicker();
</script>
</body>
</html>
