    <script>
      /*
        Frame 02 — the messy landing. One paused timeline, built synchronously.
        Every element owns exactly ONE tween (a keyframed fromTo where it needs two
        moves), so the from-state is explicit and the shot is correct at any seek.
      */
      const tl = gsap.timeline({ paused: true });

      /* The composition's length IS the timeline's: pin it to the frame's 8.5s. */
      const hfDriver = { t: 0 };
      tl.to(hfDriver, { t: 8.5, duration: 8.5, ease: "none" }, 0);

      /* ---- Scene 1 (0.0–2.6): "five change-sets" builds word-by-word --------------
         dynamic-content-sequencing: each word's window is derived from its own
         content length, pre-computed once here — never in an update loop. */
      const HF_BASE_DURATION = 0.16;
      const HF_SEC_PER_CHAR = 0.045;
      const HF_HOLD_MID = 0.22;
      const HF_START_PAD = 0.1;
      const HF_A_ENTRANCE_DUR = 0.45;
      const HF_A_EXIT_AT = [2.6, 2.66];
      const HF_A_EXIT_DUR = 0.34;

      let hfCumulative = HF_START_PAD;
      const HF_WORD_TIMELINE = [
        { sel: ".hf-02-messy-landing-word-a1", text: "five", exitX: -180 },
        { sel: ".hf-02-messy-landing-word-a2", text: "change-sets", exitX: 180 },
      ].map((entry, i) => {
        const duration = HF_BASE_DURATION + entry.text.length * HF_SEC_PER_CHAR + HF_HOLD_MID;
        const start = hfCumulative;
        hfCumulative += duration;
        return { ...entry, start, end: hfCumulative, exitAt: HF_A_EXIT_AT[i] };
      });

      HF_WORD_TIMELINE.forEach((entry) => {
        const hold = Math.max(0, entry.exitAt - (entry.start + HF_A_ENTRANCE_DUR));
        tl.fromTo(
          entry.sel,
          { opacity: 0, y: 26 },
          {
            keyframes: [
              { opacity: 1, y: 0, duration: HF_A_ENTRANCE_DUR, ease: "power3.out" },
              { opacity: 1, y: 0, duration: hold, ease: "none" },
              {
                x: entry.exitX,
                opacity: 0,
                scale: 0.94,
                duration: HF_A_EXIT_DUR,
                ease: "power2.in",
              },
            ],
          },
          entry.start,
        );
      });

      /* ---- Scene 1 → 2: the five chips, one origin -------------------------------
         center-outward-expansion: each chip lerps from the shared center to its
         data-target offset, holds, then the SAME machinery runs inward — the
         collapse that becomes "src/auth.ts". */
      const HF_CHIPS = gsap.utils.toArray(".hf-02-messy-landing-chip");
      const HF_BURST_AT = 2.2;
      const HF_EXPAND_DUR = 0.3;
      const HF_EXPAND_STAGGER = 0.035;
      const HF_CHIP_HOLD = 0.8;
      const HF_CONVERGE_DUR = 0.5;

      HF_CHIPS.forEach((el, i) => {
        const targetX = Number(el.dataset.targetX);
        const targetY = Number(el.dataset.targetY);
        tl.fromTo(
          el,
          { xPercent: -50, yPercent: -50, x: 0, y: 0, scale: 0.6, opacity: 0 },
          {
            keyframes: [
              {
                x: targetX,
                y: targetY,
                scale: 1,
                opacity: 1,
                duration: HF_EXPAND_DUR,
                ease: "power3.out",
              },
              {
                x: targetX,
                y: targetY,
                scale: 1,
                opacity: 1,
                duration: HF_CHIP_HOLD,
                ease: "none",
              },
              { x: 0, y: 0, scale: 0.5, opacity: 0, duration: HF_CONVERGE_DUR, ease: "power2.in" },
            ],
          },
          HF_BURST_AT + i * HF_EXPAND_STAGGER,
        );
      });

      /* ---- Scene 2 (2.6–5.0): "one shared file —" lands in the same slot ---------- */
      const HF_B_AT = 3.02;
      const HF_B_STAGGER = 0.1;
      [
        ".hf-02-messy-landing-word-b1",
        ".hf-02-messy-landing-word-b2",
        ".hf-02-messy-landing-word-b3",
      ].forEach((sel, i) => {
        tl.fromTo(
          sel,
          { opacity: 0, y: 26 },
          { opacity: 1, y: 0, duration: 0.42, ease: "power3.out" },
          HF_B_AT + i * HF_B_STAGGER,
        );
      });

      /* The collision, resolved: the mono line lands, then the box frames it. */
      tl.fromTo(
        ".hf-02-messy-landing-srctext",
        { opacity: 0, y: 14 },
        { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" },
        4.05,
      );
      tl.fromTo(
        ".hf-02-messy-landing-srcbox",
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.42, ease: "power3.out" },
        4.28,
      );

      /* ---- Scene 3 (5.0–8.5): the real conflicts capture, then the secret tag ----
         Masked slide: the plate travels up inside its clipping window (it is out of
         frame — and invisible — until its cue). */
      tl.fromTo(
        ".hf-02-messy-landing-plate",
        { y: 200 },
        { y: 0, duration: 0.85, ease: "power3.out" },
        5.0,

        ".hf-02-messy-landing-env",
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.5, ease: "power3.out" },
        6.4,
      );
