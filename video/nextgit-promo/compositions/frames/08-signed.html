  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      var ID = "08-signed";
      var DURATION = 6;

      /* slot geometry: one source row band (144px @2x) per 288px item */
      var ITEM_H = 288;
      var STEPS = 4;
      var STEP_DUR = 0.16;
      var STEP_START = 1.9;
      var STEP_SPACING = 0.65;

      /* the verification command — real code, typed in states */
      var CMD = "node platform/scripts/attest-verify.mjs --commit \u003csha\u003e";
      var TYPE_START = 4.94;
      var TYPE_END = 5.6;
      var BLINK_OFF = 5.66;
      var BLINK_ON = 5.9;
      var CREAM = "#e6edf3";
      var ORANGE = "#58a6ff";
      var DIM = "#57657a";
      var SEQUENCE = [
        { t: TYPE_START, text: "", color: CREAM },
        { t: 5.0, text: "node ", color: CREAM },
        { t: 5.08, text: "node platform/", color: CREAM },
        { t: 5.18, text: "node platform/scripts/attest-verify.mjs", color: ORANGE },
        { t: 5.34, text: "node platform/scripts/attest-verify.mjs --commit", color: CREAM },
        { t: 5.44, text: CMD, color: DIM },
        { t: 5.58, text: CMD, color: CREAM },
      ];

      function entryAt(time) {
        for (var i = SEQUENCE.length - 1; i >= 0; i--) {
          if (time >= SEQUENCE[i].t) return SEQUENCE[i];
        }
        return null;
      }

      /* one blink after the keys stop landing; pure function of time, never state */
      function caretVisible(time) {
        if (time < TYPE_START) return false;
        if (time < TYPE_END) return true;
        return !(time >= BLINK_OFF && time < BLINK_ON);
      }

      function build() {
        var tl = gsap.timeline({ paused: true });

        var innerEl = document.getElementById("f08-slot-inner");
        var textEl = document.getElementById("f08-cmd-text");
        var caretEl = document.getElementById("f08-caret");
        var springs = [];
        for (var i = 0; i < STEPS; i++) springs.push({ p: 0 });

        /* the whole frame's state, derived from the rendered time */
        function syncState() {
          var time = tl.time();
          var sum = 0;
          for (var j = 0; j < springs.length; j++) sum += springs[j].p;
          innerEl.style.transform = "translateY(" + -sum * ITEM_H + "px)";

          var entry = entryAt(time);
          textEl.textContent = entry ? entry.text : "";
          caretEl.style.background = entry ? entry.color : CREAM;
          caretEl.style.opacity = caretVisible(time) ? "1" : "0";
        }

        /* ── Scene 1 (0.0–1.4): the anchor lands, the rule draws, then it pins ── */
        tl.fromTo(
          ".f08-toprule",
          { scaleX: 0 },
          { scaleX: 1, duration: 0.5, ease: "power3.out", transformOrigin: "left center" },
          0.08,
        );
        tl.fromTo(
          "#f08-anchor",
          { opacity: 0, scale: 0.94 },
          { opacity: 1, scale: 1, duration: 0.72, ease: "power3.out" },
          0.12,
        );

        var upath = document.querySelector(".f08-underline-path");
        var ulen = upath.getTotalLength();
        upath.style.strokeDasharray = String(ulen);
        upath.style.strokeDashoffset = String(ulen);
        tl.fromTo(upath, { strokeDashoffset: ulen }, { strokeDashoffset: 0, duration: 0.7, ease: "power2.out" }, 0.58);

        /* ── Scene 2 (1.4–4.8): the slot steps, four rows over the window ── */
        tl.fromTo("#f08-slot", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power1.out" }, 1.48);
        tl.fromTo(
          "#f08-badgemark",
          { opacity: 0, scale: 0.94 },
          { opacity: 1, scale: 1, duration: 0.45, ease: "power3.out" },
          1.52,
        );

        springs.forEach(function (spring, k) {
          tl.to(
            spring,
            { p: 1, duration: STEP_DUR, ease: "steps(1)" },
            STEP_START + k * STEP_SPACING,
          );
        });

        /* the two independent copies pop beside the anchor, in sequence */
        tl.fromTo(
          "#f08-tag-1",
          { opacity: 0, scale: 0, y: 8 },
          { opacity: 1, scale: 1, y: 0, duration: 0.45, ease: "power3.out", transformOrigin: "right center" },
          2.95,
        );
        tl.fromTo(
          "#f08-tag-2",
          { opacity: 0, scale: 0, y: 8 },
          { opacity: 1, scale: 1, y: 0, duration: 0.45, ease: "power3.out", transformOrigin: "right center" },
          3.35,
        );

        /* ── Scene 3 (4.8–6.0): verify it yourself ── */
        tl.fromTo("#f08-cmd", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.35, ease: "power2.out" }, 4.84);

        /* a linear driver over the whole shot: the frame's state is a pure function of
           the rendered time, so any seek — forward, backward, straight to the end —
           rebuilds the same ticker offset, command text and caret. */
        var driver = { t: 0 };
        tl.to(driver, { t: DURATION, duration: DURATION, ease: "none", onUpdate: syncState }, 0);

        tl.eventCallback("onUpdate", syncState);
        syncState();

        window.__timelines = window.__timelines || {};
        window.__timelines[ID] = tl;
        tl.seek(0);
        return tl;
      }

      /* The host index already loads gsap; the frame carries its own load too, so a
         standalone/preview mount builds the same timeline. */
      if (window.gsap && typeof window.gsap.timeline === "function") {
        build();
      } else {
        window.addEventListener("load", function () {
          if (window.gsap && typeof window.gsap.timeline === "function") build();
        });
      }
    })();
  </script>
