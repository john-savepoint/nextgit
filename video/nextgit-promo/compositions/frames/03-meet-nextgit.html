  <script>
    window.__timelines = window.__timelines || {};

    const tl = gsap.timeline({ paused: true });

    // ---- camera: ONE state object, ONE writer, seeded punched-in on the card's check strip ----
    const world = document.getElementById("ng03-world");
    const CAM_OPEN = { scale: 2.1, x: 1046, y: -261.2 };
    const camera = { scale: CAM_OPEN.scale, x: CAM_OPEN.x, y: CAM_OPEN.y };
    function applyCamera() {
      world.style.transform =
        "translate(" + camera.x + "px, " + camera.y + "px) scale(" + camera.scale + ")";
    }
    applyCamera();

    // ---- Scene 1 (0.0-2.6): full-bleed close-up, refocus, check chips pop in ----
    tl.fromTo(
      "#ng03-blur",
      { "--dof": "5px" },
      { "--dof": "0px", duration: 0.3, ease: "power2.out" },
      0,
    );
    tl.set("#ng03-blur", { filter: "none" }, 0.3);

    const CHIP_AT = 0.35;
    const CHIP_STAGGER = 0.085;
    const CHIP_DUR = 0.42;
    for (let i = 1; i <= 5; i++) {
      const at = CHIP_AT + (i - 1) * CHIP_STAGGER;
      tl.set("#ng03-mask-" + i, { autoAlpha: 0 }, at);
      tl.fromTo(
        "#ng03-chip-" + i,
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: CHIP_DUR, ease: "power3.out" },
        at,
      );
    }

    // ---- Scene 2 (2.6-4.6): the one decelerating pull-back; camera never moves again ----
    tl.fromTo(
      camera,
      { scale: CAM_OPEN.scale, x: CAM_OPEN.x, y: CAM_OPEN.y },
      { scale: 1, x: 0, y: 0, duration: 1.85, ease: "expo.out", onUpdate: applyCamera },
      2.65,
    );

    // ---- Scene 3 (4.6-6.5): locked wide; element-level payoff ----
    tl.fromTo("#ng03-scrim", { opacity: 0 }, { opacity: 1, duration: 0.45, ease: "power2.out" }, 4.6);
    tl.fromTo(
      "#ng03-wordmark",
      { opacity: 0, scale: 0.965, y: 14 },
      { opacity: 1, scale: 1, y: 0, duration: 0.62, ease: "power3.out" },
      4.72,
    );
    tl.fromTo(
      "#ng03-rule",
      { scaleX: 0, opacity: 0 },
      { scaleX: 1, opacity: 1, duration: 0.32, ease: "power3.out" },

      { opacity: 0, y: 8 },
      { opacity: 1, y: 0, duration: 0.42, ease: "power3.out" },
      5.9,
    );
