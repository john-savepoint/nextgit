  <script>
    (function () {
      var ID = "07-secrets";
      var DURATION = 12.5;

      function build() {
        var tl = gsap.timeline({ paused: true });

        var toprule = document.getElementById("f07-toprule");

        var s1 = document.getElementById("f07-s1");
        var plateFrame = document.getElementById("f07-plate-frame");
        var walker = document.getElementById("f07-walker");
        var chipDb = document.getElementById("f07-chip-db");
        var chipRedis = document.getElementById("f07-chip-redis");

        var s2 = document.getElementById("f07-s2");
        var bandImg = document.getElementById("f07-band-img");
        var ruleTop = document.getElementById("f07-bandrule-top");
        var ruleBot = document.getElementById("f07-bandrule-bot");
        var btnBox = document.getElementById("f07-btnbox");
        var glow = document.getElementById("f07-glow");

        var s3 = document.getElementById("f07-s3");
        var macroImg = document.getElementById("f07-macro-img");
        var tagL = document.getElementById("f07-tag-left");
        var tagR = document.getElementById("f07-tag-right");

        /* ── the hairline lands ───────────────────────────────────── */
        tl.fromTo(
          [toprule],
          { opacity: 0, scaleX: 0.55 },
          { opacity: 1, scaleX: 1, duration: 0.5, ease: "power2.out" },
          0.2
        );

        /* ── scene 1 (0.0-3.4) · the plate settles as "secrets stay typed" lands ── */
        tl.fromTo(
          plateFrame,
          { opacity: 0, scale: 1.06, filter: "blur(10px)", y: 20 },
          { opacity: 1, scale: 1, filter: "blur(0px)", y: 0, duration: 0.85, ease: "power3.out" },
          0.1
        );

        /* the accent box walks the card's blocked badges in two tl.set steps */
        tl.set(walker, { left: 208, top: 255, width: 166, height: 71 }, 0);
        tl.fromTo(walker, { opacity: 0, scale: 1.12 }, { opacity: 1, scale: 1, duration: 0.3, ease: "power3.out" }, 1.45);
        tl.set(walker, { left: 629, top: 692, width: 240, height: 66 }, 2.6);

        /* the two key chips glint once: a single accent glow envelope */
        tl.fromTo(
          [chipDb, chipRedis],
          { opacity: 0, boxShadow: "0 0 0px rgba(88,166,255,0)" },
          { opacity: 1, boxShadow: "0 0 18px 2px rgba(88,166,255,0.45)", duration: 0.3, ease: "power2.out" },
          3.0
        );
        tl.to(
          [chipDb, chipRedis],
          { opacity: 0, boxShadow: "0 0 0px rgba(88,166,255,0)", duration: 0.45, ease: "power2.in" },
          3.3
        );

        /* ── scene 2 (3.4-7.6) · velocity-matched zoom-through into the viewer ── */
        tl.to(s1, { scale: 1.85, filter: "blur(16px)", duration: 0.85, ease: "power3.in" }, 3.4);
        tl.to(s1, { opacity: 0, duration: 0.42, ease: "power2.in" }, 3.4);
        tl.fromTo(
          s2,
          { scale: 1.5, filter: "blur(16px)", opacity: 0 },
          { scale: 1, filter: "blur(0px)", opacity: 1, duration: 1.0, ease: "power3.out" },
          3.45
        );
        /* the masked push-in: the strip slides up behind the band's own clip */
        tl.fromTo(bandImg, { scale: 1.06, y: 30 }, { scale: 1, y: 0, duration: 1.1, ease: "power3.out" }, 3.45);
        tl.fromTo([ruleTop, ruleBot], { opacity: 0, scaleX: 0.7 }, { opacity: 1, scaleX: 1, duration: 0.6, ease: "power2.out" }, 3.6);
        /* the showcase camera keeps pushing for the rest of the phase */
        tl.to(bandImg, { scale: 1.035, duration: 3.0, ease: "none" }, 4.55);

        /* the annotation: accent box + press-release spring on the plate's own reveal button */
        tl.fromTo(btnBox, { opacity: 0, scale: 1.35 }, { opacity: 1, scale: 1, duration: 0.35, ease: "power3.out" }, 5.6);
        tl.to(btnBox, { scale: 0.97, duration: 0.12, ease: "none" }, 5.95);
        tl.to(btnBox, { scale: 1, duration: 0.5, ease: "elastic.out(1, 0.55)" }, 6.07);
        tl.fromTo(glow, { opacity: 0, scale: 0.94 }, { opacity: 0.55, scale: 1.12, duration: 0.18, ease: "power2.out" }, 6.07);
        tl.to(glow, { opacity: 0, scale: 1.32, duration: 0.35, ease: "power2.out" }, 6.25);

        /* ── scene 3 (7.6-12.5) · seam onto the revealed value line, 3x ── */
        tl.to(s2, { scale: 1.9, filter: "blur(14px)", duration: 0.8, ease: "power3.in" }, 7.6);
        tl.to(s2, { opacity: 0, duration: 0.42, ease: "power2.in" }, 7.6);
        tl.fromTo(
          s3,
          { scale: 1.28, filter: "blur(16px)", opacity: 0 },
          { scale: 1, filter: "blur(0px)", opacity: 1, duration: 1.0, ease: "power3.out" },

        tl.fromTo(macroImg, { scale: 1.05, y: 26 }, { scale: 1, y: 0, duration: 1.1, ease: "power3.out" }, 7.65);
        tl.to(macroImg, { scale: 1.03, duration: 3.6, ease: "none" }, 8.75);

        /* the two mono tags settle either side of the real revealed value line */
        tl.fromTo(tagL, { opacity: 0, x: -26 }, { opacity: 1, x: 0, duration: 0.5, ease: "power2.out" }, 9.4);
        tl.fromTo(tagR, { opacity: 0, x: 26 }, { opacity: 1, x: 0, duration: 0.5, ease: "power2.out" }, 11.0);

        /* hold to the cut: the slow camera push carries the last second */
        tl.set({}, {}, DURATION);

        window.__timelines = window.__timelines || {};
        window.__timelines[ID] = tl;
        tl.seek(0);
        return tl;
      }

      /* template transport: the gsap script tag is a sibling above, so a
         standalone/preview mount builds the same timeline. */
      if (window.gsap && typeof window.gsap.timeline === "function") {
        build();
      } else {
        window.addEventListener("load", function () {
          if (window.gsap && typeof window.gsap.timeline === "function") build();
        });
      }
    })();
