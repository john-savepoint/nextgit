      <div data-hf-id="hf-ej6w" id="f05-world" data-layout-allow-overflow>
        <div data-hf-id="hf-oilw" class="f05-plate" id="f05-plate-a">

  <script>
    (function () {
      "use strict";

      var tl = gsap.timeline({ paused: true });

      var world = document.getElementById("f05-world");
      var box = document.getElementById("f05-box");
      var rule = document.getElementById("f05-rule");
      var ann1 = document.getElementById("f05-ann1");
      var ann2 = document.getElementById("f05-ann2");

      /* ── camera: ONE state object, ONE writer ───────────────────────────
         world coords: plate A 0–1920, plate B 1920–3840, plate C 3840–5760
         leg 1 target: the pair row of the conflicts card   → scale 1.7
         leg 2 target: the diff3 marker block of the pane    → scale 1.4   */
      var cam = { scale: 1, x: 0, y: 0 };
      function applyCamera() {
        world.style.transform =
          "translate3d(" + cam.x + "px," + cam.y + "px,0) scale(" + cam.scale + ")";
      }
      applyCamera();

      /* ── seam blur, proxy-tweened (seek-safe) ── */
      var seam = { v: 0 };
      function applyBlur() {
        world.style.filter = seam.v > 0.02 ? "blur(" + seam.v.toFixed(3) + "px)" : "none";
      }
      applyBlur();

      /* ── tracking box: derived FROM the target, every frame ──
         static variant — the target (the agent-1 ↔ agent-2 pair row) does not
         travel; the box re-fits around it with a low-amplitude size jitter. */
      var ROW = { x: 960, y: 830 };
      var BW = 1000;
      var BH = 300;
      var BVAR = 16;
      var BFREQ = 1.4;
      var drv = { p: 0 };
      function fitBox() {
        var w = BW + Math.sin(drv.p * BFREQ) * BVAR;
        var h = BH + Math.sin(drv.p * BFREQ + Math.PI / 2) * BVAR;
        box.style.width = w + "px";
        box.style.height = h + "px";
        box.style.left = ROW.x - w / 2 + "px";
        box.style.top = ROW.y - h / 2 + "px";
      }
      fitBox();

      /* ── Scene 1 (0.0–2.6) · dive onto the pair row, spotlight locks on ── */
      tl.fromTo(
        rule,
        { scaleX: 0 },
        { scaleX: 1, duration: 0.7, ease: "power2.out", transformOrigin: "left center" },
        0.12,
      );

      tl.to(
        cam,
        { scale: 1.7, x: -672, y: -800, duration: 1.4, ease: "power2.out", onUpdate: applyCamera },
        0.35,
      );
      tl.to(cam, { scale: 1.714, duration: 0.75, ease: "sine.inOut", onUpdate: applyCamera }, 1.75);

      tl.fromTo(
        box,
        { opacity: 0, scale: 0.62 },
        { opacity: 1, scale: 1, duration: 0.5, ease: "back.out(1.7)" },
        2.28,
      );
      tl.to(drv, { p: 11.0, duration: 5.72, ease: "none", onUpdate: fitBox }, 2.28);
      tl.to(box, { scale: 1.045, duration: 0.16, ease: "power2.out" }, 2.8);
      tl.to(box, { scale: 1, duration: 0.26, ease: "power2.inOut" }, 2.96);

      /* ── Scene 2 (2.6–5.6) · velocity-matched zoom-through seam, then annotate ── */
      tl.to(cam, { scale: 1.98, duration: 0.4, ease: "power2.in", onUpdate: applyCamera }, 2.55);
      tl.to(
        cam,
        { x: -5418, y: -400, scale: 1.44, duration: 1.3, ease: "power2.inOut", onUpdate: applyCamera },
        2.95,
      );
      tl.to(seam, { v: 6, duration: 0.65, ease: "power2.in", onUpdate: applyBlur }, 2.95);
      tl.to(seam, { v: 0, duration: 0.75, ease: "power2.out", onUpdate: applyBlur }, 3.6);
      tl.to(
        cam,
        { x: -5392, y: -400, scale: 1.4, duration: 0.35, ease: "power3.out", onUpdate: applyCamera },
        4.25,
      );

      tl.fromTo(ann1, { opacity: 0, x: -28 }, { opacity: 1, x: 0, duration: 0.5, ease: "power2.out" }, 4.9);
      tl.fromTo(ann2, { opacity: 0, x: -28 }, { opacity: 1, x: 0, duration: 0.5, ease: "power2.out" }, 5.35);

      /* ── Scene 3 (5.6–8.0) · locked; the box jitter carries it to rest ── */

      window.__timelines["05-collision"] = tl;
      tl.seek(0);
    })();
  </script>
