          var t = CUES[i];

            t,

          tl.fromTo(

            { opacity: 0, x: -10 },
            { opacity: 1, x: 0, duration: 0.45, ease: "power2.out" },
            t + 0.1,

        // annotation ticks settle on the parity tile just after it lands

        /* ── Phase D (5.5–7.5s): the not-built ledger types in, then its rule draws ── */

        var LEDGER = "below parity: session-steering \u00b7 agent-federation \u00b7 issues \u00b7 ci";

        function textAt(time) {
          for (var i = SEQUENCE.length - 1; i >= 0; i--) {
            if (time >= SEQUENCE[i].t) return SEQUENCE[i].text;

        var textEl = document.querySelector(".f10-ledger-text");

          blink,
          {
            p: Math.PI * 2 * BLINK_CYCLES,
            duration: DURATION,
            ease: "none",
