  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    const tl = gsap.timeline({ paused: true });

    const DUR = 8.5;
    const ACCENT = "#58a6ff";
    const MUTED = "#8b9bb0";

    /* ============================================================
       Scene 1 · the annotation line types on
       discrete-text-sequence (sparse states + reverse search) with a
       context-sensitive cursor (colour per segment, sin blink,
       non-blinking while characters are landing).
       ============================================================ */
    const WORDS = [
      { w: "on" },
      { w: "the" },
      { w: "merge.", accent: true },
      { w: "on" },
      { w: "the" },
      { w: "file.", accent: true },
      { w: "on" },
      { w: "line", accent: true },
      { w: "3." },
    ];
    const T0 = 1.0; // "Comment on the merge"
    const CHAR_DT = 0.05; // keystroke cluster
    const BREAK = 0.06; // word-break pause
    const BREAK_P = 0.16; // pause after a full stop
    const TYPING_GRACE = 0.14;
    const BLINK_HZ = 1.1;

    const SEQ = [{ t: T0, text: "", color: MUTED }];
    {
      let t = T0;
      let text = "";
      WORDS.forEach((entry, i) => {
        if (i > 0) {
          t += WORDS[i - 1].w.endsWith(".") ? BREAK_P : BREAK;
          text += " ";
          SEQ.push({ t: +t.toFixed(3), text, color: MUTED });
        }
        for (const ch of entry.w) {
          t += CHAR_DT;
          text += ch;
          SEQ.push({ t: +t.toFixed(3), text, color: entry.accent ? ACCENT : MUTED });
        }
      });
    }
    // baked at build time — seek-safe in both directions
    const CHANGE_TIMES = SEQ.filter((e, i) => i > 0 && e.text !== SEQ[i - 1].text).map((e) => e.t);

    function entryAt(time) {
      for (let i = SEQ.length - 1; i >= 0; i--) {
        if (time >= SEQ[i].t) return SEQ[i];
      }
      return SEQ[0];
    }

    const typedEl = document.getElementById("f09-typed");
    const cursorEl = document.getElementById("f09-cursor");
    const drv = { t: 0 };
    tl.to(
      drv,
      {
        t: DUR,
        duration: DUR,
        ease: "none",
        onUpdate: () => {
          const now = drv.t;
          const entry = entryAt(now);
          typedEl.textContent = entry.text;
          cursorEl.style.background = entry.color;
          const typing = CHANGE_TIMES.some((tt) => tt <= now && now - tt < TYPING_GRACE);
          cursorEl.style.opacity =
            typing || Math.sin(2 * Math.PI * BLINK_HZ * now) > 0 ? "1" : "0";
        },
      },
      0,
    );

    /* frame holds still — stillness wins over a push that clipped edges */

    /* the plate lands centre at 78% width */
    tl.fromTo(
      "#f09-cwrap",
      { opacity: 0, y: 44 },
      { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
      0,
    );

    /* the real comment's anchor gains its 1px accent box on "merge" */
    tl.set("#f09-cbox", { opacity: 1 }, T0);
    tl.to("#f09-cbox", { opacity: 0, duration: 0.25, ease: "none" }, T0 + 0.6);

    /* ============================================================
       Scene 2 · velocity-matched zoom-through seam (Z axis, toward
       the viewer). Both plates are full-frame surfaces -> peak blur
       ／opacity must match at the cut.
       ============================================================ */
    const CUT = 3.5;
    tl.to(
      "#f09-cwrap",
      { scale: 1.2, filter: "blur(20px)", duration: 0.2, ease: "power3.in" },
      CUT - 0.2,
    );
    tl.to("#f09-cwrap", { opacity: 0.15, duration: 0.2, ease: "none" }, CUT - 0.2);
    tl.set("#f09-cwrap", { opacity: 0 }, CUT);
    tl.fromTo(
      "#f09-rwrap",
      { opacity: 0.15, scale: 0.95, filter: "blur(20px)" },
      { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.55, ease: "expo.out" },
      CUT,
    );

    /* the accent box steps card to card, left to right */
    const STEPS = [4.3, 4.7, 5.1, 5.5, 5.9];
    STEPS.forEach((t, i) => {
      if (i > 0) tl.set("#f09-rbox-" + i, { opacity: 0 }, t);
      tl.set("#f09-rbox-" + (i + 1), { opacity: 1 }, t);
    });

    /* ============================================================
       Scene 3 · the two plates stack, the payoff line lands, hold
       ============================================================ */
    tl.fromTo(
      "#f09-cwrap2",
      { opacity: 0, y: 30 },
      { opacity: 1, y: 0, duration: 0.62, ease: "power3.out" },
      5.95,
    );
    tl.fromTo(
      "#f09-line",
      { opacity: 0, y: 18 },
      { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
      4.0,
    );
    tl.to(".f09-anno", { opacity: 0, duration: 0.3, ease: "power2.out", stagger: 0.03 }, 6.78);

    window.__timelines["09-review-together"] = tl;
    tl.seek(0);
  </script>
