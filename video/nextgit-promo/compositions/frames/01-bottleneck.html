<template>
  <style>
    @font-face {
      font-family: "Barlow";
      src: url("assets/fonts/Barlow-Black.woff2") format("woff2");

    @font-face {

    @font-face {
      font-family: "IBM Plex Mono";
      src: url("assets/fonts/IBMPlexMono-Medium.woff2") format("woff2");

    /* Root styled via #root (never a class on the data-composition-id element). */
    #root {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      container-type: size;
      font-family: "Barlow", sans-serif;

    }

    /* Full-bleed ground rides on a clip layer, not on #root. */
    .f01-bg {
      position: absolute;
      inset: 0;
      background: #0a0e14;
    }

    .f01-stage {
      position: absolute;
      inset: 0;
    }

    /* Scene 1 — the pulse tick: same center anchor as the words. */
    .f01-tick {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding-bottom: 14cqh;
      font-family: "IBM Plex Mono", monospace;
      font-weight: 500;
      font-size: 1.6cqw;
      line-height: 1;
      color: #57657a;
    }

    /* Beat layers — one alone at center; hard-cut by the discrete sequencer. */
    .f01-beat {
      position: absolute;
      inset: 0;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding-bottom: 14cqh;

    .f01-h1 {
      font-weight: 800;

    .f01-w {
      display: inline-block;
      will-change: transform, opacity, filter;
    }

    /* Beat C — lead line + hero, sized so the underline spans the hero word. */
    .f01-c-inner {
      display: inline-flex;

    .f01-lead {
      display: block;

      display: inline-block;

  </style>

  <div data-hf-id="hf-0ys7" id="root" data-composition-id="01-bottleneck" data-width="1920" data-height="1080" data-duration="7">
    <div data-hf-id="hf-l4uw" class="clip f01-bg" data-start="0" data-duration="7" data-track-index="0"></div>

    <div data-hf-id="hf-8txe" class="clip f01-stage" data-start="0" data-duration="7" data-track-index="1">
      <div data-hf-id="hf-mbhw" class="f01-tick" id="f01-tick">&#8226;</div>

      <div data-hf-id="hf-gsik" class="f01-beat" id="f01-beat-a">
        <div data-hf-id="hf-ky21" class="f01-h1"><span data-hf-id="hf-1oxc" class="f01-w">five</span> <span data-hf-id="hf-vcaw" class="f01-w">agents.</span></div>
      </div>

      <div data-hf-id="hf-ro07" class="f01-beat" id="f01-beat-b">
        <div data-hf-id="hf-1i6l" class="f01-h1">one repo.</div>
      </div>

      <div data-hf-id="hf-liae" class="f01-beat" id="f01-beat-c">
        <div data-hf-id="hf-mtn0" class="f01-c-inner">
          <div data-hf-id="hf-r5cq" class="f01-lead">you&#8217;re the</div>
          <div data-hf-id="hf-1ndk" class="f01-hero"><span data-hf-id="hf-2jz7" class="f01-hero-word" id="f01-hero">bottleneck</span><span data-hf-id="hf-4xiv" class="f01-hero-per" id="f01-hero-per">.</span></div>
          <svg data-hf-id="hf-gayc" class="f01-ul" id="f01-ul" viewBox="0 0 1040 6" preserveAspectRatio="none" aria-hidden="true" focusable="false">
            <path data-hf-id="hf-d4hj" id="f01-ul-path" d="M 0 3 L 1040 3"></path>
          </svg>
        </div>
      </div>
    </div>
  </div>

  <script>
    const tl = gsap.timeline({ paused: true });

    // ---- Scene 1 (0.0–1.3) — empty field; the pulse tick fades in at 0.9 ----
    tl.fromTo("#f01-tick", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power1.out" }, 0.9);
    tl.to("#f01-tick", { opacity: 0, duration: 0.12, ease: "power1.out" }, 1.25);

    // ---- discrete-text-sequence: hard-cut whole-line states at thresholds ----
    // Sparse {t, text} states -> onUpdate reverse-searches the latest passed state
    // and swaps which beat layer is mounted. Instant swap, no animation between.
    const BEAT_SEQ = [
      { t: 1.35, key: "a" },
      { t: 2.6, key: "b" },
      { t: 3.5, key: "c" },
    ];
    const beatEls = {
      a: document.getElementById("f01-beat-a"),
      b: document.getElementById("f01-beat-b"),
      c: document.getElementById("f01-beat-c"),
    };
    function beatAt(time) {
      for (let i = BEAT_SEQ.length - 1; i >= 0; i--) {
        if (time >= BEAT_SEQ[i].t) return BEAT_SEQ[i].key;
      }
      return null;
    }
    const driver = { t: 0 };
    let lastKey = "__init__";
    tl.to(
      driver,
      {
        t: 6.5,
        duration: 6.5,
        ease: "none",
        onUpdate: () => {
          const key = beatAt(driver.t);
          if (key !== lastKey) {
            for (const k in beatEls) {
              beatEls[k].style.display = k === key ? "flex" : "none";
            }
            lastKey = key;
          }
        },
      },
      0,
    );

    // ---- Scene 2a (1.35) — per-word staggered reveal, smooth power3 settle ----
    tl.fromTo(
      ".f01-w",
      { opacity: 0, y: 22, filter: "blur(6px)" },
      { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.55, ease: "power3.out", stagger: 0.12 },
      1.35,
    );

    // ---- Scene 2c (3.5) — restrained spring-pop settle + hard-cut accent-fill snap ----
    tl.set(["#f01-hero", "#f01-hero-per"], { color: "#58a6ff" }, 3.5);
    tl.fromTo(
      ["#f01-beat-c .f01-lead", "#f01-beat-c .f01-hero"],
      { scale: 0.94, opacity: 0 },
      { scale: 1, opacity: 1, duration: 0.5, ease: "power3.out", stagger: 0.06 },
      3.5,
    );

    // ---- Scene 3 (4.6) — 1px accent underline draws left->right (svg-path-draw) ----
    const ulPath = document.getElementById("f01-ul-path");
    const ulLen = ulPath.getTotalLength();
    ulPath.style.strokeDasharray = `${ulLen}`;
    ulPath.style.strokeDashoffset = `${ulLen}`;
    tl.to(ulPath, { strokeDashoffset: 0, duration: 0.65, ease: "power2.out" }, 4.6);

    // ---- Scene 3 — small bound undulation on the settled underline (finite, ~1.4s) ----
    // sine-wave-loop, onUpdate form: sin(0)=0 at the start, so no jump off the draw tail.
    const und = { p: 0 };
    const ulEl = document.getElementById("f01-ul");
    tl.to(
      und,
      {
        p: Math.PI * 2,
        duration: 1.4,
        ease: "none",
        onUpdate: () => {
          ulEl.style.transform = `translateY(${Math.sin(und.p) * 3}px)`;
        },
      },
      5.1,
    );

    window.__timelines["01-bottleneck"] = tl;
    tl.seek(0);
  </script>
