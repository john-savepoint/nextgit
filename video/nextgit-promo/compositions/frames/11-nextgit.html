  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      var ROOT =
        document.querySelector('[data-composition-id="11-nextgit"]') ||
        document.getElementById("root");

      var camera = ROOT.querySelector('[id="11-nextgit-camera"]');
      var board = ROOT.querySelector('[id="11-nextgit-board"]');
      var vignette = ROOT.querySelector('[id="11-nextgit-vignette"]');
      var wordmark = ROOT.querySelector('[id="11-nextgit-wordmark"]');
      var hairline = ROOT.querySelector('[id="11-nextgit-hairline"]');
      var tagline = ROOT.querySelector('[id="11-nextgit-tagline"]');
      var url = ROOT.querySelector('[id="11-nextgit-url"]');

      var tl = gsap.timeline({ paused: true });

      /* ---- Scene 1 (0.0-1.7) — the triage board fills frame at 20% behind a vignette ---- */
      tl.fromTo(board, { opacity: 0 }, { opacity: 0.2, duration: 1.0, ease: "power1.out" }, 0.15);
      tl.fromTo(
        vignette,
        { opacity: 0 },
        { opacity: 1, duration: 1.2, ease: "power1.out" },
        0.3,
      );

      /* ---- the only camera motion: multi-phase steady push, <=3% over the frame ---- */
      var phase = { scale: 1.0 };
      tl.to(phase, { scale: 1.015, duration: 1.7, ease: "power2.out" }, 0);
      tl.to(phase, { scale: 1.03, duration: 3.8, ease: "sine.inOut" }, 1.7);

      /* one writer: phase scale + continuous micro-drift composed in a single update */
      var drift = { p: 0 };
      tl.to(
        drift,
        {
          p: Math.PI * 2 * 1,
          duration: 5.5,
          ease: "none",
          onUpdate: function () {
            var dx = Math.sin(drift.p) * 4;
            var dy = Math.sin(drift.p * 1.3) * 2;
            camera.style.transform =
              "scale(" + phase.scale + ") translate(" + dx + "px, " + dy + "px)";
          },
        },
        0,
      );

      /* ---- Scene 2 (1.7-3.6) — the wordmark blooms from zero on "NextGit." ---- */
      tl.fromTo(
        wordmark,
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.95, ease: "power3.out" },
        2.0,
      );

      /* the 1px accent hairline draws left -> right beneath it (measured, not guessed) */
      var hlLen = hairline.getTotalLength();
      hairline.style.strokeDasharray = "" + hlLen;
      hairline.style.strokeDashoffset = "" + hlLen;
      tl.to(hairline, { strokeDashoffset: 0, duration: 0.75, ease: "power2.out" }, 2.7);

      /* ---- Scene 3 (3.6-5.5) — tagline, then the URL, then hold still ---- */
      tl.fromTo(
        tagline,
        { opacity: 0, y: 10 },
        { opacity: 1, y: 0, duration: 0.85, ease: "power1.out" },
        3.0,
      );
      tl.to(board, { opacity: 0.12, duration: 1.0, ease: "power1.inOut" }, 3.6);
      tl.fromTo(
        url,
        { clipPath: "inset(0% 100% 0% 0%)", opacity: 0 },
        { clipPath: "inset(0% 0% 0% 0%)", opacity: 1, duration: 0.95, ease: "power2.out" },
        4.35,
      );

      window.__timelines["11-nextgit"] = tl;
    })();
