    /* Frame root — styled by #root only (never a class on the composition element).

    .f06-clip {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      /* container law: every frame-relative unit below is cqw/cqh against the 1920x1080 clip */
      container-type: size;

    /* ── clip 0 · the flat dark register ground ─────────────────────────── */

    #f06-judge-scene {

    /* camera: one slow continuous push-in runs under the whole shot.

    #f06-judge-field {

        #000 74%,
        rgba(0, 0, 0, 0) 100%
      );
      mask-image: linear-gradient(to bottom, #000 0%, #000 74%, rgba(0, 0, 0, 0) 100%);

    /* reading-side falloff: darkens the plate's empty right region under the score column */
    #f06-judge-scrim {

      top: 0;
      left: 900px;
      width: 1020px;
      height: 100%;
      background: linear-gradient(

        rgba(10, 14, 20, 0) 0%,

    /* ── annotation layer (film's own, sits above the plate and never moves) ── */

    /* ── Scene 2 · the skip row, resolved last, framed in accent ─────────── */

    }

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      var ID = "06-judge";

      function build() {
        var tl = gsap.timeline({ paused: true });

        /* ── camera: one slow continuous push-in under the whole shot ────── */
        tl.fromTo(
          "#f06-judge-field",
          { scale: 1 },
          { scale: 1.04, duration: 6, ease: "none" },
          0,
        );

        /* ── Scene 1 · the plate lands as the shot's ground ──────────────── */
        tl.fromTo(
          "#f06-judge-plate",
          { opacity: 0, y: 26 },
          { opacity: 1, y: 0, duration: 0.8, ease: "power2.out" },
          0,
        );

        tl.fromTo(
          ["#f06-judge-hair-top", "#f06-judge-hair-bot", "#f06-judge-stub"],
          { opacity: 0 },
          { opacity: 1, duration: 0.6, ease: "power2.out" },
          0.15,
        );

        /* ── Scene 1 · the plate falls back to context: the reading column's
              ground darkens, and the plate dims to 62% with a light optical
              falloff on the same window as the push-in (rack focus) ─────── */
        tl.fromTo(
          "#f06-judge-scrim",
          { opacity: 0 },
          { opacity: 1, duration: 0.9, ease: "power2.inOut" },
          1.0,
        );
        tl.to(
          "#f06-judge-plate",
          { "--dof": "1.5px", duration: 1.2, ease: "power2.inOut" },
          1.2,
        );
        tl.to("#f06-judge-plate", { opacity: 0.62, duration: 1.2, ease: "power2.inOut" }, 1.2);

        /* ── Scene 1 · the four real scores, arriving on the VO's cadence.
              counting-dynamic-scale per numeral: the value counts up while the
              transform grows to its static size (no font-size tween), and the
              count lands exactly on its cue time. The digits are stepped once per
              captured frame with a power3.out eased value curve — a plain property
              write on the seek clock, so every rendered frame is deterministic. ── */
        var COUNT = 0.85;
        var FPS = 30;
        var rows = [
          { row: "#f06-judge-row-1", score: "#f06-judge-score-1", value: 1.6028, land: 1.5 },
          { row: "#f06-judge-row-2", score: "#f06-judge-score-2", value: 1.5069, land: 2.2 },
          { row: "#f06-judge-row-3", score: "#f06-judge-score-3", value: 0.8707, land: 2.9 },
          { row: "#f06-judge-row-4", score: "#f06-judge-score-4", value: 0.7581, land: 3.5 },
        ];
        var easeOut = function (p) {
          return 1 - Math.pow(1 - p, 3);
        };

        rows.forEach(function (r) {
          var start = r.land - COUNT;
          var el = document.querySelector(r.score);
          var steps = Math.round(COUNT * FPS);
          var i;

          tl.fromTo(
            r.row,
            { opacity: 0, y: 16 },
            { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
            start - 0.3,
          );
          tl.fromTo(
            el,
            { scale: 0.94 },
            { scale: 1, duration: COUNT, ease: "power3.out" },
            start,
          );
          for (i = 1; i <= steps; i++) {
            tl.set(
              el,
              { innerText: (r.value * easeOut(i / steps)).toFixed(4) },
              start + (COUNT * i) / steps,
            );
          }
        });

        /* ── Scene 2 · the skip row resolves last, on purpose: it lifts out of
              the plate's skip-row position and settles at centre (no bounce),
              then takes one restrained accent pulse on the box. ─────────── */
        tl.fromTo(
          "#f06-judge-skip",
          { opacity: 0, x: -520, y: 60, scale: 0.97 },
          { opacity: 1, x: 0, y: 0, scale: 1, duration: 1.0, ease: "power3.out" },
          3.6,
        );
        tl.fromTo(
          "#f06-judge-skip",
          { "--pulse": 1 },
          { "--pulse": 0.26, duration: 0.2, ease: "power2.in" },
          5.3,
        );
        tl.to("#f06-judge-skip", { "--pulse": 1, duration: 0.4, ease: "power2.out" }, 5.5);

        window.__timelines = window.__timelines || {};
        window.__timelines[ID] = tl;
        tl.seek(0);
        return tl;
      }

      /* The host index already loads gsap; the frame carries its own load too, so a
         standalone/preview mount builds the same timeline. */
      if (window.gsap && typeof window.gsap.timeline === "function") {
        build();
      } else {
        window.addEventListener("load", function () {
          if (window.gsap && typeof window.gsap.timeline === "function") build();
        });
      }
    })();
  </script>
