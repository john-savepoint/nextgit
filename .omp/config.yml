# NextGit — project-scoped agent model routing (John, 2026-10-09).
#
# Layering: defaults <- global (~/.omp/agent/config.yml) <- PROJECT (this file) <- CLI <- overrides.
# Scope: this file affects ONLY this project. Global roles/agents are untouched.
# Routing: EVERY agent resolves through the **@workflows role** (canonical `@` selector —
# the role table is in the global config `modelRoles.workflows`). `&workflows` is NOT a
# selector: it resolves to nothing and silently falls back to the default role (the
# "it loads back deepseek" symptom) — always use `@`.
#
# NOTE (the override trap): `agentModelOverrides` in config BEATS per-agent `model:` fields in
# agent definitions and /agents UI overrides — those get overwritten on every resolution.
# Change models HERE (or in the global config), never in agent files alone. Change the ROLE'S
# model once in the global `modelRoles.workflows` and every agent here follows.
task:
  agentModelOverrides:
    # workers
    plan-agent: "@workflows"
    wf-implementer: "@workflows"
    wf-verifier: "@workflows"
    wf-researcher: "@workflows"
    heal-researcher: "@workflows"
    task: "@workflows"
    scout: "@workflows"
    sonic: "@workflows"
    epics-author: "@workflows"
    epics-designer: "@workflows"
    story-verifier: "@workflows"
    corpus-researcher: "@workflows"
    librarian: "@workflows"
    laguna: "@workflows"
    # gates
    security-reviewer: "@workflows"
    senior-reviewer: "@workflows"
    reviewer: "@workflows"
    compliance-reviewer: "@workflows"
    parity-auditor: "@workflows"
    designer: "@workflows"
